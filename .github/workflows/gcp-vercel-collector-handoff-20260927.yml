name: MCAI GCP to Vercel Collector Handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gcp-vercel-collector-handoff-20260927.yml'

permissions:
  contents: read

concurrency:
  group: mcai-gcp-vercel-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: rerisse7-1717s-projects
      VERCEL_ORG_ID: team_jEy8Ex9vRDBdXj1cQPKF8sRd
      VERCEL_PROJECT_ID: prj_7fk44eKUhdbfTUaXxEBMgIzZiqUM
      PROD_DEPLOYMENT_URL: https://medicalchannelai-9dukfydww-rerisse7-1717s-projects.vercel.app
      PROD_CANONICAL_URL: https://medicalchannelai.vercel.app

    steps:
      - name: Require Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo '::error::VERCEL_TOKEN missing'; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create and install production CRON_SECRET
        id: cron
        shell: bash
        run: |
          set -euo pipefail
          CRON_SECRET_VALUE="$(openssl rand -hex 32)"
          echo "::add-mask::$CRON_SECRET_VALUE"
          printf '%s' "$CRON_SECRET_VALUE" | npx --yes vercel@latest env add CRON_SECRET production \
            --force --sensitive --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          {
            echo 'value<<__MCAI_SECRET__'
            echo "$CRON_SECRET_VALUE"
            echo '__MCAI_SECRET__'
          } >> "$GITHUB_OUTPUT"

      - name: Redeploy exact existing production deployment with new environment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest redeploy "$PROD_DEPLOYMENT_URL" \
            --target=production --non-interactive --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Verify Vercel production pipeline is ready for cron
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            http="$(curl -sS --max-time 20 -o /tmp/pipeline-health.json -w '%{http_code}' "$PROD_CANONICAL_URL/api/pipeline-health" || true)"
            if [[ "$http" = "200" ]] && python3 - <<'PY'
import json
from pathlib import Path
data=json.loads(Path('/tmp/pipeline-health.json').read_text())
p=data.get('pipeline_runtime') or {}
raise SystemExit(0 if p.get('cron_secret_configured') is True and p.get('runtime_cache') is True else 1)
PY
            then
              echo 'Vercel production has CRON_SECRET and runtime cache.'
              exit 0
            fi
            sleep 10
          done
          cat /tmp/pipeline-health.json || true
          echo '::error::Vercel production did not become cron-ready after redeploy.'
          exit 1

      - name: Trigger one authenticated Vercel deep collector cycle
        shell: bash
        env:
          CRON_SECRET_VALUE: ${{ steps.cron.outputs.value }}
        run: |
          set -euo pipefail
          http="$(curl -sS --max-time 30 -o /tmp/collector-start.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET_VALUE" \
            "$PROD_CANONICAL_URL/api/collector-run")"
          cat /tmp/collector-start.json
          if [[ "$http" != "202" && "$http" != "409" ]]; then
            echo "::error::Collector start returned HTTP $http"
            exit 1
          fi

      - name: Prove Vercel Queue accepted and executed collector work
        shell: bash
        run: |
          set -euo pipefail
          progressed=0
          fresh=0
          for attempt in $(seq 1 30); do
            curl -sS --max-time 20 "$PROD_CANONICAL_URL/api/collector-status" -o /tmp/collector-status.json
            curl -sS --max-time 20 "$PROD_CANONICAL_URL/api/status" -o /tmp/service-status.json
            if python3 - <<'PY'
import json
from pathlib import Path
c=json.loads(Path('/tmp/collector-status.json').read_text()).get('collector') or {}
progress=(c.get('completed_stage_count') or 0) > 0 or c.get('active_cycle_id') is not None
raise SystemExit(0 if progress else 1)
PY
            then
              progressed=1
            fi
            if python3 - <<'PY'
import json
from pathlib import Path
s=json.loads(Path('/tmp/service-status.json').read_text())
snap=s.get('snapshot') or {}
raise SystemExit(0 if snap.get('freshness') == 'FRESH' and snap.get('source_mode') == 'RUNTIME_CACHE' else 1)
PY
            then
              fresh=1
            fi
            if [[ "$progressed" = "1" && "$fresh" = "1" ]]; then
              echo 'Vercel collector takeover proof: PASS'
              cat /tmp/service-status.json
              exit 0
            fi
            sleep 20
          done
          echo 'Collector status at timeout:'
          cat /tmp/collector-status.json || true
          echo
          echo 'Service status at timeout:'
          cat /tmp/service-status.json || true
          echo
          echo "::error::Vercel collector takeover not fully proven within bounded poll."
          exit 1
