name: Preview Browser Acceptance Once

on:
  push:
    branches:
      - chatgpt/preview-54495b1
    paths:
      - .github/workflows/preview-browser-e2e-once.yml

permissions:
  contents: read

concurrency:
  group: preview-browser-acceptance-once
  cancel-in-progress: true

jobs:
  browser:
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install isolated Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/medicalchannelai-browser-e2e
          mkdir -p /tmp/medicalchannelai-browser-e2e
          cd /tmp/medicalchannelai-browser-e2e
          npm init -y >/dev/null
          npm install playwright@1.55.0 --no-audit --no-fund
          ./node_modules/.bin/playwright install chromium

      - name: Run real protected Preview browser acceptance
        shell: bash
        env:
          PREVIEW_ORIGIN: https://medicalchannelai-5jy1quo7g-rerisse7-1717s-projects.vercel.app
          PREVIEW_SHARE_URL: https://medicalchannelai-5jy1quo7g-rerisse7-1717s-projects.vercel.app/?_vercel_share=VM2RAkNnkAROn5fXqQi46FO3JMwJO55i
          TEST_INVITE: FSD17B6D
          TEST_USERNAME: ui0p16e4rovv
          TEST_PASSWORD: nPFvVaNscjBnn7gUlL2B
        run: |
          set -euo pipefail
          cd /tmp/medicalchannelai-browser-e2e
          mkdir -p artifacts
          cat > run.cjs <<'NODE'
          const assert = require('node:assert/strict')
          const { chromium } = require('playwright')

          const origin = process.env.PREVIEW_ORIGIN
          const shareUrl = process.env.PREVIEW_SHARE_URL
          const invite = process.env.TEST_INVITE
          const username = process.env.TEST_USERNAME
          const password = process.env.TEST_PASSWORD

          function assertEnv(name, value) {
            assert.ok(value, `${name} is required`)
          }
          assertEnv('PREVIEW_ORIGIN', origin)
          assertEnv('PREVIEW_SHARE_URL', shareUrl)
          assertEnv('TEST_INVITE', invite)
          assertEnv('TEST_USERNAME', username)
          assertEnv('TEST_PASSWORD', password)

          async function waitForApp(page) {
            await page.waitForLoadState('domcontentloaded')
            await page.getByText('医疗商机助手').first().waitFor({ state: 'visible', timeout: 45_000 })
          }

          async function assertAuthenticatedPath(page, pathname) {
            await page.waitForURL((url) => url.pathname === pathname, { timeout: 45_000 })
            assert.equal(new URL(page.url()).pathname, pathname)
            const text = await page.locator('body').innerText()
            assert.ok(text.trim().length > 80, `${pathname} rendered too little content`)
            assert.ok(!text.includes('账号或密码不正确'), `${pathname} unexpectedly showed auth failure`)
          }

          ;(async () => {
            const browser = await chromium.launch({ headless: true })
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } })
            const pageErrors = []
            const bindErrors = (page) => page.on('pageerror', (error) => pageErrors.push(String(error?.stack || error)))

            const page = await context.newPage()
            bindErrors(page)

            try {
              // Vercel share URL must be exercised by a real browser so the protection bypass cookie is set.
              await page.goto(shareUrl, { waitUntil: 'domcontentloaded', timeout: 60_000 })
              await waitForApp(page)
              await page.waitForURL((url) => url.pathname === '/login', { timeout: 45_000 })
              await page.screenshot({ path: 'artifacts/01-login.png', fullPage: true })

              // Register through the actual React form.
              await page.getByRole('button', { name: '邀请码注册' }).click()
              await page.getByLabel('邀请码').fill(invite)
              await page.getByLabel('账号名').fill(username)
              await page.getByLabel('密码', { exact: true }).fill(password)
              await page.getByLabel('再次输入密码').fill(password)
              await page.getByRole('button', { name: '创建账号并进入' }).click()
              await assertAuthenticatedPath(page, '/today')

              // Confirm browser cookie attributes, not only handler-level Set-Cookie syntax.
              let cookies = await context.cookies(origin)
              let sessionCookie = cookies.find((cookie) => cookie.name === 'medopp_session')
              assert.ok(sessionCookie, 'medopp_session cookie missing after registration')
              assert.equal(sessionCookie.httpOnly, true, 'session cookie must be HttpOnly')
              assert.equal(sessionCookie.secure, true, 'session cookie must be Secure on Preview')
              assert.equal(sessionCookie.sameSite, 'Lax', 'session cookie must be SameSite=Lax')
              await page.screenshot({ path: 'artifacts/02-today-after-register.png', fullPage: true })

              // Hard refresh must retain the authenticated server session.
              await page.reload({ waitUntil: 'domcontentloaded', timeout: 60_000 })
              await assertAuthenticatedPath(page, '/today')

              // A second tab in the same browser context must share the real HttpOnly session.
              const second = await context.newPage()
              bindErrors(second)
              await second.goto(`${origin}/opportunities`, { waitUntil: 'domcontentloaded', timeout: 60_000 })
              await assertAuthenticatedPath(second, '/opportunities')
              await second.screenshot({ path: 'artifacts/03-opportunity-pool.png', fullPage: true })

              await second.goto(`${origin}/intent-followup`, { waitUntil: 'domcontentloaded', timeout: 60_000 })
              await assertAuthenticatedPath(second, '/intent-followup')
              await second.screenshot({ path: 'artifacts/04-intent-followup.png', fullPage: true })

              // Revoke the real session, then prove a protected route returns to the login UI.
              const logoutResult = await second.evaluate(async () => {
                const response = await fetch('/api/auth/logout', {
                  method: 'POST',
                  credentials: 'include',
                  headers: { Accept: 'application/json' },
                })
                return { status: response.status, body: await response.text() }
              })
              assert.equal(logoutResult.status, 200, `logout failed: ${logoutResult.body}`)

              await page.goto(`${origin}/today`, { waitUntil: 'domcontentloaded', timeout: 60_000 })
              await waitForApp(page)
              await page.waitForURL((url) => url.pathname === '/login', { timeout: 45_000 })

              // Login again through the actual React login form and re-check cookie issuance.
              await page.getByLabel('账号名').fill(username)
              await page.getByLabel('密码', { exact: true }).fill(password)
              await page.getByRole('button', { name: '登录' }).click()
              await assertAuthenticatedPath(page, '/today')
              cookies = await context.cookies(origin)
              sessionCookie = cookies.find((cookie) => cookie.name === 'medopp_session')
              assert.ok(sessionCookie, 'medopp_session cookie missing after login')
              assert.equal(sessionCookie.httpOnly, true)
              assert.equal(sessionCookie.secure, true)
              assert.equal(sessionCookie.sameSite, 'Lax')
              await page.screenshot({ path: 'artifacts/05-today-after-login.png', fullPage: true })

              // Delete only the temporary acceptance account through the application's own authenticated API.
              const deleteResult = await page.evaluate(async (passwordValue) => {
                const response = await fetch('/api/auth/delete', {
                  method: 'POST',
                  credentials: 'include',
                  headers: {
                    Accept: 'application/json',
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({ password: passwordValue }),
                })
                return { status: response.status, body: await response.text() }
              }, password)
              assert.equal(deleteResult.status, 200, `account cleanup failed: ${deleteResult.body}`)

              await page.goto(`${origin}/today`, { waitUntil: 'domcontentloaded', timeout: 60_000 })
              await waitForApp(page)
              await page.waitForURL((url) => url.pathname === '/login', { timeout: 45_000 })

              // Deleted credentials must not revive the account.
              await page.getByLabel('账号名').fill(username)
              await page.getByLabel('密码', { exact: true }).fill(password)
              await page.getByRole('button', { name: '登录' }).click()
              await page.getByText('账号或密码不正确。').waitFor({ state: 'visible', timeout: 30_000 })
              assert.equal(new URL(page.url()).pathname, '/login')

              assert.deepEqual(pageErrors, [], `Uncaught browser errors: ${pageErrors.join('\n')}`)
              console.log('REAL_PREVIEW_BROWSER_ACCEPTANCE: PASS')
              console.log('checks=anonymous_redirect,ui_register,httpOnly_secure_lax_cookie,hard_refresh,second_tab,opportunity_pool,intent_followup,logout,ui_login,account_delete,deleted_credentials_rejected')
            } finally {
              await context.close().catch(() => {})
              await browser.close().catch(() => {})
            }
          })().catch((error) => {
            console.error('REAL_PREVIEW_BROWSER_ACCEPTANCE: FAIL')
            console.error(error?.stack || error)
            process.exitCode = 1
          })
          NODE
          node run.cjs
          cp -R artifacts "$GITHUB_WORKSPACE/browser-acceptance-artifacts"

      - name: Upload browser acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-browser-acceptance
          path: browser-acceptance-artifacts
          if-no-files-found: warn
          retention-days: 3

      - name: Cleanup isolated browser tooling
        if: always()
        shell: bash
        run: rm -rf /tmp/medicalchannelai-browser-e2e
