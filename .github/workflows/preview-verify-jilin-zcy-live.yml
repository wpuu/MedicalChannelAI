name: Preview Verify Jilin ZCY Live

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-verify-jilin-zcy-live.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 0

      - name: Replay eight Jilin official notices
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys
          import time
          from pathlib import Path

          sys.path.insert(0, str(Path('web/pipeline').resolve()))
          from medical_channel_pipeline.ccgp_detail import fetch_ccgp_detail_html, parse_ccgp_public_tender_html

          audit = json.loads(Path('web/pipeline/data/preview_jilin_product_audit.json').read_text(encoding='utf-8'))
          cases = []
          for index, source_case in enumerate(audit['cases']):
              if index:
                  time.sleep(4.0)
              url = source_case['source_url']
              html = fetch_ccgp_detail_html(url)
              parsed = parse_ccgp_public_tender_html(
                  html,
                  source_url=url,
                  observed_at='2026-09-10T06:50:00+08:00',
                  opportunity_id=source_case['opportunity_id'],
              )
              facts = parsed.get('facts') or {}
              cases.append({
                  'opportunity_id': source_case['opportunity_id'],
                  'project_name': source_case['project_name'],
                  'product_items': facts.get('product_items') or [],
                  'product_categories': facts.get('product_categories') or [],
              })
          report = {
              'source_audit_snapshot_as_of': audit.get('snapshot_as_of'),
              'verified_count': len(cases),
              'cases': cases,
          }
          Path('web/pipeline/data/preview_jilin_live_verification.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Publish live verification report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 web/pipeline/scripts/publish_generated_data_github.py \
            --branch "${GITHUB_REF_NAME}" \
            --message 'chore: capture Jilin live parser verification' \
            web/pipeline/data/preview_jilin_live_verification.json

      - name: Assert grounded Jilin results
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('web/pipeline/data/preview_jilin_live_verification.json').read_text(encoding='utf-8'))
          by_id = {case['opportunity_id']: case for case in report['cases']}
          assert report['verified_count'] == 8, report['verified_count']

          def pairs(opportunity_id):
              return [(item.get('raw_name'), item.get('quantity')) for item in by_id[opportunity_id]['product_items']]

          for case in report['cases']:
              assert all(item.get('raw_name') != '数量' for item in case['product_items']), case

          assert pairs('ccgp_jl_3edf4a29f776eebf') == [
              ('血管内超声', '1套'),
              ('非接触眼压计', '1套'),
          ]
          assert pairs('ccgp_jl_92d8a706047d0a62') == [
              ('血液透析机（单泵）', '10台'),
              ('三维移动式C形臂X射线机等', '1套'),
          ]
          assert pairs('ccgp_jl_40d5ac0960328c51') == [
              ('五分类血球分析仪、糖化分析仪、超敏C反应分析仪一体化自动检测流水线', None),
              ('全自动尿液分析仪(干化学+尿沉渣)', None),
              ('质谱分析仪', None),
              ('微生物药敏分析仪', None),
          ]
          assert pairs('ccgp_jl_37172df35abece06') == [
              ('埃可病毒30型核酸检测试剂盒（荧光法）等四大症候群监测相关试剂耗材', None),
          ]
          aids = pairs('ccgp_jl_25eb3b5947b52eaa')
          assert len(aids) == 1 and aids[0][1] is None and '艾滋病和梅毒' in aids[0][0] and '检测试剂' in aids[0][0], aids
          for opportunity_id in (
              'ccgp_jl_af9636c5bc0f7784',
              'ccgp_jl_2ef67b2eece8e825',
              'ccgp_jl_7b4525920ec1cc52',
          ):
              assert pairs(opportunity_id) == [], (opportunity_id, pairs(opportunity_id))
          print('JILIN_LIVE_GROUNDED_ASSERTIONS_OK')
          PY

      - name: Run full pipeline regression suite
        run: |
          set -euo pipefail
          cd web/pipeline
          python3 -m unittest discover -s tests
