name: Preview Product Coverage Audit

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-product-coverage-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 1
      - name: Audit product structure coverage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          payload = json.loads(Path('web/public/data/today-actions.public.json').read_text(encoding='utf-8'))
          cards = payload.get('opportunity_pool') or []
          if len(cards) != payload.get('opportunity_pool_count'):
              raise SystemExit(f"POOL_COUNT_MISMATCH:{len(cards)}:{payload.get('opportunity_pool_count')}")

          stats = defaultdict(lambda: {'total': 0, 'bidding': 0, 'structured': 0, 'empty': 0, 'empty_titles': []})
          for card in cards:
              facts = card.get('facts') or {}
              market = facts.get('market_code') or 'UNKNOWN'
              row = stats[market]
              row['total'] += 1
              if facts.get('lifecycle_state') != 'BIDDING':
                  continue
              row['bidding'] += 1
              items = facts.get('product_items') or []
              categories = facts.get('product_categories') or []
              if items or categories:
                  row['structured'] += 1
              else:
                  row['empty'] += 1
                  row['empty_titles'].append(facts.get('project_name') or '')

          print('PUBLIC_POOL', len(cards))
          total_bidding = total_structured = total_empty = 0
          for market in ['TJ', 'BJ', 'HE', 'LN', 'JL', 'HL']:
              row = stats[market]
              total_bidding += row['bidding']
              total_structured += row['structured']
              total_empty += row['empty']
              print(f"MARKET {market} total={row['total']} bidding={row['bidding']} structured={row['structured']} empty={row['empty']}")
              for title in row['empty_titles'][:12]:
                  print(f"EMPTY {market} {title}")
          print(f"TOTAL_BIDDING {total_bidding} STRUCTURED {total_structured} EMPTY {total_empty}")
          PY
