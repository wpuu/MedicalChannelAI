name: Preview Live Regional Recall Acceptance

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-live-regional-recall-acceptance.yml

permissions:
  contents: write

concurrency:
  group: preview-live-regional-recall-acceptance
  cancel-in-progress: true

jobs:
  live-refresh:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 25
    steps:
      - name: Checkout Preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 0

      - name: Verify recall-preserving classifier regressions
        shell: bash
        run: |
          set -euo pipefail
          cd web/pipeline
          python3 -m unittest \
            tests.test_regional_candidate_classification \
            tests.test_channel_scope \
            tests.test_ccgp_discovery \
            tests.test_ccgp_detail \
            tests.test_ccgp_national_detail_formats \
            tests.test_ccgp_liaoning_detail_format

      - name: Compute China refresh timestamp
        id: clock
        shell: bash
        run: |
          set -euo pipefail
          AS_OF="$(python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Shanghai')).isoformat())
          PY
          )"
          echo "as_of=${AS_OF}" >> "$GITHUB_OUTPUT"

      - name: Run live verified regional refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 web/pipeline/scripts/sync_national_admin_divisions.py \
            --output web/pipeline/data/national_admin_divisions.latest.json
          python3 web/pipeline/scripts/sync_regional_ccgp.py \
            --as-of '${{ steps.clock.outputs.as_of }}' \
            --existing-records-input web/pipeline/data/regional_live_ccgp_records.json \
            --records-output web/pipeline/data/regional_live_ccgp_records.json \
            --report-output web/pipeline/data/regional_sync_report.json
          python3 web/pipeline/scripts/publish_web_snapshot.py \
            --as-of '${{ steps.clock.outputs.as_of }}' \
            --input web/pipeline/data/tianjin_live_ccgp_records.json \
            --input web/pipeline/data/tianjin_live_tjmugh_records.json \
            --input web/pipeline/data/tianjin_live_tjnothop_records.json \
            --input web/pipeline/data/tianjin_live_tjzxfc_records.json \
            --input web/pipeline/data/tianjin_live_tjzyefy_records.json \
            --input web/pipeline/data/tianjin_live_tjzyefy_intent_records.json \
            --input web/pipeline/data/tianjin_live_teda_records.json \
            --input web/pipeline/data/tianjin_live_tjfch_records.json \
            --event-input web/pipeline/data/tianjin_notice_events.json \
            --output web/public/data/today-actions.public.json

      - name: Verify live recall and exclusion invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('web/pipeline/data/regional_sync_report.json').read_text(encoding='utf-8'))
          records = json.loads(Path('web/pipeline/data/regional_live_ccgp_records.json').read_text(encoding='utf-8'))
          snapshot = json.loads(Path('web/public/data/today-actions.public.json').read_text(encoding='utf-8'))
          markets = report.get('markets') or []
          if not markets:
              raise SystemExit('REGIONAL_REPORT_HAS_NO_MARKETS')
          policy = report.get('policy') or {}
          if policy.get('rate_limit_bypass') is not False:
              raise SystemExit('RATE_LIMIT_POLICY_CHANGED')
          if float(policy.get('minimum_request_delay_seconds') or 0) < 4.0:
              raise SystemExit('RATE_LIMIT_DELAY_TOO_LOW')

          allowed_skip_reasons = {'OUT_OF_MEDICAL_SCOPE', 'NON_COMPETITIVE_SINGLE_SOURCE'}
          false_negative_markers = (
              '免散瞳眼底照相机',
              '乳腺机采购',
              '疾病预防控制专用设备',
              '医疗保障信息安全服务',
              '信息互通共享功能升级',
          )
          explicit_nonmedical_markers = ('班车', '业务用车租赁', '办公耗材', '保安服务', '保洁服务')
          all_failures = []
          all_skips = []
          for market in markets:
              if int(market.get('selected_candidate_count') or 0) > 10:
                  raise SystemExit(f"DETAIL_BUDGET_UNBOUNDED:{market.get('market_code')}")
              all_failures.extend(market.get('failures') or [])
              all_skips.extend(market.get('skipped_candidates') or [])

          for skipped in all_skips:
              reason = skipped.get('reason')
              title = str(skipped.get('title') or '')
              if reason not in allowed_skip_reasons:
                  raise SystemExit(f'UNKNOWN_SKIP_REASON:{reason}:{title}')
              if reason == 'OUT_OF_MEDICAL_SCOPE' and any(marker in title for marker in false_negative_markers):
                  raise SystemExit(f'KNOWN_MEDICAL_FALSE_NEGATIVE_STILL_SKIPPED:{title}')
              if reason == 'NON_COMPETITIVE_SINGLE_SOURCE' and '单一来源' not in title:
                  raise SystemExit(f'UNGROUNDED_SINGLE_SOURCE_SKIP:{title}')

          # These exact official Beijing notices were previously false-negative skips.
          # A source URL in canonical records proves successful detail verification;
          # a verified_detail failure proves it at least reached the detail adapter.
          recall_urls = {
              'eye_fundus': 'https://www.ccgp.gov.cn/cggg/zygg/gkzb/202609/t20260907_27282514.htm',
              'cdc_device': 'https://www.ccgp.gov.cn/cggg/zygg/gkzb/202609/t20260907_27277351.htm',
              'breast_imaging': 'https://www.ccgp.gov.cn/cggg/zygg/gkzb/202609/t20260908_27289494.htm',
              'health_it': 'https://www.ccgp.gov.cn/cggg/zygg/gkzb/202609/t20260908_27290702.htm',
          }
          verified_urls = {
              str((record.get('source') or {}).get('url') or '')
              for record in records if isinstance(record, dict)
          }
          attempted_failure_urls = {
              str(failure.get('url') or '')
              for failure in all_failures
              if failure.get('stage') == 'verified_detail'
          }
          attempted = {
              name: url in verified_urls or url in attempted_failure_urls
              for name, url in recall_urls.items()
          }
          if sum(1 for value in attempted.values() if value) < 2:
              raise SystemExit(f'RECALL_PROOF_TOO_WEAK:{attempted}')

          # Clear non-medical titles may be absent from a given window, but when
          # they are skipped they must remain OUT_OF_MEDICAL_SCOPE.
          bad_nonmedical = [
              item for item in all_skips
              if any(marker in str(item.get('title') or '') for marker in explicit_nonmedical_markers)
              and item.get('reason') != 'OUT_OF_MEDICAL_SCOPE'
          ]
          if bad_nonmedical:
              raise SystemExit(f'EXPLICIT_NONMEDICAL_NOT_EXCLUDED:{bad_nonmedical[:3]}')

          pool = snapshot.get('opportunity_pool') or snapshot.get('cards') or []
          market_codes = {str((card.get('facts') or {}).get('market_code') or '') for card in pool}
          expected = {'TJ', 'BJ', 'HE', 'LN', 'JL', 'HL'}
          missing = sorted(expected - market_codes)
          if missing:
              raise SystemExit(f'PUBLISHED_SNAPSHOT_LOST_MARKETS:{missing}')

          print(json.dumps({
              'new_verified': report.get('new_verified_record_count'),
              'merged_records': report.get('merged_record_count'),
              'snapshot_pool_count': len(pool),
              'markets': sorted(market_codes),
              'recall_attempted': attempted,
              'failure_counts': {
                  m.get('market_code'): len(m.get('failures') or []) for m in markets
              },
              'skip_counts': {
                  m.get('market_code'): m.get('skipped_candidate_count', 0) for m in markets
              },
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit live evidence and remove one-shot workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: preview/multi-region-ui-acceptance
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          expected_head = os.environ['EXPECTED_HEAD']
          root = Path.cwd()
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          def call(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              request = Request(url, data=data, headers=headers, method=method)
              with urlopen(request, timeout=60) as response:
                  body = response.read().decode('utf-8')
                  return json.loads(body) if body else {}

          ref_name = quote(f'heads/{branch}', safe='/')
          ref = call('GET', f'{api}/git/ref/{ref_name}')
          head_sha = ref['object']['sha']
          if head_sha != expected_head:
              raise SystemExit(f'REMOTE_HEAD_CHANGED expected={expected_head} actual={head_sha}')
          commit = call('GET', f'{api}/git/commits/{head_sha}')
          base_tree = commit['tree']['sha']
          paths = [
              'web/pipeline/data/national_admin_divisions.latest.json',
              'web/pipeline/data/regional_live_ccgp_records.json',
              'web/pipeline/data/regional_sync_report.json',
              'web/public/data/today-actions.public.json',
          ]
          tree = []
          for path in paths:
              file_path = root / path
              blob = call('POST', f'{api}/git/blobs', {
                  'content': base64.b64encode(file_path.read_bytes()).decode('ascii'),
                  'encoding': 'base64',
              })
              tree.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree.append({
              'path': '.github/workflows/preview-live-regional-recall-acceptance.yml',
              'mode': '100644', 'type': 'blob', 'sha': None,
          })
          new_tree = call('POST', f'{api}/git/trees', {'base_tree': base_tree, 'tree': tree})
          new_commit = call('POST', f'{api}/git/commits', {
              'message': 'data: live-verify recall-preserving regional refresh',
              'tree': new_tree['sha'],
              'parents': [head_sha],
          })
          call('PATCH', f'{api}/git/refs/{ref_name}', {'sha': new_commit['sha'], 'force': False})
          print(f"committed {new_commit['sha']}")
          PY
