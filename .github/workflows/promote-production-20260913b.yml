name: Promote Production 2026-09-13b

on:
  push:
    branches: [release/staged-production-20260913b]
    paths:
      - '.github/workflows/promote-production-20260913b.yml'

permissions:
  contents: read

concurrency:
  group: medicalchannelai-production-release-20260913b
  cancel-in-progress: false

jobs:
  promote:
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_jEy8Ex9vRDBdXj1cQPKF8sRd
      VERCEL_PROJECT_ID: prj_7fk44eKUhdbfTUaXxEBMgIzZiqUM
      GITHUB_REPO_TOKEN: ${{ github.token }}
      EXPECTED_MAIN_SHA: 5b35ea51f45774b110147d3fbf7d0c66b5e749cf
      STAGED_DEPLOYMENT_ID: dpl_CCihWbU5nYxhFB3ayiKWqtmFeNDd
      OLD_PRODUCTION_DEPLOYMENT_ID: dpl_FTRtLrj7cZHehiSDWjqfbrXNsYNH
      PUBLIC_STATUS_URL: https://medicalchannelai.vercel.app/api/status

    steps:
      - name: Require deployment credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo '::error::VERCEL_TOKEN is missing; promotion not attempted.'
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fail closed if main changed
        shell: bash
        run: |
          set -euo pipefail
          MAIN_JSON="$(curl -fsS \
            -H "Authorization: Bearer $GITHUB_REPO_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/wpuu/MedicalChannelAI/commits/main')"
          CURRENT_MAIN_SHA="$(MAIN_JSON="$MAIN_JSON" node -e "const v=JSON.parse(process.env.MAIN_JSON); process.stdout.write(v.sha || '')")"
          echo "Current main: $CURRENT_MAIN_SHA"
          echo "Expected main: $EXPECTED_MAIN_SHA"
          if [ "$CURRENT_MAIN_SHA" != "$EXPECTED_MAIN_SHA" ]; then
            echo '::error::main changed after staged acceptance; promotion stopped.'
            exit 1
          fi

      - name: Recheck exact staged deployment is READY Production
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_JSON="$(curl -fsS \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$STAGED_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
          DEPLOY_JSON="$DEPLOY_JSON" STAGED_DEPLOYMENT_ID="$STAGED_DEPLOYMENT_ID" node <<'NODE'
          const d = JSON.parse(process.env.DEPLOY_JSON || '{}');
          const state = d.readyState || d.state;
          const ok = d.id === process.env.STAGED_DEPLOYMENT_ID && state === 'READY' && d.target === 'production';
          console.log(`staged deployment=${d.id || 'missing'} state=${state || 'missing'} target=${d.target || 'missing'}`);
          if (!ok) process.exit(1);
          NODE

      - name: Promote exact deployment via Vercel API and validate with automatic rollback
        shell: bash
        run: |
          set -euo pipefail

          is_new_production() {
            STATUS_JSON="$1" node <<'NODE'
          let s;
          try { s = JSON.parse(process.env.STATUS_JSON || '{}'); } catch { process.exit(1); }
          const ok =
            s.ready === true &&
            s.degraded === false &&
            s.ai?.configured === true &&
            s.snapshot?.available === true &&
            s.snapshot?.freshness === 'FRESH' &&
            s.snapshot?.today_card_count === 5 &&
            s.snapshot?.opportunity_pool_count === 144;
          if (!ok) process.exit(1);
          console.log(`Production gate PASS: ready=${s.ready} degraded=${s.degraded} ai=${s.ai.configured} freshness=${s.snapshot.freshness} today=${s.snapshot.today_card_count} pool=${s.snapshot.opportunity_pool_count}`);
          NODE
          }

          is_old_production() {
            STATUS_JSON="$1" node <<'NODE'
          let s;
          try { s = JSON.parse(process.env.STATUS_JSON || '{}'); } catch { process.exit(1); }
          const ok = s.ready === true && s.degraded === false && s.commit === '7208891' && s.snapshot?.opportunity_pool_count === 26;
          if (!ok) process.exit(1);
          console.log(`Old Production verified: commit=${s.commit} pool=${s.snapshot.opportunity_pool_count}`);
          NODE
          }

          rollback_old() {
            echo 'Issuing official Vercel rollback to the previous verified Production deployment.'
            set +e
            rollback_http="$(curl -sS -o /tmp/vercel-rollback-response.txt -w '%{http_code}' \
              --request POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/rollback/$OLD_PRODUCTION_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
            rollback_rc=$?
            set -e
            echo "Rollback API curl_rc=$rollback_rc http=$rollback_http"
            if [ -s /tmp/vercel-rollback-response.txt ]; then cat /tmp/vercel-rollback-response.txt; fi

            for attempt in $(seq 1 12); do
              rollback_status="$(curl -fsS --max-time 15 "$PUBLIC_STATUS_URL" 2>/dev/null || true)"
              if is_old_production "$rollback_status"; then
                echo 'Rollback verification PASS.'
                return 0
              fi
              sleep 5
            done
            return 1
          }

          echo "Requesting Production traffic promotion for deployment $STAGED_DEPLOYMENT_ID"
          set +e
          promote_http="$(curl -sS -o /tmp/vercel-promote-response.txt -w '%{http_code}' \
            --request POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$STAGED_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
          promote_rc=$?
          set -e
          echo "Promote API curl_rc=$promote_rc http=$promote_http"
          if [ -s /tmp/vercel-promote-response.txt ]; then cat /tmp/vercel-promote-response.txt; fi

          if [ "$promote_rc" -ne 0 ] || { [ "$promote_http" != '200' ] && [ "$promote_http" != '201' ] && [ "$promote_http" != '202' ]; }; then
            current_status="$(curl -fsS --max-time 15 "$PUBLIC_STATUS_URL" 2>/dev/null || true)"
            if is_new_production "$current_status"; then
              echo 'Promotion API response was unexpected, but the exact accepted Production gate is already live; continuing as success.'
            elif is_old_production "$current_status"; then
              echo '::error::Promotion API failed before traffic changed; old Production remains live.'
              exit 1
            else
              echo '::error::Promotion API outcome is ambiguous; forcing rollback to the prior verified Production.'
              if ! rollback_old; then
                echo '::error::Rollback could not be positively verified.'
              fi
              exit 1
            fi
          fi

          accepted=0
          last_status=''
          for attempt in $(seq 1 18); do
            last_status="$(curl -fsS --max-time 15 "$PUBLIC_STATUS_URL" 2>/dev/null || true)"
            if is_new_production "$last_status"; then
              accepted=1
              break
            fi
            echo "Production gate not ready yet (attempt $attempt/18); retrying in 5s."
            sleep 5
          done

          if [ "$accepted" -ne 1 ]; then
            echo '::error::Post-promote Production gate failed; rolling back.'
            echo "Last status payload: $last_status"
            if ! rollback_old; then
              echo '::error::Rollback was issued but could not be positively verified within the retry window.'
            fi
            exit 1
          fi

          echo '### Production promotion' >> "$GITHUB_STEP_SUMMARY"
          echo "- Accepted main SHA: \`$EXPECTED_MAIN_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Promoted deployment: \`$STAGED_DEPLOYMENT_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Promotion path: official Vercel project/deployment REST API' >> "$GITHUB_STEP_SUMMARY"
          echo '- Post-promote gate: PASS (AI configured, ready, not degraded, FRESH, Today=5, pool=144)' >> "$GITHUB_STEP_SUMMARY"
          echo "- Rollback baseline retained: \`$OLD_PRODUCTION_DEPLOYMENT_ID\`" >> "$GITHUB_STEP_SUMMARY"
