name: Preview Verified Refresh Trigger Once

on:
  push:
    branches:
      - chatgpt/preview-54495b1
    paths:
      - .github/workflows/preview-refresh-trigger-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified refresh on preview branch
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/tianjin-medical-refresh.yml/dispatches" \
            -d '{"ref":"chatgpt/preview-54495b1"}')"
          echo "http_code=${code}" >> "$GITHUB_OUTPUT"
          echo "Workflow dispatch HTTP ${code}"
          if [[ "${code}" != "204" ]]; then
            cat dispatch-response.txt || true
            exit 1
          fi
      - name: Upload dispatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-refresh-dispatch-${{ github.run_id }}
          path: dispatch-response.txt
          if-no-files-found: warn
