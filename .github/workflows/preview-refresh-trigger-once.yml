name: Preview TJZYEFY Parser Acceptance Once

on:
  push:
    branches:
      - chatgpt/preview-54495b1
    paths:
      - .github/workflows/preview-refresh-trigger-once.yml

permissions:
  contents: read

jobs:
  accept:
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run focused TJZYEFY parser tests
        working-directory: web/pipeline
        run: python3 -m unittest discover -s tests -p 'test_tjzyefy*.py' -v

      - name: Run bounded live TJZYEFY acceptance
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          AS_OF="$(python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Shanghai')).isoformat())
          PY
          )"
          existing_args=()
          if [[ -f web/pipeline/data/tianjin_live_tjzyefy_records.json ]]; then
            existing_args+=(--existing-records-input web/pipeline/data/tianjin_live_tjzyefy_records.json)
          fi
          set +e
          python3 web/pipeline/scripts/sync_tjzyefy_market_research.py \
            --as-of "${AS_OF}" \
            --lookback-days 30 \
            --max-candidates 20 \
            --delay-seconds 3 \
            "${existing_args[@]}" \
            --records-output diagnostics/tjzyefy-records.json \
            --report-output diagnostics/tjzyefy-report.json
          code=$?
          set -e
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          cat diagnostics/tjzyefy-report.json || true
          exit 0

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: tjzyefy-parser-acceptance-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: error

      - name: Require live source gate pass
        shell: bash
        run: |
          echo "TJZYEFY live source exit code: ${{ steps.probe.outputs.exit_code }}"
          test "${{ steps.probe.outputs.exit_code }}" = "0"
