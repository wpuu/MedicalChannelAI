name: Preview TJZYEFY Diagnostic Once

on:
  push:
    branches:
      - chatgpt/preview-54495b1
    paths:
      - .github/workflows/preview-refresh-trigger-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run bounded TJZYEFY diagnostic
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          AS_OF="$(python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Shanghai')).isoformat())
          PY
          )"
          python3 web/pipeline/scripts/sync_tjzyefy_market_research.py \
            --as-of "${AS_OF}" \
            --lookback-days 30 \
            --max-candidates 20 \
            --delay-seconds 3 \
            --existing-records-input web/pipeline/data/tianjin_live_tjzyefy_records.json \
            --records-output diagnostics/tjzyefy-records.json \
            --report-output diagnostics/tjzyefy-report.json
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          cat diagnostics/tjzyefy-report.json || true
          exit 0

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: tjzyefy-diagnostic-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: error

      - name: Assert expected diagnostic completion
        shell: bash
        run: |
          echo "TJZYEFY diagnostic source exit code: ${{ steps.probe.outputs.exit_code }}"
