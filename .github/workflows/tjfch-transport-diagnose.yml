name: TJFCH Transport Diagnose

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final
    paths:
      - .github/workflows/tjfch-transport-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect First Central Hospital TLS certificate chain
        shell: bash
        run: |
          set -uo pipefail
          HOST='www.tj-fch.com'
          echo '=== DNS ==='
          getent ahosts "$HOST" || true
          echo '=== OpenSSL chain summary ==='
          openssl s_client -connect "$HOST:443" -servername "$HOST" -showcerts </dev/null > /tmp/tjfch-sclient.out 2>/tmp/tjfch-sclient.err || true
          grep -E '^(depth=|verify error:|Verify return code:|CONNECTED|Certificate chain)' /tmp/tjfch-sclient.out /tmp/tjfch-sclient.err || true
          echo "certificate_count=$(grep -c 'BEGIN CERTIFICATE' /tmp/tjfch-sclient.out || true)"
          echo '=== Leaf certificate ==='
          awk '/BEGIN CERTIFICATE/{p=1} p{print} /END CERTIFICATE/{exit}' /tmp/tjfch-sclient.out > /tmp/tjfch-leaf.pem
          if [ -s /tmp/tjfch-leaf.pem ]; then
            openssl x509 -in /tmp/tjfch-leaf.pem -noout \
              -subject -issuer -serial -dates -fingerprint -sha256 \
              -ext subjectAltName -ext authorityInfoAccess || true
          else
            echo 'leaf_certificate_missing'
          fi
          echo '=== Verification result ==='
          tail -n 25 /tmp/tjfch-sclient.out || true
          cat /tmp/tjfch-sclient.err || true
