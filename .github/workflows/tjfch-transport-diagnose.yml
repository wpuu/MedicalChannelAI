name: TJFCH Current Opportunity Live Validate

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final
    paths:
      - .github/workflows/tjfch-transport-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require verified current IgM opportunity from production sync
        shell: bash
        run: |
          set -euo pipefail
          AS_OF="$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Shanghai')).isoformat())
          PY
          )"
          python web/pipeline/scripts/sync_tjfch_procurement.py \
            --as-of "$AS_OF" \
            --lookback-days 45 \
            --max-candidates 20 \
            --delay-seconds 3 \
            --existing-records-input web/pipeline/data/tianjin_live_tjfch_records.json \
            --records-output /tmp/tjfch-records.json \
            --report-output /tmp/tjfch-report.json
          python - <<'PY'
          import json

          report = json.load(open('/tmp/tjfch-report.json', encoding='utf-8'))
          records = json.load(open('/tmp/tjfch-records.json', encoding='utf-8'))
          target = next((r for r in records if r.get('opportunity_id') == 'tjfch_20260831_030197537'), None)
          print(json.dumps({
              'discovered': report.get('discovered_supported_count'),
              'selected': report.get('selected_candidate_count'),
              'verified': report.get('new_verified_record_count'),
              'unsupported': report.get('unsupported_candidate_count'),
              'failures': report.get('failures'),
              'gate': report.get('publish_gate_reason'),
              'target': target,
          }, ensure_ascii=False))
          if report.get('publish_gate_reason') != 'PASS' or report.get('failure_count') != 0:
              raise SystemExit('TJFCH production sync did not fully verify selected actionable details')
          if target is None:
              raise SystemExit('current IgM opportunity missing')
          facts = target.get('facts') or {}
          expected = {
              'project_name': '天津市第一中心医院甲型肝炎病毒IgM抗体质控品等采购项目院内比选公告',
              'budget_cny': 4588,
              'bid_deadline': '2026-09-07T17:00:00+08:00',
          }
          for key, value in expected.items():
              if facts.get(key) != value:
                  raise SystemExit(f'{key} mismatch: {facts.get(key)!r}')
          if (target.get('source') or {}).get('url') != 'https://www.tjfch.com.cn/system/2026/08/31/030197537.shtml':
              raise SystemExit('official source URL mismatch')
          PY
