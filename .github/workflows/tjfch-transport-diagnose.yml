name: TJFCH Contact Boundary Diagnose

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final
    paths:
      - .github/workflows/tjfch-transport-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print official contact text around phone label
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('web/pipeline')))
          from medical_channel_pipeline.tjfch_discovery import fetch_tjfch_page
          from medical_channel_pipeline.tjfch_procurement import _visible_text

          url = 'https://www.tjfch.com.cn/system/2026/08/31/030197537.shtml'
          text = _visible_text(fetch_tjfch_page(url))
          for marker in ('联系电话', '联系人', '政务邮箱', '地址'):
              start = 0
              while True:
                  pos = text.find(marker, start)
                  if pos < 0:
                      break
                  print(marker, repr(text[max(0, pos-90):pos+220]))
                  start = pos + len(marker)
          print('PHONE_PATTERN_REGION=', repr(re.search(r'(?:联系电话|电话)\s*[：:]\s*([0-9][0-9\-\s]{6,24})', text).group(1) if re.search(r'(?:联系电话|电话)\s*[：:]\s*([0-9][0-9\-\s]{6,24})', text) else None))
          PY
