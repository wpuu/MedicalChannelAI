name: TJFCH Transport Diagnose

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final
    paths:
      - .github/workflows/tjfch-transport-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose urllib, DNS, TLS and curl
        shell: bash
        run: |
          set -uo pipefail
          URL='https://www.tj-fch.com/ywgk/ynbx/index.shtml'
          echo '=== DNS ==='
          getent ahosts www.tj-fch.com || true
          echo '=== Python socket/TLS/urllib ==='
          python - <<'PY'
          import socket
          import ssl
          import urllib.request
          import urllib.error

          host = 'www.tj-fch.com'
          url = 'https://www.tj-fch.com/ywgk/ynbx/index.shtml'
          try:
              print('getaddrinfo=', socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM))
          except Exception as exc:
              print('dns_fail=', type(exc).__name__, repr(exc))

          try:
              raw = socket.create_connection((host, 443), timeout=15)
              print('tcp_peer=', raw.getpeername())
              ctx = ssl.create_default_context()
              tls = ctx.wrap_socket(raw, server_hostname=host)
              print('tls_version=', tls.version())
              print('tls_cipher=', tls.cipher())
              print('tls_cert_subject=', tls.getpeercert().get('subject'))
              tls.close()
          except Exception as exc:
              print('tls_fail=', type(exc).__name__, repr(exc))

          req = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0 MedicalChannelAI transport diagnostic',
              'Accept': 'text/html,application/xhtml+xml',
              'Accept-Language': 'zh-CN,zh;q=0.9',
          })
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  body = resp.read(256)
                  print('urllib_status=', resp.status)
                  print('urllib_server=', resp.headers.get('server'))
                  print('urllib_prefix=', body[:120])
          except urllib.error.URLError as exc:
              print('urllib_urlerror_reason_type=', type(exc.reason).__name__)
              print('urllib_urlerror_reason_repr=', repr(exc.reason))
          except Exception as exc:
              print('urllib_fail=', type(exc).__name__, repr(exc))
          PY
          echo '=== curl IPv4 ==='
          curl -4 -I -L --max-time 20 --connect-timeout 10 --retry 0 -A 'Mozilla/5.0 MedicalChannelAI transport diagnostic' "$URL" 2>&1 || true
          echo '=== curl IPv6 ==='
          curl -6 -I -L --max-time 20 --connect-timeout 10 --retry 0 -A 'Mozilla/5.0 MedicalChannelAI transport diagnostic' "$URL" 2>&1 || true
