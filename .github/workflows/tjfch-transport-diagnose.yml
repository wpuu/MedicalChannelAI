name: TJFCH Truncated Detail Diagnose

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final
    paths:
      - .github/workflows/tjfch-transport-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print production failure and official detail title structure
        shell: bash
        run: |
          set -euo pipefail
          AS_OF="$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Shanghai')).isoformat())
          PY
          )"
          python web/pipeline/scripts/sync_tjfch_procurement.py \
            --as-of "$AS_OF" \
            --lookback-days 45 \
            --max-candidates 20 \
            --delay-seconds 3 \
            --existing-records-input web/pipeline/data/tianjin_live_tjfch_records.json \
            --records-output /tmp/tjfch-records.json \
            --report-output /tmp/tjfch-report.json
          python - <<'PY'
          import json
          import re
          import sys
          from html.parser import HTMLParser
          from pathlib import Path

          sys.path.insert(0, str(Path('web/pipeline')))
          from medical_channel_pipeline.tjfch_discovery import fetch_tjfch_page

          report = json.load(open('/tmp/tjfch-report.json', encoding='utf-8'))
          print('REPORT_FAILURES=', json.dumps(report.get('failures'), ensure_ascii=False))
          print('REPORT_UNSUPPORTED=', json.dumps(report.get('unsupported'), ensure_ascii=False))

          url = 'https://www.tjfch.com.cn/system/2026/08/31/030197537.shtml'
          html = fetch_tjfch_page(url)

          class Titles(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.rows = []
              def handle_starttag(self, tag, attrs):
                  if tag in {'title', 'h1', 'h2', 'h3'}:
                      self.stack.append([tag, []])
              def handle_data(self, data):
                  if self.stack and data.strip():
                      self.stack[-1][1].append(data.strip())
              def handle_endtag(self, tag):
                  if self.stack and self.stack[-1][0] == tag:
                      name, parts = self.stack.pop()
                      text = re.sub(r'\s+', ' ', ' '.join(parts)).strip()
                      if text:
                          self.rows.append((name, text))

          parser = Titles(); parser.feed(html)
          for row in parser.rows:
              print('TITLE_NODE=', repr(row))

          text = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', html))
          marker = '甲型肝炎病毒IgM抗体质控品'
          pos = text.find(marker)
          print('MARKER_POS=', pos)
          if pos >= 0:
              print('MARKER_CONTEXT=', repr(text[max(0, pos-120):pos+260]))
          PY
