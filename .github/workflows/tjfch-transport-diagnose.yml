name: TJFCH Index Completeness Diagnose

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final
    paths:
      - .github/workflows/tjfch-transport-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print official procurement index anchors and parser decisions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin

          sys.path.insert(0, str(Path('web/pipeline')))
          from medical_channel_pipeline.tjfch_discovery import INDEX_URL, fetch_tjfch_page, parse_tjfch_index_html

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.href = None
                  self.text = []
                  self.rows = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      self.href = dict(attrs).get('href')
                      self.text = []
              def handle_data(self, data):
                  if self.href is not None and data.strip():
                      self.text.append(data.strip())
              def handle_endtag(self, tag):
                  if tag == 'a' and self.href is not None:
                      self.rows.append((self.href, ' '.join(self.text).strip()))
                      self.href = None
                      self.text = []

          html = fetch_tjfch_page(INDEX_URL)
          raw = Parser(); raw.feed(html)
          print('INDEX_URL=', INDEX_URL)
          for href, title in raw.rows:
              full = urljoin(INDEX_URL, href or '')
              if '/system/2026/08/' in full or '院内比选' in title or 'IgM' in title or '科教处' in title:
                  print('RAW', repr(title), full)
          print('--- DISCOVERED ---')
          for item in parse_tjfch_index_html(html):
              print('DISCOVERED', item.published_at, repr(item.title), item.detail_url)
          PY
