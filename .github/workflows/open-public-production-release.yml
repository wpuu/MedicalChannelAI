name: One-time simple public production release

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/opportunity-ranking-v2-final
          fetch-depth: 1

      - name: Switch to simple public mode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          Path('web/src/config/publicOpenMode.ts').write_text(
              "// Temporary public launch mode: no account gate until commercial account features are needed.\n"
              "export const publicOpenMode = true\n",
              encoding='utf-8',
          )

          api_path = Path('web/src/services/apiConfig.ts')
          api = api_path.read_text(encoding='utf-8')
          if "import { publicOpenMode } from '@/config/publicOpenMode'" not in api:
              api = "import { publicOpenMode } from '@/config/publicOpenMode'\n\n" + api
          old = "export const webBuildMode: WebBuildMode =\n  rawBuildMode === 'demo' || rawBuildMode === 'pilot' ? rawBuildMode : 'unspecified'\n\nexport const apiBaseUrl = env?.VITE_API_BASE_URL?.trim()?.replace(/\\/+$/, '') ?? ''"
          new = "export const webBuildMode: WebBuildMode = publicOpenMode\n  ? 'demo'\n  : rawBuildMode === 'demo' || rawBuildMode === 'pilot'\n    ? rawBuildMode\n    : 'unspecified'\n\nconst configuredApiBaseUrl = env?.VITE_API_BASE_URL?.trim()?.replace(/\\/+$/, '') ?? ''\nexport const apiBaseUrl = publicOpenMode ? '' : configuredApiBaseUrl"
          if old not in api:
              raise SystemExit('apiConfig build-mode target not found')
          api = api.replace(old, new, 1)
          api = api.replace("if (webBuildMode === 'demo' && isApiMode) {", "if (!publicOpenMode && webBuildMode === 'demo' && isApiMode) {", 1)
          api = api.replace("if (webBuildMode === 'pilot' && apiBaseUrl !== '/api') {", "if (!publicOpenMode && webBuildMode === 'pilot' && apiBaseUrl !== '/api') {", 1)
          api_path.write_text(api, encoding='utf-8')

          demo_path = Path('web/src/config/demoDataset.ts')
          demo = demo_path.read_text(encoding='utf-8')
          if "import { publicOpenMode } from './publicOpenMode'" not in demo:
              demo = "import { publicOpenMode } from './publicOpenMode'\n\n" + demo
          target = "export const demoDatasetMode: DemoDatasetMode = raw === 'verified' ? 'verified' : 'synthetic'"
          if target not in demo:
              raise SystemExit('demo dataset target not found')
          demo = demo.replace(target, "export const demoDatasetMode: DemoDatasetMode = publicOpenMode || raw === 'verified' ? 'verified' : 'synthetic'", 1)
          demo_path.write_text(demo, encoding='utf-8')

          today_path = Path('web/src/pages/TodayPage.tsx')
          today = today_path.read_text(encoding='utf-8')
          today = today.replace(
              "const AI_UNCONFIGURED_REASON = 'AI暂时不可用，可稍后重试；公开商机和跟进功能不受影响。'",
              "const AI_UNCONFIGURED_REASON = '已有核验AI建议会直接复用；尚未生成过AI建议的商机暂不实时调用模型。'",
              1,
          )
          today = today.replace('>AI暂不可用</span>', '>AI建议按需加载</span>', 1)
          today_path.write_text(today, encoding='utf-8')

          detail_path = Path('web/src/pages/OpportunityDetailPage.tsx')
          detail = detail_path.read_text(encoding='utf-8')
          detail = detail.replace(
              "const AI_UNCONFIGURED_REASON = 'AI暂时不可用，可稍后重试；其他功能正常。'",
              "const AI_UNCONFIGURED_REASON = '已有核验AI建议会直接复用；尚未生成过AI建议的商机暂不实时调用模型。'",
              1,
          )
          detail_path.write_text(detail, encoding='utf-8')

          decision_path = Path('web/src/components/today/DecisionBlock.tsx')
          decision = decision_path.read_text(encoding='utf-8')
          decision = decision.replace(
              "analysisUnavailableReason\n                        ? '重试AI分析'\n                        : '用AI分析这条'",
              "analysisUnavailableReason\n                        ? '获取AI建议'\n                        : '用AI分析这条'",
              1,
          )
          decision_path.write_text(decision, encoding='utf-8')

          analyze_path = Path('web/api/ai/analyze.js')
          analyze = analyze_path.read_text(encoding='utf-8')
          old_guard = "function privatePilotEnabled() {\n  return ['1', 'true', 'yes', 'on'].includes(\n    String(process.env.PILOT_PRIVATE_ACCOUNTS_ENABLED || '').trim().toLowerCase(),\n  )\n}"
          new_guard = "function privatePilotEnabled() {\n  // Public launch phase: use verified public facts without an account gate.\n  return false\n}"
          if old_guard not in analyze:
              raise SystemExit('private pilot guard target not found')
          analyze_path.write_text(analyze.replace(old_guard, new_guard, 1), encoding='utf-8')
          PY

      - name: Minimal build check
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Commit release patch and remove one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ['GITHUB_API_URL'].rstrip('/')
          token = os.environ['GH_TOKEN']
          branch = 'chatgpt/opportunity-ranking-v2-final'
          expected_head = os.environ['GITHUB_SHA']

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(f'{api}/repos/{repo}{path}', data=data, method=method)
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              if data is not None:
                  req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req, timeout=30) as res:
                  return json.load(res)

          ref = request('GET', f'/git/ref/heads/{branch}')
          if ref['object']['sha'] != expected_head:
              raise SystemExit('branch moved during release patch')
          commit = request('GET', f'/git/commits/{expected_head}')
          base_tree = commit['tree']['sha']

          paths = [
              'web/src/config/publicOpenMode.ts',
              'web/src/services/apiConfig.ts',
              'web/src/config/demoDataset.ts',
              'web/src/pages/TodayPage.tsx',
              'web/src/pages/OpportunityDetailPage.tsx',
              'web/src/components/today/DecisionBlock.tsx',
              'web/api/ai/analyze.js',
          ]
          entries = []
          for path in paths:
              blob = request('POST', '/git/blobs', {
                  'content': Path(path).read_text(encoding='utf-8'),
                  'encoding': 'utf-8',
              })
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          entries.append({
              'path': '.github/workflows/open-public-production-release.yml',
              'mode': '100644',
              'type': 'blob',
              'sha': None,
          })
          tree = request('POST', '/git/trees', {'base_tree': base_tree, 'tree': entries})
          new_commit = request('POST', '/git/commits', {
              'message': 'release: simple public access for production',
              'tree': tree['sha'],
              'parents': [expected_head],
          })
          request('PATCH', f'/git/refs/heads/{branch}', {'sha': new_commit['sha'], 'force': False})
          print(f"RELEASE_COMMIT={new_commit['sha']}")
          PY
