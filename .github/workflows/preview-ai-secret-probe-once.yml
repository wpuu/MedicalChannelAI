name: Preview AI Secret Probe Once

on:
  push:
    branches:
      - chatgpt/preview-54495b1
    paths:
      - .github/workflows/preview-ai-secret-probe-once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe secret availability without printing values
        env:
          AGNES_API_KEYS: ${{ secrets.AGNES_API_KEYS }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          raw = os.environ.get('AGNES_API_KEYS') or os.environ.get('AGNES_API_KEY') or ''
          keys = [part.strip() for part in raw.replace(';', ',').replace('\n', ',').split(',') if part.strip()]
          print(f'AGNES_SECRET_CONFIGURED={str(bool(keys)).lower()}')
          print(f'VERCEL_TOKEN_CONFIGURED={str(bool(os.environ.get("VERCEL_TOKEN", "").strip())).lower()}')
          print(f'VERCEL_ORG_ID_CONFIGURED={str(bool(os.environ.get("VERCEL_ORG_ID", "").strip())).lower()}')
          print(f'VERCEL_PROJECT_ID_CONFIGURED={str(bool(os.environ.get("VERCEL_PROJECT_ID", "").strip())).lower()}')
          if not keys:
              raise SystemExit('AGNES_PROVIDER_LIVE_CALL: SKIP_NO_SECRET')

          payload = json.dumps({
              'model': 'agnes-2.5-flash',
              'messages': [{'role': 'user', 'content': 'Return exactly OK.'}],
              'temperature': 0,
              'max_tokens': 8,
              'stream': False,
          }).encode('utf-8')
          request = urllib.request.Request(
              'https://apihub.agnes-ai.com/v1/chat/completions',
              data=payload,
              method='POST',
              headers={
                  'Authorization': f'Bearer {keys[0]}',
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  'User-Agent': 'MedicalChannelAI-preview-ai-probe',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = json.loads(response.read().decode('utf-8'))
                  content = body.get('choices', [{}])[0].get('message', {}).get('content')
                  if response.status != 200 or not isinstance(content, str) or not content.strip():
                      raise SystemExit(f'AGNES_PROVIDER_LIVE_CALL: FAIL_STATUS_{response.status}')
                  print('AGNES_PROVIDER_LIVE_CALL: PASS')
          except urllib.error.HTTPError as exc:
              raise SystemExit(f'AGNES_PROVIDER_LIVE_CALL: FAIL_HTTP_{exc.code}') from exc
          PY
