name: Preview Audit Hebei Product Formats

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-audit-hebei-product-formats.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 1
      - name: Inspect representative official Hebei detail formats
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import sys
          import time
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path('web/pipeline').resolve()
          sys.path.insert(0, str(root))
          from medical_channel_pipeline.ccgp_detail import (
              fetch_ccgp_detail_html,
              html_to_text,
              parse_ccgp_competitive_consultation_html,
              parse_ccgp_public_tender_html,
          )

          class TableHeaders(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.tables=[]; self.table_depth=0; self.row=None; self.cell=None; self.rows=None
              def handle_starttag(self, tag, attrs):
                  tag=tag.lower()
                  if tag=='table':
                      self.table_depth += 1
                      if self.table_depth==1: self.rows=[]
                  elif self.table_depth==1 and tag=='tr': self.row=[]
                  elif self.table_depth==1 and tag in {'td','th'} and self.row is not None: self.cell=[]
              def handle_data(self, data):
                  if self.cell is not None and self.table_depth==1 and data.strip(): self.cell.append(data.strip())
              def handle_endtag(self, tag):
                  tag=tag.lower()
                  if self.table_depth==1 and tag in {'td','th'} and self.cell is not None:
                      self.row.append(' '.join(self.cell).strip()); self.cell=None
                  elif self.table_depth==1 and tag=='tr' and self.row is not None:
                      if any(x.strip() for x in self.row): self.rows.append(self.row)
                      self.row=None
                  elif tag=='table' and self.table_depth:
                      if self.table_depth==1 and self.rows is not None: self.tables.append(self.rows)
                      self.table_depth -= 1

          canonical = json.loads((root/'data/regional_live_ccgp_records.json').read_text(encoding='utf-8'))
          public = json.loads(Path('web/public/data/today-actions.public.json').read_text(encoding='utf-8'))
          public_he_ids = {c['opportunity_id'] for c in public.get('opportunity_pool',[]) if (c.get('facts') or {}).get('market_code')=='HE'}
          by_id={r['opportunity_id']:r for r in canonical}
          records=[by_id[i] for i in public_he_ids if i in by_id]
          if len(records)!=14: raise SystemExit(f'HE_PUBLIC_CANONICAL_COUNT:{len(records)}')

          needles=[
              '病理数字化切片扫描仪','移动床旁DR','血液透析机','中心血站','委托检验服务',
              '第二批医疗设备采购项目','乡镇卫生院','省级医疗机构能力建设'
          ]
          selected=[]; used=set()
          for needle in needles:
              matches=[r for r in records if needle in str((r.get('facts') or {}).get('project_name') or '')]
              if matches:
                  r=matches[0]
                  if r['opportunity_id'] not in used:
                      selected.append((needle,r)); used.add(r['opportunity_id'])
          if len(selected)<6: raise SystemExit(f'HE_REPRESENTATIVE_SAMPLE_TOO_SMALL:{len(selected)}')

          for idx,(label,record) in enumerate(selected):
              if idx: time.sleep(4.0)
              facts=record.get('facts') or {}; url=record['source']['url']
              html=fetch_ccgp_detail_html(url)
              parser=parse_ccgp_competitive_consultation_html if facts.get('procurement_method')=='竞争性磋商' else parse_ccgp_public_tender_html
              parsed=parser(html,source_url=url,observed_at=record['source']['observed_at'],opportunity_id=record['opportunity_id'])
              pf=parsed.get('facts') or {}; items=pf.get('product_items') or []
              hp=TableHeaders(); hp.feed(html)
              print('\nCASE',label,record['opportunity_id'],facts.get('project_name'))
              print('URL',url)
              print('PARSED_ITEMS',[(i.get('raw_name'),i.get('quantity'),i.get('category')) for i in items[:20]],'COUNT',len(items))
              for t_index,rows in enumerate(hp.tables[:12]):
                  interesting=[]
                  for row in rows[:8]:
                      joined=' | '.join(row)
                      if any(k in joined for k in ['采购','标的','货物','设备','品目','数量','名称','服务内容','服务名称']): interesting.append(joined[:700])
                  if interesting: print('TABLE',t_index,' || '.join(interesting[:5]))
              text=html_to_text(html)
              anchors=['采购需求','采购内容','项目需求','采购标的','货物名称','设备名称','品目名称']
              pos=min([p for a in anchors if (p:=text.find(a))>=0],default=-1)
              if pos>=0: print('TEXT_NEAR',re.sub(r'\s+',' ',text[max(0,pos-160):pos+1400])[:1600])
              else: print('TEXT_NEAR','NO_PURCHASE_ANCHOR')
          PY
