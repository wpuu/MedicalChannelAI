name: PR6 followed scale patch

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/opportunity-ranking-v2-final
          fetch-depth: 0
      - name: Apply followed pagination and compact status index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} not found')
              return text.replace(old, new, 1)

          path = Path('web/api/private.js')
          text = path.read_text(encoding='utf-8')
          start = text.index('async function followedRoute(request, response, user) {')
          end = text.index('\nfunction reminderPublicFacts', start)
          new = '''async function followedRoute(request, response, user) {
            if (!allow(request, response, ['GET'])) return
            const rawRequestedId = firstQuery(request, 'id')
            const requestedId = rawRequestedId === undefined ? null : opportunityId(request)
            if (rawRequestedId !== undefined && !requestedId) {
              return sendJson(response, 400, { error: 'OPPORTUNITY_ID_INVALID' })
            }

            const rawView = firstQuery(request, 'view')
            const view = typeof rawView === 'string' ? rawView.trim() : ''
            if (view && view !== 'status-index') {
              return sendJson(response, 400, { error: 'FOLLOWED_VIEW_INVALID' })
            }

            const rawOffset = firstQuery(request, 'offset')
            const offset = rawOffset === undefined ? 0 : Number(rawOffset)
            if (!Number.isInteger(offset) || offset < 0 || offset > 10000) {
              return sendJson(response, 400, { error: 'FOLLOWED_OFFSET_INVALID' })
            }

            const sql = privateDb()
            try {
              if (requestedId) {
                const rows = await sql`
                  SELECT
                    f.opportunity_id, f.status, f.remind_at, f.public_snapshot, f.updated_at,
                    (
                      SELECT e.note FROM private_followup_events e
                      WHERE e.followup_id = f.id AND e.user_id = ${user.id}
                        AND e.note IS NOT NULL AND length(trim(e.note)) > 0
                      ORDER BY e.created_at DESC, e.id DESC LIMIT 1
                    ) AS latest_note
                  FROM private_followups f
                  WHERE f.user_id = ${user.id}
                    AND f.organization_id = ${user.organization_id}
                    AND f.opportunity_id = ${requestedId}
                  LIMIT 1
                `
                const item = rows[0] ? followedItemFromRow(rows[0]) : null
                if (!item) return sendJson(response, 404, { error: 'FOLLOWED_OPPORTUNITY_NOT_FOUND' })
                return sendJson(response, 200, {
                  schema_version: '0.1', mode: 'FOLLOWED_OPPORTUNITY', item,
                })
              }

              if (view === 'status-index') {
                const rows = await sql`
                  SELECT opportunity_id, status, remind_at, updated_at
                  FROM private_followups
                  WHERE user_id = ${user.id} AND organization_id = ${user.organization_id}
                  ORDER BY updated_at DESC, id DESC
                  LIMIT 5001
                `
                const truncated = rows.length > 5000
                const items = rows.slice(0, 5000).flatMap((row) =>
                  FOLLOWUP_STATUSES.has(row.status)
                    ? [{
                        opportunity_id: row.opportunity_id,
                        followup_status: row.status,
                        remind_at: row.remind_at ? new Date(row.remind_at).toISOString() : null,
                        followup_updated_at: new Date(row.updated_at).toISOString(),
                      }]
                    : [],
                )
                return sendJson(response, 200, {
                  schema_version: '0.1',
                  mode: 'FOLLOWED_STATUS_INDEX',
                  count: items.length,
                  truncated,
                  items,
                })
              }

              const rows = await sql`
                SELECT
                  f.opportunity_id, f.status, f.remind_at, f.public_snapshot, f.updated_at,
                  (
                    SELECT e.note FROM private_followup_events e
                    WHERE e.followup_id = f.id AND e.user_id = ${user.id}
                      AND e.note IS NOT NULL AND length(trim(e.note)) > 0
                    ORDER BY e.created_at DESC, e.id DESC LIMIT 1
                  ) AS latest_note
                FROM private_followups f
                WHERE f.user_id = ${user.id} AND f.organization_id = ${user.organization_id}
                ORDER BY f.updated_at DESC, f.id DESC
                LIMIT 101 OFFSET ${offset}
              `
              const hasMore = rows.length > 100
              const items = rows.slice(0, 100).map(followedItemFromRow).filter(Boolean)
              return sendJson(response, 200, {
                schema_version: '0.1',
                mode: 'FOLLOWED_OPPORTUNITIES',
                offset,
                count: items.length,
                has_more: hasMore,
                items,
              })
            } catch (error) {
              console.error('private followed request failed', {
                opportunity_id: requestedId,
                view,
                offset,
                error: error instanceof Error ? error.message : 'UNKNOWN',
              })
              return sendJson(response, 500, { error: 'FOLLOWED_REQUEST_FAILED' })
            }
          }
          '''
          path.write_text(text[:start] + new + text[end:], encoding='utf-8')

          path = Path('web/src/services/followedApi.ts')
          text = path.read_text(encoding='utf-8')
          old_start = text.index('export async function getFollowedOpportunities(): Promise<FollowedOpportunity[]> {')
          old_end = text.index('\nfunction verificationStatus', old_start)
          new_service = '''export interface FollowedOpportunityPage {
            offset: number
            items: FollowedOpportunity[]
            has_more: boolean
          }

          export interface FollowedStatusIndexItem {
            opportunity_id: string
            followup_status: FollowupStatus
            remind_at: string | null
            followup_updated_at: string
          }

          function validateStatusIndexItem(value: unknown): FollowedStatusIndexItem {
            const row = asRecord(value)
            if (
              !row ||
              !exactKeys(row, ['opportunity_id', 'followup_status', 'remind_at', 'followup_updated_at']) ||
              !isStableOpportunityId(row.opportunity_id) ||
              !isFollowupStatus(row.followup_status) ||
              !nullableString(row.remind_at) ||
              typeof row.followup_updated_at !== 'string' ||
              Number.isNaN(Date.parse(row.followup_updated_at))
            ) {
              throw new Error('FOLLOWED_STATUS_INDEX_INVALID')
            }
            return {
              opportunity_id: row.opportunity_id,
              followup_status: row.followup_status,
              remind_at: row.remind_at,
              followup_updated_at: row.followup_updated_at,
            }
          }

          export async function getFollowedOpportunityPage(offset = 0): Promise<FollowedOpportunityPage> {
            if (!Number.isInteger(offset) || offset < 0 || offset > 10000) {
              throw new Error('FOLLOWED_OFFSET_INVALID')
            }
            if (!isApiMode) {
              const all = await getLocalFollowedOpportunities()
              return {
                offset,
                items: all.slice(offset, offset + 100),
                has_more: offset + 100 < all.length,
              }
            }
            const response = await fetch(`${apiBaseUrl}/followed?offset=${offset}`, {
              credentials: 'include',
              headers: { Accept: 'application/json' },
            })
            if (!response.ok) throw await responseError(response)
            const root = asRecord(await response.json())
            if (
              !root ||
              !exactKeys(root, ['schema_version', 'mode', 'offset', 'count', 'has_more', 'items']) ||
              root.schema_version !== '0.1' ||
              root.mode !== 'FOLLOWED_OPPORTUNITIES' ||
              root.offset !== offset ||
              typeof root.count !== 'number' ||
              !Number.isInteger(root.count) ||
              root.count < 0 ||
              root.count > 100 ||
              typeof root.has_more !== 'boolean' ||
              !Array.isArray(root.items)
            ) {
              throw new Error('FOLLOWED_RESPONSE_INVALID')
            }
            const items = root.items.map(validateItem)
            if (root.count !== items.length) throw new Error('FOLLOWED_RESPONSE_INVALID')
            return { offset, items, has_more: root.has_more }
          }

          export async function getFollowedOpportunities(): Promise<FollowedOpportunity[]> {
            return (await getFollowedOpportunityPage(0)).items
          }

          export async function getFollowedStatusIndex(): Promise<FollowedStatusIndexItem[]> {
            if (!isApiMode) {
              return listStoredFollowups().map(({ opportunity_id, entry }) => ({
                opportunity_id,
                followup_status: entry.status,
                remind_at: entry.remind_at,
                followup_updated_at: entry.history[0]?.at ?? entry.remind_at ?? '1970-01-01T00:00:00.000Z',
              }))
            }
            const response = await fetch(`${apiBaseUrl}/followed?view=status-index`, {
              credentials: 'include',
              headers: { Accept: 'application/json' },
            })
            if (!response.ok) throw await responseError(response)
            const root = asRecord(await response.json())
            if (
              !root ||
              !exactKeys(root, ['schema_version', 'mode', 'count', 'truncated', 'items']) ||
              root.schema_version !== '0.1' ||
              root.mode !== 'FOLLOWED_STATUS_INDEX' ||
              typeof root.count !== 'number' ||
              !Number.isInteger(root.count) ||
              root.count < 0 ||
              root.count > 5000 ||
              typeof root.truncated !== 'boolean' ||
              !Array.isArray(root.items)
            ) {
              throw new Error('FOLLOWED_STATUS_INDEX_INVALID')
            }
            if (root.truncated) throw new Error('FOLLOWED_STATUS_INDEX_TRUNCATED')
            const items = root.items.map(validateStatusIndexItem)
            if (root.count !== items.length) throw new Error('FOLLOWED_STATUS_INDEX_INVALID')
            return items
          }

          export async function getFollowedOpportunityById(opportunityId: string): Promise<FollowedOpportunity | null> {
            if (!isStableOpportunityId(opportunityId)) throw new Error('OPPORTUNITY_ID_INVALID')
            if (!isApiMode) {
              const all = await getLocalFollowedOpportunities()
              return all.find((item) => item.opportunity_id === opportunityId) ?? null
            }
            const response = await fetch(`${apiBaseUrl}/followed?id=${encodeURIComponent(opportunityId)}`, {
              credentials: 'include',
              headers: { Accept: 'application/json' },
            })
            if (response.status === 404) return null
            if (!response.ok) throw await responseError(response)
            const root = asRecord(await response.json())
            if (
              !root ||
              !exactKeys(root, ['schema_version', 'mode', 'item']) ||
              root.schema_version !== '0.1' ||
              root.mode !== 'FOLLOWED_OPPORTUNITY'
            ) {
              throw new Error('FOLLOWED_RESPONSE_INVALID')
            }
            return validateItem(root.item)
          }
          '''
          path.write_text(text[:old_start] + new_service + text[old_end:], encoding='utf-8')

          path = Path('web/src/pages/OpportunityPoolPage.tsx')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text, "import { getFollowedOpportunities } from '@/services/followedApi'", "import { getFollowedStatusIndex } from '@/services/followedApi'", 'OpportunityPool followed import')
          text = replace_once(text, '''        const [data, followed] = await Promise.all([\n          todayActionsService.getTodayActions(),\n          getFollowedOpportunities(),\n        ])''', '''        const [data, followed] = await Promise.all([\n          todayActionsService.getTodayActions(),\n          getFollowedStatusIndex(),\n        ])''', 'OpportunityPool load pair')
          path.write_text(text, encoding='utf-8')

          path = Path('web/src/pages/FollowedPage.tsx')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text, '''import {\n  getFollowedOpportunities,\n  type FollowedOpportunity,\n} from '@/services/followedApi'\n''', '''import {\n  getFollowedOpportunityById,\n  getFollowedOpportunityPage,\n  getFollowedStatusIndex,\n  type FollowedOpportunity,\n  type FollowedStatusIndexItem,\n} from '@/services/followedApi'\n''', 'FollowedPage service import')
          text = replace_once(text, '''  const [items, setItems] = useState<FollowedOpportunity[]>([])\n  const [query, setQuery] = useState('')''', '''  const [items, setItems] = useState<FollowedOpportunity[]>([])\n  const [statusIndex, setStatusIndex] = useState<FollowedStatusIndexItem[]>([])\n  const [nextOffset, setNextOffset] = useState(0)\n  const [hasMore, setHasMore] = useState(false)\n  const [loadingMore, setLoadingMore] = useState(false)\n  const [query, setQuery] = useState('')''', 'FollowedPage state insertion')
          old_load = '''  const load = useCallback(async () => {\n    setLoading(true)\n    setError(null)\n    try {\n      setItems(await getFollowedOpportunities())\n    } catch (cause) {\n      if (isAuthRequiredError(cause)) {\n        navigate('/login', { replace: true })\n        return\n      }\n      setError('我的跟进加载失败，请稍后重试。')\n    } finally {\n      setLoading(false)\n    }\n  }, [navigate])'''
          new_load = '''  const load = useCallback(async () => {\n    setLoading(true)\n    setError(null)\n    try {\n      const [page, index] = await Promise.all([\n        getFollowedOpportunityPage(0),\n        getFollowedStatusIndex(),\n      ])\n      let nextItems = page.items\n      if (focusedId && !nextItems.some((item) => item.opportunity_id === focusedId)) {\n        const focused = await getFollowedOpportunityById(focusedId)\n        if (focused) nextItems = [focused, ...nextItems]\n      }\n      setItems(nextItems)\n      setStatusIndex(index)\n      setNextOffset(page.items.length)\n      setHasMore(page.has_more)\n    } catch (cause) {\n      if (isAuthRequiredError(cause)) {\n        navigate('/login', { replace: true })\n        return\n      }\n      setError('我的跟进加载失败，请稍后重试。')\n    } finally {\n      setLoading(false)\n    }\n  }, [focusedId, navigate])\n\n  const loadMore = useCallback(async () => {\n    if (!hasMore || loadingMore) return\n    setLoadingMore(true)\n    try {\n      const page = await getFollowedOpportunityPage(nextOffset)\n      setItems((current) => {\n        const seen = new Set(current.map((item) => item.opportunity_id))\n        return [...current, ...page.items.filter((item) => !seen.has(item.opportunity_id))]\n      })\n      setNextOffset(nextOffset + page.items.length)\n      setHasMore(page.has_more)\n    } catch (cause) {\n      if (isAuthRequiredError(cause)) {\n        navigate('/login', { replace: true })\n        return\n      }\n      setError('更早的跟进记录加载失败，请稍后重试。')\n    } finally {\n      setLoadingMore(false)\n    }\n  }, [hasMore, loadingMore, navigate, nextOffset])'''
          text = replace_once(text, old_load, new_load, 'FollowedPage load block')
          text = replace_once(text, '''  const metrics = useMemo(() => ({\n    total: items.length,\n    active: items.filter((item) => ACTIVE_STATUSES.has(item.followup_status)).length,\n    reminders: items.filter((item) => Boolean(item.remind_at)).length,\n    won: items.filter((item) => item.followup_status === 'WON').length,\n  }), [items])''', '''  const metrics = useMemo(() => ({\n    total: statusIndex.length,\n    active: statusIndex.filter((item) => ACTIVE_STATUSES.has(item.followup_status)).length,\n    reminders: statusIndex.filter((item) => Boolean(item.remind_at)).length,\n    won: statusIndex.filter((item) => item.followup_status === 'WON').length,\n  }), [statusIndex])''', 'FollowedPage metrics')
          text = replace_once(text, '<p className="mt-2 px-1 text-[11px] text-slate-400">当前显示 {orderedItems.length} / {items.length} 条</p>', '<p className="mt-2 px-1 text-[11px] text-slate-400">当前显示 {orderedItems.length} 条 · 已加载详情 {items.length} / 全部 {statusIndex.length} 条{hasMore ? \' · 可继续加载更早记录\' : \'\'}</p>', 'FollowedPage loaded count copy')
          marker = '''      )}\n    </div>\n  )\n}'''
          replacement = '''      )}\n\n      {hasMore ? (\n        <div className="flex justify-center">\n          <button\n            type="button"\n            disabled={loadingMore}\n            onClick={() => void loadMore()}\n            className="min-h-10 rounded-xl border border-slate-200 bg-white px-4 text-[12px] font-medium text-slate-700 shadow-sm hover:bg-slate-50 disabled:opacity-50"\n          >\n            {loadingMore ? '正在加载…' : '加载更早跟进'}\n          </button>\n        </div>\n      ) : null}\n    </div>\n  )\n}'''
          if marker not in text:
              raise SystemExit('FollowedPage load more marker not found')
          path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          test = Path('web/pipeline/tests/test_followed_scaling.py')
          test.write_text('''import unittest\nfrom pathlib import Path\n\n\nWEB_ROOT = Path(__file__).resolve().parents[2]\n\n\nclass FollowedScalingTests(unittest.TestCase):\n    def test_followed_route_supports_bounded_pagination_and_compact_status_index(self):\n        backend = (WEB_ROOT / "api" / "private.js").read_text(encoding="utf-8")\n        start = backend.index("async function followedRoute")\n        end = backend.index("function reminderPublicFacts", start)\n        followed = backend[start:end]\n        self.assertIn("view !== 'status-index'", followed)\n        self.assertIn("LIMIT 5001", followed)\n        self.assertIn("mode: 'FOLLOWED_STATUS_INDEX'", followed)\n        self.assertIn("LIMIT 101 OFFSET ${offset}", followed)\n        self.assertIn("has_more: hasMore", followed)\n        self.assertIn("organization_id = ${user.organization_id}", followed)\n\n    def test_opportunity_pool_uses_status_index_not_recent_detailed_page(self):\n        page = (WEB_ROOT / "src" / "pages" / "OpportunityPoolPage.tsx").read_text(encoding="utf-8")\n        self.assertIn("getFollowedStatusIndex", page)\n        self.assertNotIn("getFollowedOpportunities", page)\n\n    def test_followed_page_can_load_older_records_and_recover_focused_item_exactly(self):\n        page = (WEB_ROOT / "src" / "pages" / "FollowedPage.tsx").read_text(encoding="utf-8")\n        self.assertIn("getFollowedOpportunityPage", page)\n        self.assertIn("getFollowedStatusIndex", page)\n        self.assertIn("getFollowedOpportunityById(focusedId)", page)\n        self.assertIn("加载更早跟进", page)\n        self.assertIn("statusIndex.length", page)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/api/private.js web/src/services/followedApi.ts web/src/pages/OpportunityPoolPage.tsx web/src/pages/FollowedPage.tsx web/pipeline/tests/test_followed_scaling.py
          git commit -m "fix: scale followed history beyond recent hundred records"
          git push origin HEAD:chatgpt/opportunity-ranking-v2-final
