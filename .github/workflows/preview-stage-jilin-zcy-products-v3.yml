name: Preview Stage Jilin ZCY Products V3

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-stage-jilin-zcy-products-v3.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 0
      - name: Apply robust patch
        run: python3 web/pipeline/scripts/preview_patch_jilin_zcy_v2.py
      - name: Run pipeline regression suite
        run: |
          set -euo pipefail
          cd web/pipeline
          python3 -m unittest discover -s tests
      - name: Publish parser and tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 web/pipeline/scripts/publish_generated_data_github.py \
            --branch "${GITHUB_REF_NAME}" \
            --message 'feat: parse grounded Jilin ZCY product details' \
            web/pipeline/medical_channel_pipeline/ccgp_detail.py \
            web/pipeline/tests/test_ccgp_jilin_zcy_products.py
