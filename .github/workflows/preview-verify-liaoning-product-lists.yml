name: Preview Verify Liaoning Product Lists

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-verify-liaoning-product-lists.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 0

      - name: Apply staged Liaoning parser
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('web/scripts/preview_add_liaoning_product_lists.py')
          source = path.read_text(encoding='utf-8')
          prefix, rest = source.split("TEST.write_text(r'''", 1)
          body, suffix = rest.rsplit("''', encoding='utf-8')", 1)
          body, count = re.subn(
              r"text = '''(.*?)'''",
              lambda match: 'text = """' + match.group(1) + '"""',
              body,
              flags=re.S,
          )
          if count != 5:
              raise SystemExit(f'STAGING_TEST_STRING_COUNT_MISMATCH:{count}')
          fixed = prefix + "TEST.write_text(r'''" + body + "''', encoding='utf-8')" + suffix
          compile(fixed, str(path), 'exec')
          namespace = {'__name__': '__main__', '__file__': str(path)}
          exec(compile(fixed, str(path), 'exec'), namespace)
          PY

      - name: Run focused Liaoning regressions
        run: |
          set -euo pipefail
          cd web/pipeline
          python3 -m unittest \
            tests.test_ccgp_liaoning_product_lists \
            tests.test_ccgp_detail \
            tests.test_ccgp_product_table_variants \
            tests.test_validation \
            tests.test_channel_scope

      - name: Verify official Liaoning pages
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import time
          from pathlib import Path

          root = Path('web/pipeline').resolve()
          sys.path.insert(0, str(root))
          from medical_channel_pipeline.ccgp_detail import fetch_ccgp_detail_html, parse_ccgp_public_tender_html

          observed_at = '2026-09-09T00:00:00+00:00'

          def parse(label, opportunity_id, url):
              html = fetch_ccgp_detail_html(url)
              record = parse_ccgp_public_tender_html(
                  html,
                  source_url=url,
                  observed_at=observed_at,
                  opportunity_id=opportunity_id,
              )
              pairs = [
                  (str(item.get('raw_name') or ''), str(item.get('quantity') or ''))
                  for item in record['facts'].get('product_items') or []
              ]
              print(label, len(pairs), pairs)
              return pairs

          jinqiu = parse(
              'jinqiu-endoscopy',
              'ccgp_ln_1a3880ab31870644',
              'https://www.ccgp.gov.cn/cggg/dfgg/gkzb/202609/t20260908_27291255.htm',
          )
          expected_jinqiu = [
              ('超声主机', '1台'),
              ('超声电子上消化道内窥镜（扇扫）', '1条'),
              ('超声电子上消化道内窥镜（环扫）', '1条'),
              ('高清电子内窥镜系统', '1套'),
          ]
          if jinqiu != expected_jinqiu:
              raise SystemExit(f'JINQIU_PRODUCTS_MISMATCH:{jinqiu!r}')

          time.sleep(4.0)
          yuhong = parse(
              'yuhong-tb-equipment',
              'ccgp_ln_e098f4b20ac83f0c',
              'https://www.ccgp.gov.cn/cggg/dfgg/gkzb/202609/t20260908_27291252.htm',
          )
          expected_yuhong_prefix = [
              ('结核分枝杆菌耐药基因检测多通道分析仪', '1台'),
              ('高压蒸汽灭菌器', '1台'),
              ('生物安全柜', '1个'),
          ]
          if yuhong[:3] != expected_yuhong_prefix or len(yuhong) < 3:
              raise SystemExit(f'YUHONG_PRODUCTS_MISMATCH:{yuhong!r}')

          time.sleep(4.0)
          yingkou = parse(
              'yingkou-operating-room',
              'ccgp_ln_be60c73331219966',
              'https://www.ccgp.gov.cn/cggg/dfgg/gkzb/202609/t20260908_27288084.htm',
          )
          if len(yingkou) != 47:
              raise SystemExit(f'YINGKOU_PRODUCT_COUNT_MISMATCH:{len(yingkou)}')
          required_yingkou = {
              ('负极板回路垫', '2套'),
              ('电动综合手术床', '4张'),
              ('高频电刀', '4台'),
              ('麻醉机', '4台'),
              ('病人监护仪', '3台'),
              ('抓钳4', '2把'),
          }
          if not required_yingkou.issubset(set(yingkou)):
              raise SystemExit(f'YINGKOU_REQUIRED_PRODUCTS_MISSING:{yingkou!r}')

          time.sleep(4.0)
          attachment_only = parse(
              'huludao-attachment-only',
              'ccgp_ln_340f7081b4500696',
              'https://www.ccgp.gov.cn/cggg/dfgg/gkzb/202609/t20260908_27285310.htm',
          )
          if attachment_only:
              raise SystemExit(f'ATTACHMENT_ONLY_PRODUCTS_INVENTED:{attachment_only!r}')
          PY

      - name: Run full production build
        run: |
          set -euo pipefail
          cd web
          npm ci
          npm run build

      - name: Commit parser and tests atomically; remove one-shot files
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: preview/multi-region-ui-acceptance
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          expected_head = os.environ['EXPECTED_HEAD']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          def call(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = Request(url, data=data, headers=headers, method=method)
              with urlopen(req, timeout=60) as response:
                  body = response.read().decode('utf-8')
                  return json.loads(body) if body else {}

          ref_name = quote(f'heads/{branch}', safe='/')
          ref = call('GET', f'{api}/git/ref/{ref_name}')
          head_sha = ref['object']['sha']
          if head_sha != expected_head:
              raise SystemExit(f'REMOTE_HEAD_CHANGED expected={expected_head} actual={head_sha}')
          commit = call('GET', f'{api}/git/commits/{head_sha}')
          base_tree = commit['tree']['sha']

          write_paths = [
              'web/pipeline/medical_channel_pipeline/ccgp_detail.py',
              'web/pipeline/tests/test_ccgp_liaoning_product_lists.py',
          ]
          delete_paths = [
              'web/scripts/preview_add_liaoning_product_lists.py',
              '.github/workflows/preview-audit-liaoning-product-lists.yml',
              '.github/workflows/preview-verify-liaoning-product-lists.yml',
          ]
          tree = []
          for path in write_paths:
              file_path = Path(path)
              if not file_path.is_file():
                  raise SystemExit(f'MISSING_VERIFIED_FILE:{path}')
              blob = call('POST', f'{api}/git/blobs', {
                  'content': base64.b64encode(file_path.read_bytes()).decode('ascii'),
                  'encoding': 'base64',
              })
              tree.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          for path in delete_paths:
              tree.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})

          new_tree = call('POST', f'{api}/git/trees', {'base_tree': base_tree, 'tree': tree})
          new_commit = call('POST', f'{api}/git/commits', {
              'message': 'feat: parse grounded Liaoning product lists',
              'tree': new_tree['sha'],
              'parents': [head_sha],
          })
          call('PATCH', f'{api}/git/refs/{ref_name}', {'sha': new_commit['sha'], 'force': False})
          print('COMMITTED', new_commit['sha'])
          PY