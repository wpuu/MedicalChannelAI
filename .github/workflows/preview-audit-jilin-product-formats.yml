name: Preview Audit Jilin Product Formats

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-audit-jilin-product-formats.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 0

      - name: Audit current Jilin official detail formats
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import sys
          import time
          from html.parser import HTMLParser
          from pathlib import Path

          pipeline = Path('web/pipeline').resolve()
          sys.path.insert(0, str(pipeline))
          from medical_channel_pipeline.ccgp_detail import (
              fetch_ccgp_detail_html,
              html_to_text,
              parse_ccgp_competitive_consultation_html,
              parse_ccgp_public_tender_html,
          )

          class TableReader(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.tables=[]; self.depth=0; self.table=None; self.row=None; self.cell=None
              def handle_starttag(self, tag, attrs):
                  tag=tag.lower()
                  if tag=='table':
                      self.depth += 1
                      if self.depth==1: self.table=[]
                  elif self.depth==1 and tag=='tr': self.row=[]
                  elif self.depth==1 and tag in {'td','th'} and self.row is not None: self.cell=[]
              def handle_data(self, data):
                  if self.depth==1 and self.cell is not None and data.strip(): self.cell.append(data.strip())
              def handle_endtag(self, tag):
                  tag=tag.lower()
                  if self.depth==1 and tag in {'td','th'} and self.cell is not None:
                      self.row.append(' '.join(self.cell).strip()); self.cell=None
                  elif self.depth==1 and tag=='tr' and self.row is not None:
                      if any(x.strip() for x in self.row): self.table.append(self.row)
                      self.row=None
                  elif tag=='table' and self.depth:
                      if self.depth==1 and self.table is not None: self.tables.append(self.table)
                      self.depth -= 1

          payload = json.loads(Path('web/public/data/today-actions.public.json').read_text(encoding='utf-8'))
          candidates=[]
          for card in payload.get('opportunity_pool') or []:
              facts=card.get('facts') or {}
              if facts.get('market_code')!='JL' or facts.get('lifecycle_state')!='BIDDING':
                  continue
              if facts.get('product_items') or facts.get('product_categories'):
                  continue
              candidates.append(card)

          # Prefer the most explicit product-oriented titles so a missing parser is distinguishable
          # from a legitimately attachment-only or service-only notice.
          signals=('设备','器械','仪器','检验','影像','超声','CT','DR','内镜','监护','手术','医用','医疗')
          candidates.sort(key=lambda c:(-sum(s in str((c.get('facts') or {}).get('project_name') or '') for s in signals), c.get('rank') or 9999))
          selected=candidates[:8]
          report={
              'snapshot_as_of': payload.get('snapshot_as_of'),
              'jilin_bidding_empty_count': len(candidates),
              'selected_count': len(selected),
              'cases': [],
          }
          anchors=('采购需求','采购内容','项目需求','采购标的','货物名称','设备名称','品目名称','产品名称','数量（单位）','数量(单位)')
          for idx,card in enumerate(selected):
              if idx: time.sleep(4.0)
              facts=card.get('facts') or {}
              url=(card.get('evidence_source_urls') or [None])[0]
              case={
                  'rank': card.get('rank'),
                  'opportunity_id': card.get('opportunity_id'),
                  'project_name': facts.get('project_name'),
                  'buyer_name': facts.get('buyer_name'),
                  'procurement_method': facts.get('procurement_method'),
                  'source_url': url,
              }
              try:
                  html=fetch_ccgp_detail_html(url)
                  parser=(parse_ccgp_competitive_consultation_html if facts.get('procurement_method')=='竞争性磋商' else parse_ccgp_public_tender_html)
                  parsed=parser(html, source_url=url, observed_at='2026-09-10T06:30:00+08:00', opportunity_id=card.get('opportunity_id'))
                  pf=parsed.get('facts') or {}
                  case['current_parse']={
                      'product_categories': pf.get('product_categories') or [],
                      'product_items': pf.get('product_items') or [],
                  }
                  tr=TableReader(); tr.feed(html)
                  interesting=[]
                  for ti,rows in enumerate(tr.tables[:20]):
                      picked=[]
                      for row in rows[:20]:
                          joined=' | '.join(re.sub(r'\s+',' ',x).strip() for x in row)
                          if any(a in joined for a in anchors): picked.append(joined[:1200])
                      if picked: interesting.append({'table_index':ti,'rows':picked[:8]})
                  case['interesting_tables']=interesting[:8]
                  text=html_to_text(html)
                  positions=[(text.find(a),a) for a in anchors if text.find(a)>=0]
                  positions.sort()
                  excerpts=[]
                  for pos,a in positions[:6]:
                      excerpts.append({'anchor':a,'text':re.sub(r'\s+',' ',text[max(0,pos-180):pos+1800])[:2000]})
                  case['text_excerpts']=excerpts
              except Exception as exc:
                  case['error']=f'{type(exc).__name__}: {exc}'
              report['cases'].append(case)

          out=Path('web/pipeline/data/preview_jilin_product_audit.json')
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Commit audit report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/pipeline/data/preview_jilin_product_audit.json
          if git diff --cached --quiet; then
            echo "No audit report change"
            exit 0
          fi
          git commit -m "chore: capture Jilin product format audit"
          git push origin HEAD:preview/multi-region-ui-acceptance
