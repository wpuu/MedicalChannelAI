name: TMUGH Live Discovery Probe

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final
    paths:
      - '.github/workflows/tjmugh-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official early-signal pipeline without publishing
        shell: bash
        run: |
          set -euo pipefail
          python web/pipeline/scripts/sync_tjmugh_market_research.py \
            --as-of '2026-09-02T01:28:00+08:00' \
            --lookback-days 30 \
            --max-candidates 12 \
            --delay-seconds 3 \
            --records-output /tmp/tjmugh-records.json \
            --report-output /tmp/tjmugh-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/tjmugh-report.json').read_text(encoding='utf-8'))
          records = json.loads(Path('/tmp/tjmugh-records.json').read_text(encoding='utf-8'))
          print(json.dumps(report, ensure_ascii=False, indent=2))
          print(f'record_count={len(records)}')
          for record in records:
              facts = record['facts']
              print(json.dumps({
                  'opportunity_id': record['opportunity_id'],
                  'project_name': facts.get('project_name'),
                  'published_at': facts.get('published_at'),
                  'registration_deadline': facts.get('registration_deadline'),
                  'products': [item.get('raw_name') for item in facts.get('product_items') or []],
                  'contact': facts.get('public_contact'),
              }, ensure_ascii=False))
          target = [r for r in records if r['facts'].get('published_at') == '2026-08-31']
          if not target:
              raise SystemExit('LIVE_PROBE_2026_08_31_DETAIL_NOT_VERIFIED')
          if not target[0]['facts'].get('product_items'):
              raise SystemExit('LIVE_PROBE_2026_08_31_PRODUCTS_MISSING')
          PY
