name: Temporary Hospital Live Probe

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final
    paths:
      - '.github/workflows/tjmugh-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe TEDA verified early-signal details without publishing
        shell: bash
        run: |
          set +e
          set -uo pipefail
          python web/pipeline/scripts/sync_teda_market_research.py \
            --as-of '2026-09-02T03:00:00+08:00' \
            --lookback-days 90 \
            --index-pages 4 \
            --max-candidates 20 \
            --delay-seconds 3 \
            --records-output /tmp/teda-records.json \
            --report-output /tmp/teda-report.json
          sync_status=$?
          python - <<'PY'
          import json
          from pathlib import Path
          report_path = Path('/tmp/teda-report.json')
          records_path = Path('/tmp/teda-records.json')
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else {}
          records = json.loads(records_path.read_text(encoding='utf-8')) if records_path.exists() else []
          print(json.dumps(report, ensure_ascii=False, indent=2))
          print(f'record_count={len(records)}')
          for record in records:
              facts = record['facts']
              print(json.dumps({
                  'id': record['opportunity_id'],
                  'title': facts.get('project_name'),
                  'published_at': facts.get('published_at'),
                  'deadline': facts.get('registration_deadline') or facts.get('registration_deadline_date'),
                  'budget_cny': facts.get('budget_cny'),
                  'products': [item.get('raw_name') for item in facts.get('product_items') or []],
                  'contact': facts.get('public_contact'),
              }, ensure_ascii=False))
          PY
          exit "$sync_status"
