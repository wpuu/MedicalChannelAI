name: TMUGH Live Discovery Probe

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final
    paths:
      - '.github/workflows/tjmugh-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect official deadline wording
        shell: bash
        run: |
          set -euo pipefail
          cd web/pipeline
          python - <<'PY'
          import re
          import time
          from datetime import date
          from medical_channel_pipeline.tjmugh_discovery import (
              INDEX_URL,
              fetch_tjmugh_page,
              parse_tjmugh_index_html,
              select_candidates_since,
          )
          from medical_channel_pipeline.tjmugh_market_research import _visible_text

          index_html = fetch_tjmugh_page(INDEX_URL)
          candidates = select_candidates_since(
              parse_tjmugh_index_html(index_html),
              start_date=date(2026, 8, 4),
              end_date=date(2026, 9, 2),
              max_candidates=12,
          )
          print(f'candidate_count={len(candidates)}')
          for candidate in candidates:
              time.sleep(3)
              text = _visible_text(fetch_tjmugh_page(candidate.detail_url))
              snippets = []
              for match in re.finditer(r'报名|截止', text):
                  start = max(0, match.start() - 100)
                  end = min(len(text), match.end() + 220)
                  snippet = re.sub(r'\s+', ' ', text[start:end]).strip()
                  if snippet not in snippets:
                      snippets.append(snippet)
              print(f'--- {candidate.published_at} {candidate.detail_url}')
              for snippet in snippets[:6]:
                  print(snippet)
          PY
