name: Temporary Hospital Live Probe

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final
    paths:
      - '.github/workflows/tjmugh-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose TEDA index publication dates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import sys
          import time
          from pathlib import Path

          root = Path('web/pipeline')
          sys.path.insert(0, str(root))
          from medical_channel_pipeline.teda_discovery import fetch_teda_page, index_page_url, parse_teda_index_html

          for page in range(1, 5):
              if page > 1:
                  time.sleep(3)
              url = index_page_url(page)
              html = fetch_teda_page(url)
              candidates = parse_teda_index_html(html, index_url=url)
              print(f'PAGE={page} URL={url}')
              for candidate in candidates:
                  print(f'CANDIDATE title={candidate.title!r} date={candidate.published_at!r} url={candidate.detail_url}')
              if '/895' in html:
                  match = re.search(r'.{0,500}(?:/article/show/9/895|article/show/9/895).{0,800}', html, re.S)
                  print('RAW_895_SNIPPET_START')
                  print((match.group(0) if match else 'SNIPPET_NOT_FOUND').replace('\n', ' '))
                  print('RAW_895_SNIPPET_END')
          PY
