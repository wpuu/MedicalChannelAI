name: Temporary Hospital Live Probe

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final
    paths:
      - '.github/workflows/tjmugh-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run TEDA parser regression tests
        working-directory: web/pipeline
        run: |
          python -m unittest tests.test_teda_market_research tests.test_teda_sync

      - name: Run final TEDA live probe
        shell: bash
        run: |
          set -euo pipefail
          python web/pipeline/scripts/sync_teda_market_research.py \
            --as-of '2026-09-02T12:00:00+08:00' \
            --lookback-days 90 \
            --index-pages 4 \
            --max-candidates 20 \
            --delay-seconds 3 \
            --records-output /tmp/teda_records.json \
            --report-output /tmp/teda_report.json

      - name: Assert final TEDA gate and live facts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          records = json.loads(Path('/tmp/teda_records.json').read_text(encoding='utf-8'))
          report = json.loads(Path('/tmp/teda_report.json').read_text(encoding='utf-8'))

          assert report['publish_allowed'] is True, report
          assert report['publish_gate_reason'] == 'PASS', report
          assert report['discovered_early_title_count'] == 6, report
          assert report['new_verified_record_count'] == 5, report
          assert report['unsupported_candidate_count'] == 1, report
          assert report['failure_count'] == 0, report
          assert report['unsupported_missing_official_published_date_count'] == 1, report
          unsupported = report['unsupported_candidates']
          assert len(unsupported) == 1, unsupported
          assert unsupported[0]['url'].endswith('/895'), unsupported
          assert unsupported[0]['reason'] == 'TEDA_OFFICIAL_PUBLISHED_DATE_NOT_AVAILABLE', unsupported

          by_id = {item['opportunity_id']: item for item in records}
          assert set(by_id) == {'teda_901', 'teda_893', 'teda_883', 'teda_882', 'teda_876'}, set(by_id)
          first_883 = by_id['teda_883']['facts']['product_items'][0]
          assert first_883['raw_name'] == '电子内窥镜系统', first_883
          assert first_883['specification'] == '高端2套、中端2套', first_883
          assert first_883['quantity'] is None, first_883
          assert by_id['teda_883']['facts']['budget_cny'] == 10480000, by_id['teda_883']['facts']

          print(json.dumps({
              'gate': report['publish_gate_reason'],
              'verified': report['new_verified_record_count'],
              'unsupported': report['unsupported_candidate_count'],
              'failures': report['failure_count'],
              'unsupported_candidate': unsupported[0],
              'teda_883_first_product': first_883,
              'teda_883_budget_cny': by_id['teda_883']['facts']['budget_cny'],
          }, ensure_ascii=False, indent=2))
          PY
