name: Temporary Hospital Live Probe

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final
    paths:
      - '.github/workflows/tjmugh-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe TEDA official list pagination and early-signal discovery
        shell: bash
        run: |
          set -euo pipefail
          cd web/pipeline
          python - <<'PY'
          import time
          from medical_channel_pipeline.teda_discovery import (
              fetch_teda_page,
              index_page_url,
              parse_teda_index_html,
              stable_opportunity_id,
          )
          discovered = []
          seen = set()
          for page in range(1, 7):
              if page > 1:
                  time.sleep(3)
              url = index_page_url(page)
              html = fetch_teda_page(url)
              candidates = parse_teda_index_html(html, index_url=url)
              print(f'page={page} chars={len(html)} candidates={len(candidates)} url={url}')
              for item in candidates:
                  key = stable_opportunity_id(item.detail_url)
                  print(f'candidate={key}|{item.title}|{item.detail_url}')
                  if key not in seen:
                      seen.add(key)
                      discovered.append(item)
          target = [item for item in discovered if stable_opportunity_id(item.detail_url) == 'teda_901']
          if not target:
              raise SystemExit('TEDA_LIVE_PROBE_KNOWN_DEMAND_RESEARCH_NOT_DISCOVERED')
          time.sleep(3)
          detail = fetch_teda_page(target[0].detail_url)
          print(f'target_detail_chars={len(detail)}')
          if '医疗设备采购需求调研' not in detail or '报名截止时间' not in detail:
              raise SystemExit('TEDA_LIVE_PROBE_TARGET_DETAIL_CONTENT_MISSING')
          PY
