name: TMUGH Live Discovery Probe

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final
    paths:
      - '.github/workflows/tjmugh-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify official early-signal pipeline without publishing
        shell: bash
        run: |
          set +e
          set -uo pipefail
          python web/pipeline/scripts/sync_tjmugh_market_research.py \
            --as-of '2026-09-02T02:45:00+08:00' \
            --lookback-days 30 \
            --max-candidates 12 \
            --delay-seconds 3 \
            --records-output /tmp/tjmugh-records.json \
            --report-output /tmp/tjmugh-report.json
          sync_status=$?
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path('/tmp/tjmugh-report.json')
          records_path = Path('/tmp/tjmugh-records.json')
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else {}
          records = json.loads(records_path.read_text(encoding='utf-8')) if records_path.exists() else []
          print(json.dumps(report, ensure_ascii=False, indent=2))
          print(f'record_count={len(records)}')
          for record in records:
              facts = record['facts']
              print(json.dumps({
                  'opportunity_id': record['opportunity_id'],
                  'project_name': facts.get('project_name'),
                  'published_at': facts.get('published_at'),
                  'registration_deadline': facts.get('registration_deadline'),
                  'product_count': len(facts.get('product_items') or []),
                  'contact': facts.get('public_contact'),
              }, ensure_ascii=False))
          target = [record for record in records if record['facts'].get('published_at') == '2026-08-31']
          if not target:
              raise SystemExit('LIVE_PROBE_2026_08_31_DETAIL_NOT_VERIFIED')
          if target[0]['facts'].get('registration_deadline') != '2026-09-03T17:00:00+08:00':
              raise SystemExit('LIVE_PROBE_2026_08_31_DEADLINE_WRONG')
          if not target[0]['facts'].get('product_items'):
              raise SystemExit('LIVE_PROBE_2026_08_31_PRODUCTS_MISSING')
          PY
          verify_status=$?
          if [[ "$sync_status" -ne 0 ]]; then
            exit "$sync_status"
          fi
          exit "$verify_status"
