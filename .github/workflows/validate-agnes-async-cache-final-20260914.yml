name: Validate Agnes async cache final 2026-09-14

on:
  push:
    branches: [fix/agnes-discovery-async-cache-20260914]
    paths:
      - '.github/workflows/validate-agnes-async-cache-final-20260914.yml'

permissions:
  contents: read

jobs:
  staged-build:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_jEy8Ex9vRDBdXj1cQPKF8sRd
      VERCEL_PROJECT_ID: prj_7fk44eKUhdbfTUaXxEBMgIzZiqUM
    steps:
      - name: Require deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo '::error::VERCEL_TOKEN missing'; exit 1; }

      - name: Checkout exact final candidate
        uses: actions/checkout@v4
        with:
          ref: 8345eb9cb59736d6dde8c699b26ffd6b22293e90
          path: app
          persist-credentials: false

      - name: Assert exact candidate markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "agnes-discovery-live-v5-async-cache" app/web/api/ai/discover.js
          grep -q "waitUntil(task)" app/web/api/ai/discover.js
          grep -q "enable_thinking: false" app/web/api/ai/discover.js
          grep -q "body?.force_ai === true" app/web/api/ai/discover.js
          grep -q "agnes-discovery-continuation-v2" app/web/src/services/discoveryContinuationLedger.ts

      - name: Link exact Vercel project locally
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_jEy8Ex9vRDBdXj1cQPKF8sRd","projectId":"prj_7fk44eKUhdbfTUaXxEBMgIzZiqUM"}' > .vercel/project.json

      - name: Deploy isolated staged Production candidate
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          DEPLOY_URL="$(npx --yes vercel@latest deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN")"
          case "$DEPLOY_URL" in https://*) ;; *) echo '::error::No staged deployment URL'; exit 1;; esac
          echo "Staged final async-cache URL: $DEPLOY_URL"
          echo "Validated exact source: 8345eb9cb59736d6dde8c699b26ffd6b22293e90"
          echo "Production domain switch: skipped"
          echo "No verified snapshot write is performed."
