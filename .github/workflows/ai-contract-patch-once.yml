name: One-time deterministic AI contract migration

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final
    paths:
      - '.github/workflows/ai-contract-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/opportunity-ranking-v2-final
          fetch-depth: 0

      - name: Patch deterministic action selector integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'web/api/ai/_decisionContract.js',
              """function hasCustomerContext(context) {
            const root = asObject(context)
            if (!root) return false
            if (asObject(root.target_hospital)?.watched_by_customer === true) return true
            if (asObject(root.hospital_relationship)) return true
            if (Array.isArray(root.matching_product_capabilities) && root.matching_product_capabilities.length > 0) return true
            const policy = asObject(root.partnering_policy)
            return Boolean(policy && Object.values(policy).some((value) => value !== null && value !== undefined))
          }
          """.replace('          ', ''),
              """function hasCustomerContext(context) {
            const root = asObject(context)
            if (!root) return false
            if (asObject(root.target_hospital)?.watched_by_customer === true) return true
            if (asObject(root.hospital_relationship)) return true
            if (Array.isArray(root.matching_product_capabilities) && root.matching_product_capabilities.length > 0) return true
            const policy = asObject(root.partnering_policy)
            return Boolean(policy && Object.values(policy).some((value) => value !== null && value !== undefined))
          }

          function hasConfirmedExecutionContext(context) {
            const root = asObject(context)
            if (!root) return false
            if (asObject(root.hospital_relationship)) return true
            if (Array.isArray(root.matching_product_capabilities) && root.matching_product_capabilities.length > 0) return true
            const policy = asObject(root.partnering_policy)
            return Boolean(policy && Object.values(policy).some((value) => value === true))
          }
          """.replace('          ', ''),
          )
          replace_once(
              'web/api/ai/_decisionContract.js',
              "if (hasCustomerContext(customerContext)) allowed.add('MATCH_CONFIRMED_RESOURCES')",
              "if (hasConfirmedExecutionContext(customerContext)) allowed.add('MATCH_CONFIRMED_RESOURCES')",
          )
          replace_once(
              'web/api/ai/_decisionContract.js',
              """  const actionCodes = cleanList(value.action_codes, 3, 60)
            if (actionCodes.length === 0) throw invalid('AI_DECISION_INVALID')
            if (new Set(actionCodes).size !== actionCodes.length) throw invalid('AI_DECISION_DUPLICATE_ACTION')
          """.replace('          ', ''),
              """  if (!Array.isArray(value.action_codes) || value.action_codes.length < 1 || value.action_codes.length > 3) {
            throw invalid('AI_DECISION_INVALID')
          }
            const actionCodes = cleanList(value.action_codes, 3, 60)
            if (actionCodes.length !== value.action_codes.length) throw invalid('AI_DECISION_INVALID')
            if (new Set(actionCodes).size !== actionCodes.length) throw invalid('AI_DECISION_DUPLICATE_ACTION')
          """.replace('          ', ''),
          )

          replace_once(
              'web/api/ai/_analyzeCore.js',
              "const PUBLIC_AI_PROMPT_VERSION = 'decision-contract-v2-public-v1'",
              "const PUBLIC_AI_PROMPT_VERSION = 'decision-action-selector-v3-public-v1'",
          )
          replace_once(
              'web/api/ai/_analyzeCore.js',
              "return `decision-contract-v2:${snapshotAsOf || 'snapshot-unknown'}:${opportunityId}:window-${runtimeWindowStatus}:ctx-${fingerprint(customerContext)}`",
              "return `decision-action-selector-v3:${snapshotAsOf || 'snapshot-unknown'}:${opportunityId}:window-${runtimeWindowStatus}:ctx-${fingerprint(customerContext)}`",
          )
          replace_once(
              'web/api/ai/_analyzeCore.js',
              '        max_tokens: 900,',
              '        max_tokens: 160,',
          )
          replace_once(
              'web/api/ai/_analyzeCore.js',
              """    return parseDecisionContent(content, {
            relativeRegistrationWindow: windowStatus === 'RELATIVE_WINDOW',
          })
          """.replace('          ', ''),
              """    return parseDecisionContent(content, {
            facts,
            evidenceUrls,
            customerContext,
            windowStatus,
          })
          """.replace('          ', ''),
          )

          replace_once(
              'web/scripts/check-ai-boundary.mjs',
              """        action: '联系采购方核实当前窗口',
                    reasons: ['基于已核验公开事实进行下一步人工确认'],
                    risks: ['不得把未知客户关系写成事实'],
                    requires_human_confirmation: true,
          """.replace('          ', ''),
              """        action_codes: ['VERIFY_REQUIREMENTS'],
          """.replace('          ', ''),
          )
          PY

          node --check web/api/ai/_decisionContract.js
          node --check web/api/ai/_analyzeCore.js
          node --check web/scripts/check-ai-boundary.mjs
          node web/scripts/check-ai-decision-contract.mjs

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/api/ai/_decisionContract.js web/api/ai/_analyzeCore.js web/scripts/check-ai-boundary.mjs
          git diff --cached --check
          git commit -m "fix: make AI a deterministic action selector [full-verify]"
          git push origin HEAD:chatgpt/opportunity-ranking-v2-final
