name: Preview Validate Liaoning Refresh

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-validate-liaoning-refresh.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 25
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 0

      - name: Verify Liaoning and national parser regressions
        run: |
          cd web/pipeline
          python3 -m unittest tests.test_ccgp_liaoning_detail_format tests.test_ccgp_national_detail_formats -v

      - name: Build Liaoning-only query plan
        run: |
          python3 -c "import json; p=json.load(open('web/pipeline/data/multi_region_query_plan.json',encoding='utf-8')); p['markets']=[m for m in p['markets'] if m['market_code']=='LN']; json.dump(p,open('/tmp/liaoning-plan.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"

      - name: Run live Liaoning verification without publishing
        run: |
          AS_OF="$(python3 -c "from datetime import datetime,timezone; print(datetime.now(timezone.utc).isoformat())")"
          python3 web/pipeline/scripts/sync_regional_ccgp.py \
            --plan /tmp/liaoning-plan.json \
            --as-of "$AS_OF" \
            --existing-records-input web/pipeline/data/regional_live_ccgp_records.json \
            --records-output /tmp/liaoning-records.json \
            --report-output /tmp/liaoning-report.json

      - name: Print Liaoning acceptance report
        run: |
          python3 -c "import json; r=json.load(open('/tmp/liaoning-report.json',encoding='utf-8')); m=r['markets'][0]; print(json.dumps({'market_code':m['market_code'],'unique_candidate_count':m['unique_candidate_count'],'selected_candidate_count':m['selected_candidate_count'],'new_verified_record_count':m['new_verified_record_count'],'failure_count':m['failure_count'],'failures':m['failures']},ensure_ascii=False,indent=2))"
