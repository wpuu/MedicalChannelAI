name: Apply Agnes Output Contract Fix 2026-09-14

on:
  push:
    branches: [fix/agnes-discovery-output-contract-20260914]
    paths:
      - '.github/scripts/apply_agnes_output_contract_fix.py'
      - '.github/workflows/apply-agnes-output-contract-fix-20260914.yml'

permissions:
  contents: write

concurrency:
  group: medicalchannelai-agnes-contract-fix-20260914
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout fix branch through REST fallback
        uses: actions/checkout@v4
        with:
          ref: fix/agnes-discovery-output-contract-20260914

      - name: Verify untouched production source blob
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'web/api/ai/discover.js',
              ref: 'fix/agnes-discovery-output-contract-20260914',
            });
            if (Array.isArray(data) || data.sha !== '4a1302f1d2fc00b4b3e7905ca795e840629e528a') {
              core.setFailed(`Unexpected discover.js blob: ${Array.isArray(data) ? 'directory' : data.sha}`);
            }

      - name: Apply exact contract patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_agnes_output_contract_fix.py

      - name: Run focused regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            web.pipeline.tests.test_agnes_output_contract \
            web.pipeline.tests.test_agnes_discovery \
            web.pipeline.tests.test_agnes_model_consistency

      - name: Publish clean fix and remove one-shot helpers via GitHub API
        uses: actions/github-script@v7
        env:
          BRANCH: fix/agnes-discovery-output-contract-20260914
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.BRANCH;
            const encode = (path) => Buffer.from(fs.readFileSync(path, 'utf8')).toString('base64');
            const get = async (path) => {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (Array.isArray(data)) throw new Error(`${path} resolved to directory`);
              return data;
            };

            const discover = await get('web/api/ai/discover.js');
            if (discover.sha !== '4a1302f1d2fc00b4b3e7905ca795e840629e528a') {
              throw new Error(`discover.js changed before publish: ${discover.sha}`);
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, branch,
              path: 'web/api/ai/discover.js',
              message: 'fix: align Agnes discovery output contract',
              content: encode('web/api/ai/discover.js'),
              sha: discover.sha,
            });

            try {
              await get('web/pipeline/tests/test_agnes_output_contract.py');
              throw new Error('Regression test unexpectedly already exists');
            } catch (error) {
              if (!String(error?.status || error?.message).includes('404')) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, branch,
              path: 'web/pipeline/tests/test_agnes_output_contract.py',
              message: 'test: guard Agnes output contract',
              content: encode('web/pipeline/tests/test_agnes_output_contract.py'),
            });

            for (const path of [
              '.github/scripts/apply_agnes_output_contract_fix.py',
              '.github/workflows/apply-agnes-output-contract-fix-20260914.yml',
            ]) {
              const file = await get(path);
              await github.rest.repos.deleteFile({
                owner, repo, branch, path,
                message: `chore: remove one-shot ${path.split('/').pop()}`,
                sha: file.sha,
              });
            }
            core.notice('Published clean Agnes output contract fix; one-shot helpers removed.');
