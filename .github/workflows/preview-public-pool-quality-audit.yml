name: Preview Public Contact Phone Acceptance

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-public-pool-quality-audit.yml

permissions:
  contents: write

concurrency:
  group: preview-public-contact-phone-acceptance
  cancel-in-progress: true

jobs:
  verify-and-commit:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout Preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 0

      - name: Apply public-contact phone fix
        shell: bash
        run: |
          set -euo pipefail
          python3 web/scripts/preview_fix_public_contact_phone.py

      - name: Run focused parser regressions
        shell: bash
        run: |
          set -euo pipefail
          cd web/pipeline
          python3 -m unittest \
            tests.test_ccgp_detail \
            tests.test_ccgp_national_detail_formats \
            tests.test_ccgp_liaoning_detail_format \
            tests.test_validation

      - name: Run full production build
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm ci
          npm run build

      - name: Verify canonical and public phone invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path

          invalid = []
          for path in sorted(Path('web/pipeline/data').glob('*_records.json')):
              try:
                  payload = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if not isinstance(payload, list):
                  continue
              for record in payload:
                  if not isinstance(record, dict):
                      continue
                  facts = record.get('facts') or {}
                  contact = facts.get('public_contact') or {}
                  if not isinstance(contact, dict):
                      continue
                  raw = contact.get('phone')
                  value = str(raw or '').strip()
                  if value and len(re.findall(r'\d', value)) < 5:
                      invalid.append((path.name, record.get('opportunity_id'), raw))
          if invalid:
              raise SystemExit(f'INVALID_CANONICAL_PUBLIC_PHONE:{invalid!r}')

          snapshot = json.loads(Path('web/public/data/today-actions.public.json').read_text(encoding='utf-8'))
          pool = snapshot.get('opportunity_pool') or []
          target_url = 'https://www.ccgp.gov.cn/cggg/dfgg/gkzb/202609/t20260907_27278298.htm'
          target = None
          for card in pool:
              if target_url in (card.get('evidence_source_urls') or []):
                  target = card
                  break
          if target is None:
              raise SystemExit('TARGET_OPPORTUNITY_DROPPED_FROM_PUBLIC_POOL')
          contact = (target.get('facts') or {}).get('public_contact') or {}
          if contact.get('name') != '董艳':
              raise SystemExit(f'TARGET_CONTACT_NAME_CHANGED:{contact!r}')
          if contact.get('phone') is not None:
              raise SystemExit(f'TARGET_INVALID_PHONE_STILL_PUBLISHED:{contact!r}')

          public_invalid = []
          for card in pool:
              f = card.get('facts') or {}
              c = f.get('public_contact') or {}
              raw = c.get('phone') if isinstance(c, dict) else None
              value = str(raw or '').strip()
              if value and len(re.findall(r'\d', value)) < 5:
                  public_invalid.append((card.get('opportunity_id'), raw))
          if public_invalid:
              raise SystemExit(f'INVALID_PUBLIC_POOL_PHONE:{public_invalid!r}')

          distribution = Counter(str((card.get('facts') or {}).get('market_code') or '') for card in pool)
          if len(pool) != 88:
              raise SystemExit(f'PUBLIC_POOL_COUNT_CHANGED:{len(pool)}')
          if set(distribution) != {'TJ', 'BJ', 'HE', 'LN', 'JL', 'HL'}:
              raise SystemExit(f'PUBLIC_POOL_MARKETS_CHANGED:{dict(distribution)}')
          print(json.dumps({
              'public_pool_count': len(pool),
              'market_distribution': dict(sorted(distribution.items())),
              'target_contact': contact,
              'invalid_canonical_phone_count': len(invalid),
              'invalid_public_phone_count': len(public_invalid),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit verified fix atomically and remove one-shot files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: preview/multi-region-ui-acceptance
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          expected_head = os.environ['EXPECTED_HEAD']
          root = Path.cwd()
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          def call(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              request = Request(url, data=data, headers=headers, method=method)
              with urlopen(request, timeout=60) as response:
                  body = response.read().decode('utf-8')
                  return json.loads(body) if body else {}

          ref_name = quote(f'heads/{branch}', safe='/')
          ref = call('GET', f'{api}/git/ref/{ref_name}')
          head_sha = ref['object']['sha']
          if head_sha != expected_head:
              raise SystemExit(f'REMOTE_HEAD_CHANGED expected={expected_head} actual={head_sha}')
          commit = call('GET', f'{api}/git/commits/{head_sha}')
          base_tree = commit['tree']['sha']
          write_paths = [
              'web/pipeline/medical_channel_pipeline/ccgp_detail.py',
              'web/pipeline/tests/test_ccgp_detail.py',
              'web/pipeline/data/regional_live_ccgp_records.json',
              'web/public/data/today-actions.public.json',
          ]
          delete_paths = [
              'web/scripts/preview_fix_public_contact_phone.py',
              '.github/workflows/preview-public-pool-quality-audit.yml',
          ]
          tree = []
          for path in write_paths:
              file_path = root / path
              if not file_path.is_file():
                  raise SystemExit(f'MISSING_VERIFIED_FILE:{path}')
              blob = call('POST', f'{api}/git/blobs', {
                  'content': base64.b64encode(file_path.read_bytes()).decode('ascii'),
                  'encoding': 'base64',
              })
              tree.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          for path in delete_paths:
              tree.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
          new_tree = call('POST', f'{api}/git/trees', {'base_tree': base_tree, 'tree': tree})
          new_commit = call('POST', f'{api}/git/commits', {
              'message': 'fix: fail closed on invalid public contact phone',
              'tree': new_tree['sha'],
              'parents': [head_sha],
          })
          call('PATCH', f'{api}/git/refs/{ref_name}', {'sha': new_commit['sha'], 'force': False})
          print(f"committed {new_commit['sha']}")
          PY
