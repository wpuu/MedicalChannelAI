name: Preview Public Pool Quality Audit

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-public-pool-quality-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 5
    steps:
      - name: Checkout Preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 1

      - name: Audit canonical public-contact phone validity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          data_dir = Path('web/pipeline/data')
          files = sorted(data_dir.glob('*_records.json'))
          invalid = []
          checked = 0
          with_phone = 0

          for path in files:
              try:
                  payload = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if not isinstance(payload, list):
                  continue
              for record in payload:
                  if not isinstance(record, dict):
                      continue
                  facts = record.get('facts') or {}
                  contact = facts.get('public_contact') or {}
                  if not isinstance(contact, dict):
                      continue
                  checked += 1
                  raw = contact.get('phone')
                  value = str(raw or '').strip()
                  if not value:
                      continue
                  with_phone += 1
                  digit_count = len(re.findall(r'\d', value))
                  if digit_count < 5:
                      invalid.append({
                          'file': path.name,
                          'opportunity_id': record.get('opportunity_id'),
                          'project_name': facts.get('project_name'),
                          'contact_name': contact.get('name'),
                          'phone': raw,
                          'digit_count': digit_count,
                          'source_url': (record.get('source') or {}).get('url'),
                      })

          print('PHONE_AUDIT=' + json.dumps({
              'files_scanned': len(files),
              'records_with_contact_object': checked,
              'records_with_nonempty_phone': with_phone,
              'invalid_phone_count': len(invalid),
          }, ensure_ascii=False, sort_keys=True))
          for item in invalid:
              print('INVALID_PHONE=' + json.dumps(item, ensure_ascii=False, sort_keys=True))
          PY
