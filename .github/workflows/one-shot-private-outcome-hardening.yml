name: One-shot private outcome hardening

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final
    paths:
      - .github/workflows/one-shot-private-outcome-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'wpuu' && github.ref == 'refs/heads/chatgpt/opportunity-ranking-v2-final'
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 10
    steps:
      - name: Apply bounded server outcome guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: chatgpt/opportunity-ranking-v2-final
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          branch = os.environ['TARGET_BRANCH']
          api = f'https://api.github.com/repos/{repo}/contents'

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              if data is not None:
                  req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))

          def get_file(path):
              encoded_path = '/'.join(urllib.parse.quote(part, safe='') for part in path.split('/'))
              item = request('GET', f'{api}/{encoded_path}?ref={urllib.parse.quote(branch, safe="")}')
              content = base64.b64decode(item['content']).decode('utf-8')
              return content, item['sha']

          def put_file(path, content, message, sha=None):
              encoded_path = '/'.join(urllib.parse.quote(part, safe='') for part in path.split('/'))
              payload = {
                  'message': message,
                  'content': base64.b64encode(content.encode('utf-8')).decode('ascii'),
                  'branch': branch,
              }
              if sha:
                  payload['sha'] = sha
              return request('PUT', f'{api}/{encoded_path}', payload)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)

          private_path = 'web/api/private.js'
          source, source_sha = get_file(private_path)

          constants_anchor = """const NOT_FIT_REASONS = new Set([\n  'NO_PRODUCT_CAPABILITY', 'NO_MANUFACTURER_ACCESS', 'RELATIONSHIP_TOO_WEAK',\n  'AMOUNT_TOO_SMALL', 'PROJECT_TOO_LATE', 'COMPETITOR_LOCKED_CUSTOMER_JUDGMENT',\n  'DEPARTMENT_OUT_OF_SCOPE', 'REGION_OUT_OF_SCOPE', 'RENTAL_NOT_SUPPORTED', 'OTHER',\n])\n"""
          constants_replacement = constants_anchor + """const WON_REVIEW_NOTE_PREFIX = '成交复盘（当前用户判断）：'\nconst WON_REVIEW_LABELS = new Set([\n  '产品或参数匹配',\n  '厂家/授权资源有优势',\n  '医院关系或沟通推进有效',\n  '价格或商务条件有优势',\n  '介入时机合适',\n  '投标/响应执行到位',\n  '方案与客户需求匹配',\n  '其他',\n])\nconst LOST_REVIEW_NOTE_PREFIX = '未成交原因（当前用户判断）：'\nconst LOST_REVIEW_LABELS = new Set([\n  '价格/报价竞争失败',\n  '产品或参数不匹配',\n  '厂家/授权资源不足',\n  '医院关系不足',\n  '介入时间太晚',\n  '竞争对手优势明显',\n  '投标/响应执行失败',\n  '客户需求或项目变化',\n  '主动放弃',\n  '其他',\n])\n"""
          source = replace_once(source, constants_anchor, constants_replacement, 'review constants')

          helper_anchor = """function validateMutation(body) {\n"""
          helper_replacement = """function hasControlledOutcomeReview(status, note) {\n  if (typeof note !== 'string') return false\n  const config = status === 'WON'\n    ? [WON_REVIEW_NOTE_PREFIX, WON_REVIEW_LABELS]\n    : status === 'LOST'\n      ? [LOST_REVIEW_NOTE_PREFIX, LOST_REVIEW_LABELS]\n      : null\n  if (!config) return false\n  const [prefix, labels] = config\n  if (!note.startsWith(prefix)) return false\n  const label = note.slice(prefix.length).trim()\n  return labels.has(label)\n}\n\nfunction validateMutation(body) {\n"""
          source = replace_once(source, helper_anchor, helper_replacement, 'controlled review helper')

          source = replace_once(
              source,
              'SELECT id, remind_at FROM private_followups',
              'SELECT id, status, remind_at FROM private_followups',
              'locked followup status query',
          )

          guard_anchor = """      const followup = followupRows[0]\n      if (!followup) throw new Error('FOLLOWUP_UPSERT_FAILED')\n\n      let nextReminder = followup.remind_at ? new Date(followup.remind_at).toISOString() : null\n"""
          guard_replacement = """      const followup = followupRows[0]\n      if (!followup) throw new Error('FOLLOWUP_UPSERT_FAILED')\n\n      if (\n        (mutation.status === 'WON' || mutation.status === 'LOST') &&\n        followup.status !== mutation.status &&\n        !hasControlledOutcomeReview(mutation.status, mutation.note)\n      ) {\n        throw new Error('FOLLOWUP_OUTCOME_REVIEW_REQUIRED')\n      }\n\n      let nextReminder = followup.remind_at ? new Date(followup.remind_at).toISOString() : null\n"""
          source = replace_once(source, guard_anchor, guard_replacement, 'transition guard')

          catch_anchor = """  } catch (error) {\n    console.error('private followup request failed', {\n"""
          catch_replacement = """  } catch (error) {\n    if (error instanceof Error && error.message === 'FOLLOWUP_OUTCOME_REVIEW_REQUIRED') {\n      return sendJson(response, 400, { error: 'FOLLOWUP_OUTCOME_REVIEW_REQUIRED' })\n    }\n    console.error('private followup request failed', {\n"""
          source = replace_once(source, catch_anchor, catch_replacement, 'review error response')

          put_file(
              private_path,
              source,
              'fix: enforce private outcome review on server',
              source_sha,
          )

          test_path = 'web/pipeline/tests/test_private_outcome_transition_guard.py'
          test_content = r'''from __future__ import annotations

import unittest
from pathlib import Path

WEB_ROOT = Path(__file__).resolve().parents[2]


class PrivateOutcomeTransitionGuardTests(unittest.TestCase):
    @classmethod
    def setUpClass(cls) -> None:
        cls.private_api = (WEB_ROOT / "api" / "private.js").read_text(encoding="utf-8")

    def test_server_has_exact_controlled_win_and_loss_review_labels(self) -> None:
        self.assertIn("const WON_REVIEW_NOTE_PREFIX = '成交复盘（当前用户判断）：'", self.private_api)
        self.assertIn("const LOST_REVIEW_NOTE_PREFIX = '未成交原因（当前用户判断）：'", self.private_api)
        self.assertIn("'方案与客户需求匹配'", self.private_api)
        self.assertIn("'客户需求或项目变化'", self.private_api)
        self.assertIn("return labels.has(label)", self.private_api)

    def test_transition_guard_uses_locked_current_status(self) -> None:
        self.assertIn('SELECT id, status, remind_at FROM private_followups', self.private_api)
        self.assertIn("(mutation.status === 'WON' || mutation.status === 'LOST')", self.private_api)
        self.assertIn('followup.status !== mutation.status', self.private_api)
        self.assertIn('!hasControlledOutcomeReview(mutation.status, mutation.note)', self.private_api)
        self.assertIn("throw new Error('FOLLOWUP_OUTCOME_REVIEW_REQUIRED')", self.private_api)
        self.assertIn("sendJson(response, 400, { error: 'FOLLOWUP_OUTCOME_REVIEW_REQUIRED' })", self.private_api)

    def test_same_terminal_status_can_still_accept_later_freeform_notes(self) -> None:
        guard = self.private_api.index("(mutation.status === 'WON' || mutation.status === 'LOST')")
        status_check = self.private_api.index('followup.status !== mutation.status', guard)
        review_check = self.private_api.index('!hasControlledOutcomeReview(mutation.status, mutation.note)', status_check)
        self.assertLess(guard, status_check)
        self.assertLess(status_check, review_check)

    def test_idempotency_short_circuits_before_transition_guard(self) -> None:
        existing = self.private_api.index('const existingMutation = await tx`')
        short_circuit = self.private_api.index('if (existingMutation.length) return', existing)
        guard = self.private_api.index("(mutation.status === 'WON' || mutation.status === 'LOST')")
        self.assertLess(existing, short_circuit)
        self.assertLess(short_circuit, guard)


if __name__ == '__main__':
    unittest.main()
'''
          try:
              _, test_sha = get_file(test_path)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              test_sha = None
          put_file(
              test_path,
              test_content,
              'test: protect server outcome transition review',
              test_sha,
          )
          print('Private outcome server hardening published.')
          PY
