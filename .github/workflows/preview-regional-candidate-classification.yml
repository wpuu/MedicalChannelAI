name: Preview Regional Candidate Classification

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-regional-candidate-classification.yml

permissions:
  contents: write

concurrency:
  group: preview-regional-candidate-classification
  cancel-in-progress: true

jobs:
  patch-test-and-commit:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 25
    steps:
      - name: Checkout Preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 0

      - name: Apply regional candidate classification patch
        run: python3 web/scripts/preview_patch_regional_candidate_classification.py

      - name: Run focused classification and parser regressions
        run: |
          python3 -m unittest \
            web.pipeline.tests.test_regional_candidate_classification \
            web.pipeline.tests.test_channel_scope \
            web.pipeline.tests.test_ccgp_discovery \
            web.pipeline.tests.test_ccgp_detail \
            web.pipeline.tests.test_ccgp_national_detail_formats \
            web.pipeline.tests.test_ccgp_liaoning_detail_format

      - name: Verify system Node
        run: |
          node --version
          npm --version

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run full production build verification
        working-directory: web
        run: npm run build

      - name: Remove one-shot machinery
        run: |
          rm -f web/scripts/preview_patch_regional_candidate_classification.py
          rm -f .github/workflows/preview-regional-candidate-classification.yml

      - name: Commit verified Preview changes atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: preview/multi-region-ui-acceptance
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          expected_head = os.environ['EXPECTED_HEAD']
          root = Path.cwd()
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          def call(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              request = Request(url, data=data, headers=headers, method=method)
              with urlopen(request, timeout=60) as response:
                  body = response.read().decode('utf-8')
                  return json.loads(body) if body else {}

          ref_name = quote(f'heads/{branch}', safe='/')
          ref = call('GET', f'{api}/git/ref/{ref_name}')
          head_sha = ref['object']['sha']
          if head_sha != expected_head:
              raise SystemExit(f'REMOTE_HEAD_CHANGED expected={expected_head} actual={head_sha}')
          commit = call('GET', f'{api}/git/commits/{head_sha}')
          base_tree = commit['tree']['sha']

          write_paths = [
              'web/pipeline/scripts/sync_regional_ccgp.py',
              'web/pipeline/medical_channel_pipeline/regional_candidate.py',
              'web/pipeline/tests/test_regional_candidate_classification.py',
              'web/public/data/today-actions.public.json',
          ]
          delete_paths = [
              'web/scripts/preview_patch_regional_candidate_classification.py',
              '.github/workflows/preview-regional-candidate-classification.yml',
          ]

          tree = []
          for path in write_paths:
              file_path = root / path
              if not file_path.is_file():
                  raise SystemExit(f'MISSING_VERIFIED_FILE {path}')
              blob = call('POST', f'{api}/git/blobs', {
                  'content': base64.b64encode(file_path.read_bytes()).decode('ascii'),
                  'encoding': 'base64',
              })
              tree.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          for path in delete_paths:
              tree.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})

          new_tree = call('POST', f'{api}/git/trees', {'base_tree': base_tree, 'tree': tree})
          new_commit = call('POST', f'{api}/git/commits', {
              'message': 'fix: classify non-actionable regional discovery rows',
              'tree': new_tree['sha'],
              'parents': [head_sha],
          })
          call('PATCH', f'{api}/git/refs/{ref_name}', {'sha': new_commit['sha'], 'force': False})
          print(f"committed {new_commit['sha']}")
          PY
