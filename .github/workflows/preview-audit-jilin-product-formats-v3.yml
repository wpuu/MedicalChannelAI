name: Preview Audit Jilin Product Formats V3

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-audit-jilin-product-formats-v3.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 0
      - name: Capture Jilin official product formats
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, sys, time
          from html.parser import HTMLParser
          from pathlib import Path
          pipeline=Path('web/pipeline').resolve(); sys.path.insert(0,str(pipeline))
          from medical_channel_pipeline.ccgp_detail import fetch_ccgp_detail_html, html_to_text, parse_ccgp_competitive_consultation_html, parse_ccgp_public_tender_html
          class T(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=True); self.tables=[]; self.d=0; self.t=None; self.r=None; self.c=None
              def handle_starttag(self,tag,attrs):
                  tag=tag.lower()
                  if tag=='table': self.d+=1; self.t=[] if self.d==1 else self.t
                  elif self.d==1 and tag=='tr': self.r=[]
                  elif self.d==1 and tag in {'td','th'} and self.r is not None: self.c=[]
              def handle_data(self,data):
                  if self.d==1 and self.c is not None and data.strip(): self.c.append(data.strip())
              def handle_endtag(self,tag):
                  tag=tag.lower()
                  if self.d==1 and tag in {'td','th'} and self.c is not None: self.r.append(' '.join(self.c).strip()); self.c=None
                  elif self.d==1 and tag=='tr' and self.r is not None:
                      if any(x.strip() for x in self.r): self.t.append(self.r)
                      self.r=None
                  elif tag=='table' and self.d:
                      if self.d==1 and self.t is not None: self.tables.append(self.t)
                      self.d-=1
          payload=json.loads(Path('web/public/data/today-actions.public.json').read_text(encoding='utf-8'))
          candidates=[]
          for card in payload.get('opportunity_pool') or []:
              f=card.get('facts') or {}
              if f.get('market_code')=='JL' and f.get('lifecycle_state')=='BIDDING' and not f.get('product_items') and not f.get('product_categories'): candidates.append(card)
          signals=('设备','器械','仪器','检验','影像','超声','CT','DR','内镜','监护','手术','医用','医疗')
          candidates.sort(key=lambda c:(-sum(s in str((c.get('facts') or {}).get('project_name') or '') for s in signals),c.get('rank') or 9999))
          report={'snapshot_as_of':payload.get('snapshot_as_of'),'jilin_bidding_empty_count':len(candidates),'selected_count':min(8,len(candidates)),'cases':[]}
          anchors=('采购需求','采购内容','项目需求','采购标的','货物名称','设备名称','品目名称','产品名称','数量（单位）','数量(单位)','数量')
          for i,card in enumerate(candidates[:8]):
              if i: time.sleep(4)
              f=card.get('facts') or {}; url=(card.get('evidence_source_urls') or [None])[0]
              case={'rank':card.get('rank'),'opportunity_id':card.get('opportunity_id'),'project_name':f.get('project_name'),'buyer_name':f.get('buyer_name'),'procurement_method':f.get('procurement_method'),'source_url':url}
              try:
                  html=fetch_ccgp_detail_html(url); text=html_to_text(html)
                  parser=parse_ccgp_competitive_consultation_html if f.get('procurement_method')=='竞争性磋商' else parse_ccgp_public_tender_html
                  parsed=parser(html,source_url=url,observed_at='2026-09-10T06:40:00+08:00',opportunity_id=card.get('opportunity_id')); pf=parsed.get('facts') or {}
                  case['current_parse']={'product_categories':pf.get('product_categories') or [],'product_items':pf.get('product_items') or []}
                  tr=T(); tr.feed(html); interesting=[]
                  for ti,rows in enumerate(tr.tables[:20]):
                      picked=[]
                      for row in rows[:30]:
                          joined=' | '.join(re.sub(r'\s+',' ',x).strip() for x in row)
                          if any(a in joined for a in anchors): picked.append(joined[:1400])
                      if picked: interesting.append({'table_index':ti,'rows':picked[:10]})
                  case['interesting_tables']=interesting[:10]
                  excerpts=[]; seen=set()
                  for a in anchors:
                      p=text.find(a)
                      if p>=0 and p not in seen:
                          seen.add(p); excerpts.append({'anchor':a,'text':re.sub(r'\s+',' ',text[max(0,p-200):p+2200])[:2400]})
                  case['text_excerpts']=excerpts[:8]
              except Exception as e: case['error']=f'{type(e).__name__}: {e}'
              report['cases'].append(case)
          Path('web/pipeline/data/preview_jilin_product_audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Publish audit report via Git Data API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 web/pipeline/scripts/publish_generated_data_github.py \
            --branch "${GITHUB_REF_NAME}" \
            --message 'chore: capture Jilin product format audit' \
            web/pipeline/data/preview_jilin_product_audit.json
