name: Preview Commit Beijing Product Backfill

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-commit-beijing-product-backfill.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance

      - name: Reverify build guard and commit Beijing product backfill
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: preview/multi-region-ui-acceptance
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 web/scripts/preview_commit_beijing_product_backfill.py
