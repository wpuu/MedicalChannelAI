name: PR36 temporary hosted verification

on:
  push:
    branches: [owner/sameday-recovery-cycle-20260927]
    paths:
      - '.github/workflows/pr36-hosted-verify-20260927.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax check collector trigger
        run: python -m py_compile web/api/collector-run.py
      - name: Run collector trigger security contract
        run: python -m unittest web.pipeline.tests.test_collector_run_security
