name: Preview Backfill Liaoning Product Items V3

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-backfill-liaoning-product-items-v3.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 1

      - name: Backfill current Liaoning public opportunities from official pages
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys
          import time
          from copy import deepcopy
          from pathlib import Path

          root = Path('web/pipeline').resolve()
          sys.path.insert(0, str(root))
          from medical_channel_pipeline.ccgp_detail import fetch_ccgp_detail_html, parse_ccgp_competitive_consultation_html, parse_ccgp_public_tender_html

          data_path = root / 'data/regional_live_ccgp_records.json'
          public_path = Path('web/public/data/today-actions.public.json')
          records = json.loads(data_path.read_text(encoding='utf-8'))
          public = json.loads(public_path.read_text(encoding='utf-8'))
          public_ln_ids = {c['opportunity_id'] for c in (public.get('opportunity_pool') or []) if (c.get('facts') or {}).get('market_code') == 'LN'}
          if len(public_ln_ids) != 6:
              raise SystemExit(f'LIAONING_PUBLIC_COUNT_UNEXPECTED:{len(public_ln_ids)}')
          by_id = {r['opportunity_id']: r for r in records}
          missing = sorted(public_ln_ids - set(by_id))
          if missing:
              raise SystemExit(f'LIAONING_PUBLIC_CANONICAL_MISSING:{missing}')
          targets = [by_id[i] for i in sorted(public_ln_ids)]

          required_recovered = {'ccgp_ln_1a3880ab31870644', 'ccgp_ln_e098f4b20ac83f0c'}
          recovered_ids = set()
          recovered_items = 0
          unsupported_ids = set()
          for position, record in enumerate(targets):
              if position:
                  time.sleep(4.0)
              facts = record.get('facts') or {}
              url = (record.get('source') or {}).get('url')
              if not url:
                  raise SystemExit(f'MISSING_SOURCE_URL:{record.get("opportunity_id")}')
              html = fetch_ccgp_detail_html(url)
              parser = parse_ccgp_competitive_consultation_html if facts.get('procurement_method') == '竞争性磋商' else parse_ccgp_public_tender_html
              parsed = parser(html, source_url=url, observed_at=record['source']['observed_at'], opportunity_id=record['opportunity_id'])
              parsed_facts = parsed.get('facts') or {}
              if parsed_facts.get('project_number') != facts.get('project_number'):
                  raise SystemExit(f'PROJECT_NUMBER_MISMATCH:{record["opportunity_id"]}')
              old_name = str(facts.get('project_name') or '').strip()
              new_name = str(parsed_facts.get('project_name') or '').strip()
              if not (old_name == new_name or old_name.startswith(new_name) or new_name.startswith(old_name)):
                  raise SystemExit(f'PROJECT_NAME_MISMATCH:{record["opportunity_id"]}:{old_name}:{new_name}')

              items = deepcopy(parsed_facts.get('product_items') or [])
              categories = deepcopy(parsed_facts.get('product_categories') or [])
              if not items and not categories:
                  unsupported_ids.add(record['opportunity_id'])
                  print('NO_GROUNDED_PRODUCTS', record['opportunity_id'], old_name)
                  continue
              product_evidence = [deepcopy(e) for e in (parsed.get('evidence') or []) if e.get('field_path') in {'facts.product_items', 'facts.product_categories'}]
              if not any(e.get('field_path') == 'facts.product_items' for e in product_evidence):
                  raise SystemExit(f'MISSING_PRODUCT_EVIDENCE:{record["opportunity_id"]}')
              facts['product_items'] = items
              facts['product_categories'] = categories
              record['evidence'] = [e for e in (record.get('evidence') or []) if e.get('field_path') not in {'facts.product_items', 'facts.product_categories'}] + product_evidence
              recovered_ids.add(record['opportunity_id'])
              recovered_items += len(items)
              print('RECOVERED', record['opportunity_id'], old_name, len(items), [(i.get('raw_name'), i.get('quantity')) for i in items])

          if not required_recovered.issubset(recovered_ids):
              raise SystemExit(f'REQUIRED_LIAONING_RECOVERY_MISSING:{sorted(required_recovered - recovered_ids)}')
          if recovered_items < 8:
              raise SystemExit(f'LIAONING_ITEM_RECOVERY_TOO_LOW:{recovered_items}')
          data_path.write_text(json.dumps(records, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('LIAONING_BACKFILL', 'recovered=', sorted(recovered_ids), 'items=', recovered_items, 'unsupported=', sorted(unsupported_ids))
          PY

      - name: Run full production build
        run: |
          set -euo pipefail
          cd web
          npm ci
          npm run build

      - name: Verify pool identity and exact grounded Liaoning gain
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          payload = json.loads(Path('web/public/data/today-actions.public.json').read_text(encoding='utf-8'))
          cards = payload.get('opportunity_pool') or []
          if len(cards) != 92 or payload.get('opportunity_pool_count') != 92:
              raise SystemExit(f'PUBLIC_POOL_COUNT_CHANGED:{len(cards)}:{payload.get("opportunity_pool_count")}')
          counts = Counter((c.get('facts') or {}).get('market_code') for c in cards)
          expected = {'TJ': 26, 'BJ': 16, 'HE': 14, 'LN': 6, 'JL': 8, 'HL': 22}
          if dict(counts) != expected:
              raise SystemExit(f'MARKET_COUNTS_CHANGED:{dict(counts)}')
          ln = [c for c in cards if (c.get('facts') or {}).get('market_code') == 'LN']
          structured = [c for c in ln if (c.get('facts') or {}).get('product_items') or (c.get('facts') or {}).get('product_categories')]
          ids = {c['opportunity_id'] for c in structured}
          required = {'ccgp_ln_1a3880ab31870644', 'ccgp_ln_e098f4b20ac83f0c'}
          if not required.issubset(ids):
              raise SystemExit(f'PUBLIC_REQUIRED_LIAONING_MISSING:{sorted(required - ids)}')
          item_count = sum(len((c.get('facts') or {}).get('product_items') or []) for c in structured)
          if item_count < 8:
              raise SystemExit(f'PUBLIC_LIAONING_ITEM_COUNT_TOO_LOW:{item_count}')
          print('POOL_OK', len(cards), expected)
          print('LIAONING_STRUCTURED', len(structured), 'ITEMS', item_count, [(c['opportunity_id'], (c.get('facts') or {}).get('project_name'), len((c.get('facts') or {}).get('product_items') or [])) for c in structured])
          PY

      - name: Commit verified Liaoning enrichment atomically and clean one-shot workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: preview/multi-region-ui-acceptance
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          token, repo, branch, expected_head = os.environ['GH_TOKEN'], os.environ['REPOSITORY'], os.environ['BRANCH'], os.environ['EXPECTED_HEAD']
          api = f'https://api.github.com/repos/{repo}'
          headers = {'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          def call(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              with urlopen(Request(url, data=data, headers=headers, method=method), timeout=60) as response:
                  body = response.read().decode(); return json.loads(body) if body else {}
          ref_name = quote(f'heads/{branch}', safe='/')
          head_sha = call('GET', f'{api}/git/ref/{ref_name}')['object']['sha']
          if head_sha != expected_head:
              raise SystemExit(f'REMOTE_HEAD_CHANGED expected={expected_head} actual={head_sha}')
          base_tree = call('GET', f'{api}/git/commits/{head_sha}')['tree']['sha']
          tree = []
          for path in ['web/pipeline/data/regional_live_ccgp_records.json','web/public/data/today-actions.public.json']:
              blob = call('POST', f'{api}/git/blobs', {'content':base64.b64encode(Path(path).read_bytes()).decode(),'encoding':'base64'})
              tree.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          for path in ['.github/workflows/preview-product-coverage-audit.yml','.github/workflows/preview-backfill-liaoning-product-items.yml','.github/workflows/preview-backfill-liaoning-product-items-v2.yml','.github/workflows/preview-backfill-liaoning-product-items-v3.yml']:
              tree.append({'path':path,'mode':'100644','type':'blob','sha':None})
          new_tree = call('POST', f'{api}/git/trees', {'base_tree':base_tree,'tree':tree})
          new_commit = call('POST', f'{api}/git/commits', {'message':'data: backfill grounded Liaoning product items','tree':new_tree['sha'],'parents':[head_sha]})
          call('PATCH', f'{api}/git/refs/{ref_name}', {'sha':new_commit['sha'],'force':False})
          print('COMMITTED', new_commit['sha'])
          PY
