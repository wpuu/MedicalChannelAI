name: Preview Diagnose Jilin Backfill

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-diagnose-jilin-backfill.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 0
      - name: Capture guarded backfill result
        run: |
          set +e
          cd web/pipeline
          python3 scripts/preview_backfill_verified_jilin_products.py > /tmp/jilin-backfill.log 2>&1
          STATUS=$?
          cd ../..
          python3 - "$STATUS" <<'PY'
          import json, pathlib, sys
          status = int(sys.argv[1])
          text = pathlib.Path('/tmp/jilin-backfill.log').read_text(encoding='utf-8', errors='replace')
          pathlib.Path('web/pipeline/data/preview_jilin_backfill_diagnostic.json').write_text(
              json.dumps({'exit_code': status, 'output': text[-12000:]}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          exit 0
      - name: Publish diagnostic
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 web/pipeline/scripts/publish_generated_data_github.py \
            --branch "${GITHUB_REF_NAME}" \
            --message 'chore: capture Jilin backfill diagnostic' \
            web/pipeline/data/preview_jilin_backfill_diagnostic.json
