name: Benchmark Agnes V9 Batch Size 2026-09-14

on:
  push:
    branches: [benchmark/agnes25-vs-30-20260914]
    paths:
      - '.github/workflows/benchmark-agnes-v9-batch-size-20260914.yml'

permissions:
  contents: read

concurrency:
  group: medicalchannelai-agnes-v9-batch-size-20260914
  cancel-in-progress: true

jobs:
  benchmark-build:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_jEy8Ex9vRDBdXj1cQPKF8sRd
      VERCEL_PROJECT_ID: prj_7fk44eKUhdbfTUaXxEBMgIzZiqUM
    steps:
      - name: Require deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo '::error::VERCEL_TOKEN missing'; exit 1; }

      - name: Checkout exact accepted main
        uses: actions/checkout@v4
        with:
          ref: ac26f308258eaefc6fb74bfa723e9dbf3cf2d57e
          path: app
          persist-credentials: false

      - name: Inject V9 batch-size benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          app = Path('app')
          root = app / 'web/pipeline/data'
          positive_files = [root/'tianjin_live_teda_records.json', root/'tianjin_live_tjmugh_records.json', root/'tianjin_live_tjzyefy_intent_records.json']
          negative_files = [root/'tianjin_live_tjfch_records.json', root/'tianjin_live_tjzyefy_records.json', root/'tianjin_live_ccgp_records.json']
          pos_states = {'MARKET_RESEARCH','PROCUREMENT_INTENT','SUPPLIER_RECRUITMENT'}
          neg_states = {'BIDDING','AWARD','RESULT'}

          def collect(paths, states, label):
              out, seen = [], set()
              for path in paths:
                  for row in json.loads(path.read_text(encoding='utf-8')):
                      facts, source = row.get('facts') or {}, row.get('source') or {}
                      state = str(facts.get('lifecycle_state') or '').upper()
                      title = str(facts.get('project_name') or '').strip()
                      url = str(source.get('url') or '').strip()
                      if state in states and title and url and url not in seen:
                          seen.add(url)
                          out.append({'title':title,'url':url,'label':label,'state':state})
              return out

          positives = sorted(collect(positive_files,pos_states,'positive'), key=lambda x:(x['state'],x['url']))[:11]
          negatives = sorted(collect(negative_files,neg_states,'negative'), key=lambda x:(x['state'],x['url']))[:11]
          if len(positives) != 11 or len(negatives) != 11:
              raise SystemExit(f'corpus gate failed positives={len(positives)} negatives={len(negatives)}')
          corpus = {'positives': positives, 'negatives': negatives}

          script = r'''const corpus = __CORPUS__
          const batchSizes = [6,8,12]
          const timeoutMs = 12000
          const model = 'agnes-3.0-flash'
          const signalTypes = new Set(['DEMAND_RESEARCH','SUPPLIER_RECRUITMENT','TEST_ENTERPRISE_RECRUITMENT','ARGUMENTATION_INVITATION','PURCHASE_INTENTION','OTHER_PREPROCUREMENT'])
          const keys = String(process.env.AGNES_API_KEYS || process.env.AGNES_API_KEY || '').split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean)
          const baseUrl = String(process.env.AGNES_API_BASE_URL || 'https://apihub.agnes-ai.com/v1').trim().replace(/\/+$/,'')
          if (!keys.length) { console.error('AGNES_V9_SAFE_ERROR=AGNES_KEY_MISSING'); process.exit(2) }
          console.log('AGNES_V9_INFO_JSON='+JSON.stringify({key_count:keys.length,batch_sizes:batchSizes,model,thinking:false,timeout_ms:timeoutMs,prompt_contract:'signal_type_single_string_v2',production_data_mutated:false}))

          const sleep=(ms)=>new Promise(resolve=>setTimeout(resolve,ms))
          function batchFor(size){
            const half=size/2
            const positives=corpus.positives.slice(0,half)
            const negatives=corpus.negatives.slice(0,half)
            const rows=[]
            for(let i=0;i<half;i++){rows.push(positives[i],negatives[i])}
            return {positives,negatives,anchors:rows.map(({title,url})=>({title,url}))}
          }
          function messages(anchors){return [
            {role:'system',content:'你是医疗行业公开商机发现器。只从输入的官方公开来源链接列表中挑选仍可能影响需求、测试、论证、方案或采购准备的前期窗口。优先：需求调研、供应商征集、测试企业征集、论证邀请、采购意向。排除：正式招标公告、成交/中标结果、评分细则、招聘、人事、党建、新闻宣传、纯制度通知。禁止补全、改写、猜测URL；只能原样返回输入URL。不要把判断说成已验证事实。严格输出JSON，不要Markdown。'},
            {role:'user',content:JSON.stringify({source:'MedicalChannelAI V9 固定批量基准',source_kind:'OFFICIAL_BENCHMARK',anchors,max_candidates:12,allowed_signal_types:Array.from(signalTypes),output_rules:['candidates只包含判断为采购前期窗口的链接','每个candidate的signal_type必须是单个字符串，且只能取allowed_signal_types中的一个值','confidence必须是0到1之间的数字','reason不超过30个汉字','不要返回title字段'],output_schema:{candidates:[{url:'必须与输入URL完全一致',signal_type:'单个字符串枚举值',confidence:0.95,reason:'不超过30个汉字'}]}})}
          ]}
          function jsonContent(s){return s.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim()}
          function parse(content,anchors){
            let payload
            try{payload=JSON.parse(jsonContent(content))}catch{return {ok:false,error:'AI_RESPONSE_INVALID'}}
            if(!payload||typeof payload!=='object'||!Array.isArray(payload.candidates))return {ok:false,error:'AI_RESPONSE_INVALID'}
            const allowed=new Map(anchors.map(x=>[x.url,x]));const selected=[];const seen=new Set();let ungrounded=0,invalid=0
            for(const row of payload.candidates){
              if(!row||typeof row!=='object'){invalid++;continue}
              const url=typeof row.url==='string'?row.url.trim():''
              if(!allowed.has(url)){ungrounded++;continue}
              const type=typeof row.signal_type==='string'?row.signal_type.trim().toUpperCase():''
              const confidence=Number(row.confidence)
              const reason=typeof row.reason==='string'?row.reason.replace(/\s+/g,' ').trim():''
              if(!signalTypes.has(type)||!Number.isFinite(confidence)||confidence<0||confidence>1||!reason){invalid++;continue}
              if(!seen.has(url)){seen.add(url);selected.push(url)}
            }
            return {ok:true,raw:payload.candidates.length,selected,ungrounded,invalid}
          }
          async function runOne(size,slot){
            const batch=batchFor(size)
            const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeoutMs);const started=Date.now()
            try{
              const response=await fetch(baseUrl+'/chat/completions',{method:'POST',signal:controller.signal,headers:{Authorization:`Bearer ${keys[slot]}`,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({model,messages:messages(batch.anchors),temperature:0,max_tokens:1400,stream:false,chat_template_kwargs:{enable_thinking:false}})})
              const latency_ms=Date.now()-started
              if(!response.ok)return {batch_size:size,key_slot:slot,provider_ok:false,quality_pass:false,latency_ms,error:`UPSTREAM_HTTP_${response.status}`}
              const payload=await response.json();const content=payload?.choices?.[0]?.message?.content
              if(typeof content!=='string'||!content.trim())return {batch_size:size,key_slot:slot,provider_ok:false,quality_pass:false,latency_ms,error:'UPSTREAM_CONTENT_EMPTY'}
              const parsed=parse(content,batch.anchors)
              if(!parsed.ok)return {batch_size:size,key_slot:slot,provider_ok:false,quality_pass:false,latency_ms,error:parsed.error}
              const selected=new Set(parsed.selected)
              const hits=batch.positives.filter(x=>selected.has(x.url)).length
              const fp=batch.negatives.filter(x=>selected.has(x.url)).length
              const recall=hits/batch.positives.length
              const false_positive_rate=fp/batch.negatives.length
              const precision=selected.size?hits/selected.size:1
              const quality_pass=recall===1&&fp===0&&parsed.ungrounded===0&&parsed.invalid===0
              return {batch_size:size,key_slot:slot,provider_ok:true,quality_pass,latency_ms,raw_candidate_count:parsed.raw,candidate_count:selected.size,positive_hits:hits,false_positives:fp,recall:Number(recall.toFixed(4)),false_positive_rate:Number(false_positive_rate.toFixed(4)),precision:Number(precision.toFixed(4)),rejected_ungrounded_count:parsed.ungrounded,rejected_invalid_count:parsed.invalid}
            }catch(error){
              const latency_ms=Date.now()-started
              const timed=error?.name==='AbortError'||/aborted/i.test(String(error?.message||error||''))
              return {batch_size:size,key_slot:slot,provider_ok:false,quality_pass:false,latency_ms,error:timed?'TIMEOUT':'PROVIDER_EXCEPTION'}
            }finally{clearTimeout(timer)}
          }

          const rows=[]
          for(const size of batchSizes){
            for(let slot=0;slot<keys.length;slot+=1){
              const row=await runOne(size,slot)
              rows.push(row)
              console.log('AGNES_V9_ROW_JSON='+JSON.stringify(row))
              await sleep(1000)
            }
          }
          const percentile=(values,p)=>{if(!values.length)return null;const a=[...values].sort((x,y)=>x-y);return a[Math.min(a.length-1,Math.max(0,Math.ceil(p*a.length)-1))]}
          const report={}
          for(const size of batchSizes){
            const r=rows.filter(x=>x.batch_size===size)
            const providerOk=r.filter(x=>x.provider_ok)
            const quality=r.filter(x=>x.quality_pass)
            const lat=r.map(x=>x.latency_ms).filter(Number.isFinite)
            const avg=(key)=>providerOk.length?Number((providerOk.reduce((s,x)=>s+Number(x[key]??0),0)/providerOk.length).toFixed(4)):null
            report[String(size)]={attempts:r.length,provider_successes:providerOk.length,quality_passes:quality.length,quality_pass_rate:Number((quality.length/r.length).toFixed(4)),timeouts:r.filter(x=>x.error==='TIMEOUT').length,p50_latency_ms:percentile(lat,.5),p95_latency_ms:percentile(lat,.95),avg_recall:avg('recall'),avg_false_positive_rate:avg('false_positive_rate'),avg_precision:avg('precision')}
          }
          const expected=batchSizes.length*keys.length
          if(rows.length!==expected){console.error(`AGNES_V9_SAFE_ERROR=ATTEMPT_COUNT_MISMATCH expected=${expected} actual=${rows.length}`);process.exit(3)}
          console.log('AGNES_V9_REPORT_JSON='+JSON.stringify(report))
          '''.replace('__CORPUS__', json.dumps(corpus, ensure_ascii=False))

          scripts = app/'web/scripts'
          scripts.mkdir(parents=True, exist_ok=True)
          (scripts/'agnes-v9-batch-benchmark.mjs').write_text(script, encoding='utf-8')
          package_path=app/'web/package.json'
          pkg=json.loads(package_path.read_text(encoding='utf-8'))
          pkg['scripts']['build']='node scripts/agnes-v9-batch-benchmark.mjs && '+pkg['scripts']['build']
          package_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'injected':True,'batch_sizes':[6,8,12],'key_slots':'runtime','model':'agnes-3.0-flash','thinking':False},ensure_ascii=False))
          PY
          grep -q 'AGNES_V9_REPORT_JSON' app/web/scripts/agnes-v9-batch-benchmark.mjs
          grep -q 'enable_thinking:false' app/web/scripts/agnes-v9-batch-benchmark.mjs

      - name: Link exact Vercel project locally
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_jEy8Ex9vRDBdXj1cQPKF8sRd","projectId":"prj_7fk44eKUhdbfTUaXxEBMgIzZiqUM"}' > .vercel/project.json

      - name: Deploy isolated staged Production benchmark
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          DEPLOY_URL="$(npx --yes vercel@latest deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN")"
          case "$DEPLOY_URL" in https://*) ;; *) echo '::error::No staged deployment URL'; exit 1;; esac
          echo "Staged V9 benchmark URL: $DEPLOY_URL"
          echo "Production domain switch: skipped"
          echo "Agnes 3.0 thinking off; batch sizes 6/8/12; 3 key slots sequential; SLA 12s."
          echo "No verified snapshot write is performed."
