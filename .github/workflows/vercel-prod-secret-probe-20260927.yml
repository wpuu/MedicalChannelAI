name: MCAI Vercel Production Secret Probe 2026-09-27

on:
  push:
    branches:
      - ops/vercel-prod-secret-probe-20260927
    paths:
      - '.github/workflows/vercel-prod-secret-probe-20260927.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      NEON_POSTGRES_URL: ${{ secrets.NEON_POSTGRES_URL }}

    steps:
      - name: Report secret presence only
        shell: bash
        run: |
          set -euo pipefail
          present() {
            local name="$1"
            local value="$2"
            if [[ -n "$value" ]]; then
              echo "$name=PRESENT"
            else
              echo "$name=MISSING"
            fi
          }
          present VERCEL_TOKEN "${VERCEL_TOKEN:-}"
          present DATABASE_URL "${DATABASE_URL:-}"
          present POSTGRES_URL "${POSTGRES_URL:-}"
          present NEON_DATABASE_URL "${NEON_DATABASE_URL:-}"
          present NEON_POSTGRES_URL "${NEON_POSTGRES_URL:-}"
