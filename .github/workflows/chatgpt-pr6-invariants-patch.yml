name: PR6 private data invariant patch

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/opportunity-ranking-v2-final
          fetch-depth: 0
      - name: Apply private data invariant patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} not found')
              return text.replace(old, new, 1)

          # Restore the explicit target-vs-relationship scoring boundary that CI locks.
          path = Path('web/api/_privateProfileContext.js')
          text = path.read_text(encoding='utf-8')
          old = "  const relationshipPoint = context.hospital_relationship\n    ? relationshipPoints(context.hospital_relationship.relationship_strength)\n    : 0"
          new = "  // Target-hospital interest is deliberately NOT relationship evidence and therefore\n  // contributes zero relationship points. Only a customer-confirmed relationship scores.\n  const relationshipPoint = context.hospital_relationship\n    ? relationshipPoints(context.hospital_relationship.relationship_strength)\n    : 0"
          path.write_text(replace_once(text, old, new, '_privateProfileContext relationship boundary'), encoding='utf-8')

          # Enforce reminder/status consistency and ignore stale non-MONITOR reminders.
          path = Path('web/api/private.js')
          text = path.read_text(encoding='utf-8')
          old = "  if (status === 'NOT_FIT' && (!reason || !NOT_FIT_REASONS.has(reason))) return null\n  if (status !== 'NOT_FIT' && reason) return null\n  return {\n    status,\n    mutation_id: mutationId,\n    note,\n    reason: status === 'NOT_FIT' ? reason : null,\n    remind_at: remindAt,\n    reminder_supplied: Object.prototype.hasOwnProperty.call(body, 'remind_at'),\n  }"
          new = "  if (status === 'NOT_FIT' && (!reason || !NOT_FIT_REASONS.has(reason))) return null\n  if (status !== 'NOT_FIT' && reason) return null\n  const reminderSupplied = Object.prototype.hasOwnProperty.call(body, 'remind_at')\n  if (status !== 'MONITOR' && reminderSupplied && remindAt) return null\n  return {\n    status,\n    mutation_id: mutationId,\n    note,\n    reason: status === 'NOT_FIT' ? reason : null,\n    remind_at: remindAt,\n    reminder_supplied: reminderSupplied,\n  }"
          text = replace_once(text, old, new, 'private mutation validation')
          old_due = "      AND f.remind_at IS NOT NULL\n      AND f.remind_at <= now()"
          new_due = "      AND f.status = 'MONITOR'\n      AND f.remind_at IS NOT NULL\n      AND f.remind_at <= now()"
          path.write_text(replace_once(text, old_due, new_due, 'private due reminder filter'), encoding='utf-8')

          # Normalize duplicate private resources server-side; last submitted row wins per logical scope.
          path = Path('web/api/profile.js')
          text = path.read_text(encoding='utf-8')
          old = "  const canFindManufacturer = triState(body.can_find_manufacturer)\n  const canPartnerChannel = triState(body.can_partner_channel)\n  const canHandleLease = triState(body.can_handle_lease)"
          new = "  const productCapabilityMap = new Map()\n  for (const item of productCapabilities) {\n    productCapabilityMap.set(item.keyword.toLowerCase(), item)\n  }\n  const relationshipMap = new Map()\n  for (const item of hospitalRelationships) {\n    relationshipMap.set(targetKey(item), item)\n  }\n\n  const canFindManufacturer = triState(body.can_find_manufacturer)\n  const canPartnerChannel = triState(body.can_partner_channel)\n  const canHandleLease = triState(body.can_handle_lease)"
          text = replace_once(text, old, new, 'profile dedupe insertion point')
          old_return = "    product_capabilities: productCapabilities,\n    hospital_relationships: hospitalRelationships,"
          new_return = "    product_capabilities: [...productCapabilityMap.values()],\n    hospital_relationships: [...relationshipMap.values()],"
          text = replace_once(text, old_return, new_return, 'profile dedupe return')

          replacements = {
              'DELETE FROM private_product_capabilities WHERE user_id = ${user.id}': 'DELETE FROM private_product_capabilities WHERE user_id = ${user.id} AND organization_id = ${user.organization_id}',
              'DELETE FROM private_hospital_relationships WHERE user_id = ${user.id}': 'DELETE FROM private_hospital_relationships WHERE user_id = ${user.id} AND organization_id = ${user.organization_id}',
              'DELETE FROM private_target_hospitals WHERE user_id = ${user.id}': 'DELETE FROM private_target_hospitals WHERE user_id = ${user.id} AND organization_id = ${user.organization_id}',
          }
          for old_value, new_value in replacements.items():
              if old_value not in text:
                  raise SystemExit(f'profile scoped delete not found: {old_value}')
              text = text.replace(old_value, new_value)
          path.write_text(text, encoding='utf-8')

          test = Path('web/pipeline/tests/test_private_data_invariants.py')
          test.write_text('''import unittest\nfrom pathlib import Path\n\n\nWEB_ROOT = Path(__file__).resolve().parents[2]\n\n\nclass PrivateDataInvariantTests(unittest.TestCase):\n    def test_non_monitor_status_cannot_keep_future_reminder(self):\n        source = (WEB_ROOT / "api" / "private.js").read_text(encoding="utf-8")\n        self.assertIn("status !== 'MONITOR' && reminderSupplied && remindAt", source)\n        self.assertIn("AND f.status = 'MONITOR'", source)\n\n    def test_profile_write_deduplicates_logical_resource_scopes(self):\n        source = (WEB_ROOT / "api" / "profile.js").read_text(encoding="utf-8")\n        self.assertIn("productCapabilityMap.set(item.keyword.toLowerCase(), item)", source)\n        self.assertIn("relationshipMap.set(targetKey(item), item)", source)\n        self.assertIn("product_capabilities: [...productCapabilityMap.values()]", source)\n        self.assertIn("hospital_relationships: [...relationshipMap.values()]", source)\n\n    def test_profile_destructive_writes_are_scoped_to_current_organization(self):\n        source = (WEB_ROOT / "api" / "profile.js").read_text(encoding="utf-8")\n        self.assertIn("DELETE FROM private_product_capabilities WHERE user_id = ${user.id} AND organization_id = ${user.organization_id}", source)\n        self.assertIn("DELETE FROM private_hospital_relationships WHERE user_id = ${user.id} AND organization_id = ${user.organization_id}", source)\n        self.assertIn("DELETE FROM private_target_hospitals WHERE user_id = ${user.id} AND organization_id = ${user.organization_id}", source)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/api/_privateProfileContext.js web/api/private.js web/api/profile.js web/pipeline/tests/test_private_data_invariants.py
          git commit -m "fix: enforce private CRM data invariants"
          git push origin HEAD:chatgpt/opportunity-ranking-v2-final
