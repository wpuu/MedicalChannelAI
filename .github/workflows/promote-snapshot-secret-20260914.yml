name: Promote snapshot secret 2026-09-14

on:
  push:
    branches: [release/snapshot-secret-stage-20260914]
    paths:
      - '.github/workflows/promote-snapshot-secret-20260914.yml'

permissions:
  contents: read

concurrency:
  group: medicalchannelai-snapshot-secret-promote-20260914
  cancel-in-progress: false

jobs:
  promote:
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GITHUB_REPO_TOKEN: ${{ github.token }}
      VERCEL_ORG_ID: team_jEy8Ex9vRDBdXj1cQPKF8sRd
      VERCEL_PROJECT_ID: prj_7fk44eKUhdbfTUaXxEBMgIzZiqUM
      EXPECTED_MAIN_SHA: 5b35ea51f45774b110147d3fbf7d0c66b5e749cf
      STAGED_DEPLOYMENT_ID: dpl_GNGXKzQF9Ks2QeHFz6TSCqxmdW5V
      OLD_PRODUCTION_DEPLOYMENT_ID: dpl_CCihWbU5nYxhFB3ayiKWqtmFeNDd
      PUBLIC_STATUS_URL: https://medicalchannelai.vercel.app/api/status
      PUBLIC_SNAPSHOT_URL: https://medicalchannelai.vercel.app/api/public-snapshot
    steps:
      - name: Require deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo '::error::VERCEL_TOKEN missing'; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fail closed if main changed
        shell: bash
        run: |
          set -euo pipefail
          MAIN_JSON="$(curl -fsS -H "Authorization: Bearer $GITHUB_REPO_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/wpuu/MedicalChannelAI/commits/main')"
          CURRENT_MAIN_SHA="$(MAIN_JSON="$MAIN_JSON" node -e "const v=JSON.parse(process.env.MAIN_JSON); process.stdout.write(v.sha || '')")"
          echo "Current main: $CURRENT_MAIN_SHA"
          test "$CURRENT_MAIN_SHA" = "$EXPECTED_MAIN_SHA" || { echo '::error::main changed; promotion stopped'; exit 1; }

      - name: Recheck staged deployment
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_JSON="$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$STAGED_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
          DEPLOY_JSON="$DEPLOY_JSON" STAGED_DEPLOYMENT_ID="$STAGED_DEPLOYMENT_ID" node <<'NODE'
          const d = JSON.parse(process.env.DEPLOY_JSON || '{}');
          const state = d.readyState || d.state;
          console.log(`staged deployment=${d.id || 'missing'} state=${state || 'missing'} target=${d.target || 'missing'}`);
          if (!(d.id === process.env.STAGED_DEPLOYMENT_ID && state === 'READY' && d.target === 'production')) process.exit(1);
          NODE

      - name: Promote and verify with automatic rollback
        shell: bash
        run: |
          set -euo pipefail

          healthy_status() {
            STATUS_JSON="$1" node <<'NODE'
          let s;
          try { s = JSON.parse(process.env.STATUS_JSON || '{}'); } catch { process.exit(1); }
          const ok = s.ready === true && s.degraded === false && s.ai?.configured === true && s.snapshot?.available === true && s.snapshot?.freshness === 'FRESH' && s.snapshot?.today_card_count === 5 && s.snapshot?.opportunity_pool_count === 144;
          if (!ok) process.exit(1);
          NODE
          }

          bad_token_is_401() {
            code="$(curl --silent --show-error --output /tmp/bad-token-live.json --write-out '%{http_code}' --request PUT "$PUBLIC_SNAPSHOT_URL" --header 'Authorization: Bearer deliberately-invalid-token-20260914' --header 'Content-Type: application/json' --data '{}')"
            rm -f /tmp/bad-token-live.json
            test "$code" = '401'
          }

          rollback_old() {
            echo "Rolling back to $OLD_PRODUCTION_DEPLOYMENT_ID"
            curl -sS --request POST -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/rollback/$OLD_PRODUCTION_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID" >/tmp/rollback-response.txt || true
            rm -f /tmp/rollback-response.txt
          }

          promote_http="$(curl -sS --output /tmp/promote-response.txt --write-out '%{http_code}' --request POST -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$STAGED_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
          rm -f /tmp/promote-response.txt
          echo "Promote API HTTP=$promote_http"
          case "$promote_http" in 200|201|202) ;; *) echo '::error::Promote API failed before acceptance'; exit 1;; esac

          accepted=0
          for attempt in $(seq 1 18); do
            status_json="$(curl -fsS --max-time 15 "$PUBLIC_STATUS_URL" 2>/dev/null || true)"
            if healthy_status "$status_json" && bad_token_is_401; then
              accepted=1
              echo "Production gate PASS on attempt $attempt: ready, FRESH, 5/144, bad-token=401"
              break
            fi
            sleep 5
          done

          if [ "$accepted" -ne 1 ]; then
            echo '::error::Post-promote gate failed; rolling back.'
            rollback_old
            exit 1
          fi

          echo "Promoted deployment: $STAGED_DEPLOYMENT_ID"
          echo "Rollback baseline retained: $OLD_PRODUCTION_DEPLOYMENT_ID"
