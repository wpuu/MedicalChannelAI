name: Preview CCGP Product Table Audit

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-ccgp-product-table-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 8
    steps:
      - name: Checkout Preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 1

      - name: Inspect bounded official product-table samples
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import time
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path('web/pipeline').resolve()
          sys.path.insert(0, str(root))
          from medical_channel_pipeline.ccgp_detail import fetch_ccgp_detail_html, html_to_text

          samples = [
              ('BJ_BREAST', 'https://www.ccgp.gov.cn/cggg/zygg/gkzb/202609/t20260908_27289494.htm'),
              ('LN_ENDOSCOPE', 'https://www.ccgp.gov.cn/cggg/dfgg/gkzb/202609/t20260908_27291255.htm'),
              ('JL_ULTRASOUND', 'https://www.ccgp.gov.cn/cggg/dfgg/gkzb/202609/t20260908_27284446.htm'),
              ('HL_CT', 'https://www.ccgp.gov.cn/cggg/dfgg/gkzb/202609/t20260908_27291415.htm'),
              ('HL_ENDOSCOPE', 'https://www.ccgp.gov.cn/cggg/dfgg/gkzb/202609/t20260908_27291176.htm'),
          ]

          class TableParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.tables = []
                  self.table_depth = 0
                  self.current_table = None
                  self.current_row = None
                  self.current_cell = None
              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  if tag == 'table':
                      self.table_depth += 1
                      if self.table_depth == 1:
                          self.current_table = []
                  elif self.table_depth == 1 and tag == 'tr':
                      self.current_row = []
                  elif self.table_depth == 1 and tag in {'td','th'}:
                      self.current_cell = []
              def handle_data(self, data):
                  if self.table_depth == 1 and self.current_cell is not None:
                      value = data.strip()
                      if value:
                          self.current_cell.append(value)
              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if self.table_depth == 1 and tag in {'td','th'} and self.current_cell is not None:
                      self.current_row.append(' '.join(self.current_cell).strip())
                      self.current_cell = None
                  elif self.table_depth == 1 and tag == 'tr' and self.current_row is not None:
                      if any(cell for cell in self.current_row):
                          self.current_table.append(self.current_row)
                      self.current_row = None
                  elif tag == 'table' and self.table_depth:
                      if self.table_depth == 1 and self.current_table is not None:
                          self.tables.append(self.current_table)
                          self.current_table = None
                      self.table_depth -= 1

          for idx, (label, url) in enumerate(samples):
              if idx:
                  time.sleep(4.0)
              html = fetch_ccgp_detail_html(url)
              parser = TableParser()
              parser.feed(html)
              text = html_to_text(html)
              print(f'=== SAMPLE {label} {url} ===')
              matched_tables = []
              for ti, rows in enumerate(parser.tables):
                  flat = ' '.join(' '.join(row) for row in rows)
                  if any(marker in flat for marker in ('采购标的', '品目名称', '数量（单位）', '数量(单位)', '合同包')):
                      matched_tables.append((ti, rows))
              print(f'TABLE_COUNT={len(parser.tables)} MATCHED_TABLE_COUNT={len(matched_tables)}')
              for ti, rows in matched_tables[:4]:
                  print(f'-- TABLE {ti} rows={len(rows)} --')
                  for row in rows[:20]:
                      print('ROW=' + repr(row))
              pos = text.find('采购需求')
              if pos >= 0:
                  print('TEXT_AROUND_DEMAND=' + repr(text[pos:pos+2200]))
              else:
                  print('TEXT_AROUND_DEMAND=NOT_FOUND')
          PY
