name: Finalize Agnes async cache 2026-09-14

on:
  push:
    branches: [fix/agnes-discovery-async-cache-20260914]
    paths:
      - '.github/workflows/finalize-agnes-async-cache-20260914.yml'

permissions:
  contents: write

jobs:
  finalize-and-test:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/agnes-discovery-async-cache-20260914
          path: app
          persist-credentials: false

      - name: Apply final exact fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 app/.github/scripts/finalize_agnes_async_cache_20260914.py

      - name: Run full Python regression
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/web/pipeline"
          python3 -m unittest discover -s web/pipeline/tests -p 'test_*.py'

      - name: Write tested formal files back
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: fix/agnes-discovery-async-cache-20260914
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.TARGET_BRANCH;
            for (const path of [
              'web/api/ai/discover.js',
              'web/src/services/discoveryContinuationLedger.ts',
              'web/pipeline/tests/test_agnes_async_cache.py',
            ]) {
              let sha;
              try {
                const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
                if (!Array.isArray(current.data) && current.data.type === 'file') sha = current.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              const content = fs.readFileSync(`app/${path}`, 'utf8');
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch, sha,
                message: `fix: finalize Agnes async cache (${path})`,
                content: Buffer.from(content, 'utf8').toString('base64'),
              });
              core.info(`wrote ${path}`);
            }

      - name: Remove one-shot files and prior validation workflow
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: fix/agnes-discovery-async-cache-20260914
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.TARGET_BRANCH;
            for (const path of [
              '.github/scripts/finalize_agnes_async_cache_20260914.py',
              '.github/workflows/finalize-agnes-async-cache-20260914.yml',
              '.github/workflows/validate-agnes-async-cache-20260914.yml',
            ]) {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (Array.isArray(current.data) || current.data.type !== 'file') throw new Error(`missing ${path}`);
              await github.rest.repos.deleteFile({
                owner, repo, path, branch, sha: current.data.sha,
                message: `chore: remove one-shot validation file ${path}`,
              });
              core.info(`removed ${path}`);
            }
