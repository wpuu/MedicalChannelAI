name: Pilot Preview Acceptance

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final
    paths:
      - .github/workflows/pilot-preview-acceptance.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PILOT_SMOKE_BASE_URL: https://medicalchannelai-jssnkgczq-rerisse7-1717s-projects.vercel.app
      PILOT_SMOKE_INVITE_CODE: ${{ secrets.PILOT_SMOKE_INVITE_CODE }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      PILOT_SMOKE_AI: '1'
    steps:
      - name: Checkout exact accepted application revision
        uses: actions/checkout@v4
        with:
          ref: c58cb93069579fef48bcd0dad612dca01569356c

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Require acceptance secrets before any account mutation
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PILOT_SMOKE_INVITE_CODE:-}" ]]; then
            echo 'PILOT_SMOKE_INVITE_CODE_NOT_CONFIGURED' >&2
            exit 3
          fi
          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo 'VERCEL_AUTOMATION_BYPASS_SECRET_NOT_CONFIGURED' >&2
            exit 4
          fi

      - name: Add outreach assertions to local smoke copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('web/scripts/pilot-preview-smoke.mjs')
          text = path.read_text(encoding='utf-8')
          marker = "  if (testAi) {\n"
          if text.count(marker) != 1:
              raise SystemExit('OUTREACH_SMOKE_PATCH_MARKER_INVALID')
          insert = r'''  const outreach = await request('/api/ai/analyze?route=outreach', {
            method: 'POST',
            body: { opportunity_id: opportunityId },
            expected: [200],
          })
          assert(outreach.payload?.opportunity_id === opportunityId, 'OUTREACH_OPPORTUNITY_ID_MISMATCH')
          assert(
            typeof outreach.payload?.draft === 'string' && outreach.payload.draft.trim(),
            'OUTREACH_DRAFT_EMPTY',
          )
          assert(outreach.payload.draft.includes('正在确认'), 'OUTREACH_UNCONFIRMED_CAPABILITY_WORDING_MISSING')
          assert(!/STRONG|强关系|院内关系/.test(outreach.payload.draft), 'OUTREACH_RELATIONSHIP_LEAKED')
          assert(!/已获授权|厂家授权|授权代理/.test(outreach.payload.draft), 'OUTREACH_AUTHORIZATION_OVERCLAIMED')
          assert(
            typeof outreach.payload?.disclaimer === 'string'
              && outreach.payload.disclaimer.includes('院内关系仅用于内部判断'),
            'OUTREACH_INTERNAL_RELATIONSHIP_DISCLAIMER_MISSING',
          )

          '''
          path.write_text(text.replace(marker, insert + marker), encoding='utf-8')
          PY

      - name: Run destructive-safe private Pilot API smoke
        working-directory: web
        run: node scripts/pilot-preview-smoke.mjs
