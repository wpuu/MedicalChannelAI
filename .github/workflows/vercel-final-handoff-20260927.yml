name: MCAI Final Vercel Handoff 2026-09-27

on:
  push:
    branches: [ops/vercel-final-handoff-20260927]
    paths:
      - '.github/workflows/vercel-final-handoff-20260927.yml'

permissions:
  contents: read

jobs:
  handoff:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_jEy8Ex9vRDBdXj1cQPKF8sRd
      TEAM_SLUG: rerisse7-1717s-projects
      PROJECT_ID: prj_7fk44eKUhdbfTUaXxEBMgIzZiqUM
      VERCEL_ORG_ID: team_jEy8Ex9vRDBdXj1cQPKF8sRd
      VERCEL_PROJECT_ID: prj_7fk44eKUhdbfTUaXxEBMgIzZiqUM
      PUBLIC_ORIGIN: https://medicalchannelai.vercel.app
      EXPECTED_COMMIT: 2d91574

    steps:
      - name: Wait for exact Production commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            code="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/status.json" -w '%{http_code}' "$PUBLIC_ORIGIN/api/status" || true)"
            commit="$(python3 - "$RUNNER_TEMP/status.json" <<'PY'
          import json,sys
          try:
              print(str(json.load(open(sys.argv[1],encoding='utf-8')).get('commit') or ''))
          except Exception:
              print('')
          PY
          )"
            echo "Attempt $attempt: http=$code commit=$commit"
            if [[ "$code" = "200" && "$commit" = "$EXPECTED_COMMIT" ]]; then
              echo 'EXACT_PRODUCTION_COMMIT=PASS'
              exit 0
            fi
            sleep 10
          done
          echo '::error::Expected Production commit did not become active in time.'
          exit 1

      - name: Pull existing CRON_SECRET securely with Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          (
            cd "$tmpdir"
            npx --yes vercel@latest pull --yes --environment=production --scope "$TEAM_SLUG" --token "$VERCEL_TOKEN" >/dev/null
            npx --yes vercel@latest env pull "$RUNNER_TEMP/prod.env" --environment=production --yes --scope "$TEAM_SLUG" --token "$VERCEL_TOKEN" >/dev/null
          )
          python3 - "$RUNNER_TEMP/prod.env" "$RUNNER_TEMP/cron_secret" <<'PY'
          import sys
          from pathlib import Path
          src=Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          value=''
          for line in src:
              if line.startswith('CRON_SECRET='):
                  value=line.split('=',1)[1].strip()
                  if len(value)>=2 and value[0]==value[-1] and value[0] in {'"', "'"}:
                      value=value[1:-1]
                  break
          if len(value) < 24:
              raise SystemExit('CRON_SECRET_PULL_EMPTY')
          Path(sys.argv[2]).write_text(value,encoding='utf-8')
          print('CRON_SECRET_PULL=PASS')
          PY
          CRON_SECRET_VALUE="$(cat "$RUNNER_TEMP/cron_secret")"
          echo "::add-mask::$CRON_SECRET_VALUE"
          chmod 600 "$RUNNER_TEMP/cron_secret"
          rm -f "$RUNNER_TEMP/prod.env"

      - name: Trigger authenticated deep collector
        shell: bash
        run: |
          set -euo pipefail
          CRON_SECRET_VALUE="$(cat "$RUNNER_TEMP/cron_secret")"
          code="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/start.json" -w '%{http_code}'             -H "Authorization: Bearer $CRON_SECRET_VALUE"             "$PUBLIC_ORIGIN/api/collector-run")"
          echo "COLLECTOR_TRIGGER_HTTP=$code"
          python3 - "$RUNNER_TEMP/start.json" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1],encoding='utf-8'))
              c=d.get('collector') or {}
              print('COLLECTOR_ACTION=' + str(c.get('action') or d.get('error') or 'UNKNOWN'))
              print('COLLECTOR_CYCLE_ID=' + str(c.get('cycle_id') or ''))
          except Exception:
              print('COLLECTOR_RESPONSE_INVALID')
          PY
          if [[ "$code" != "202" && "$code" != "409" ]]; then
            echo '::error::Collector trigger failed.'
            exit 1
          fi

      - name: Prove durable takeover
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 75); do
            curl -sS --max-time 20 "$PUBLIC_ORIGIN/api/collector-status" -o "$RUNNER_TEMP/collector.json"
            curl -sS --max-time 20 "$PUBLIC_ORIGIN/api/status" -o "$RUNNER_TEMP/status.json"
            summary="$(python3 - "$RUNNER_TEMP/collector.json" "$RUNNER_TEMP/status.json" <<'PY'
          import json,sys
          c=(json.load(open(sys.argv[1],encoding='utf-8')).get('collector') or {})
          s=(json.load(open(sys.argv[2],encoding='utf-8')).get('snapshot') or {})
          publish=(c.get('stages') or {}).get('publish') or {}
          print('|'.join([
              str(c.get('completed_stage_count') or 0),
              str(c.get('total_stage_count') or 0),
              str(publish.get('status') or ''),
              str(s.get('source_mode') or ''),
              str(s.get('freshness') or ''),
              str(s.get('snapshot_as_of') or ''),
          ]))
          PY
          )"
            IFS='|' read -r done total publish source fresh asof <<< "$summary"
            echo "Attempt $attempt: stages=$done/$total publish=$publish source=$source freshness=$fresh snapshot=$asof"
            if [[ "$publish" = "COMPLETED" && "$source" = "DATABASE" && "$fresh" = "FRESH" ]]; then
              echo 'VERCEL_NEON_DURABLE_TAKEOVER=PASS'
              exit 0
            fi
            sleep 20
          done
          echo '::error::Durable takeover was not proven within bounded polling.'
          exit 1
