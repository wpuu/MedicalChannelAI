name: Preview Regenerate Medical Snapshot

on:
  push:
    branches:
      - preview/multi-region-snapshot-regeneration
    paths:
      - '.github/workflows/preview-regenerate-medical-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: preview-regenerate-medical-snapshot
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 10

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/multi-region-snapshot-regeneration
          fetch-depth: 0

      - name: Regenerate static snapshot with current scope rules
        shell: bash
        run: |
          set -euo pipefail
          AS_OF="$(python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Shanghai')).isoformat())
          PY
          )"
          python3 web/pipeline/scripts/publish_web_snapshot.py \
            --as-of "${AS_OF}" \
            --input web/pipeline/data/tianjin_live_ccgp_records.json \
            --input web/pipeline/data/tianjin_live_tjmugh_records.json \
            --input web/pipeline/data/tianjin_live_tjnothop_records.json \
            --input web/pipeline/data/tianjin_live_tjzxfc_records.json \
            --input web/pipeline/data/tianjin_live_tjzyefy_records.json \
            --input web/pipeline/data/tianjin_live_tjzyefy_intent_records.json \
            --input web/pipeline/data/tianjin_live_teda_records.json \
            --input web/pipeline/data/tianjin_live_tjfch_records.json \
            --event-input web/pipeline/data/tianjin_notice_events.json \
            --output web/public/data/today-actions.public.json

      - name: Verify regenerated snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm run prebuild

      - name: Commit regenerated preview snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/data/today-actions.public.json
          if git diff --cached --quiet; then
            echo 'No snapshot change'
            exit 0
          fi
          git commit -m 'data: regenerate preview medical snapshot'
          git push origin HEAD:preview/multi-region-snapshot-regeneration
