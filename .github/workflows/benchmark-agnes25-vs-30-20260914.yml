name: Benchmark Agnes 2.5 vs 3.0 2026-09-14

on:
  push:
    branches: [benchmark/agnes25-vs-30-20260914]
    paths:
      - '.github/workflows/benchmark-agnes25-vs-30-20260914.yml'

permissions:
  contents: read

concurrency:
  group: medicalchannelai-agnes-ab-20260914
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 35
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_jEy8Ex9vRDBdXj1cQPKF8sRd
      VERCEL_PROJECT_ID: prj_7fk44eKUhdbfTUaXxEBMgIzZiqUM
      BASE_SHA: ac26f308258eaefc6fb74bfa723e9dbf3cf2d57e
    steps:
      - name: Require deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo '::error::VERCEL_TOKEN missing'; exit 1; }

      - name: Checkout exact main baseline
        uses: actions/checkout@v4
        with:
          ref: ac26f308258eaefc6fb74bfa723e9dbf3cf2d57e
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build fixed verified corpus and ephemeral benchmark endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('web/pipeline/data')
          positive_files = [
              root / 'tianjin_live_teda_records.json',
              root / 'tianjin_live_tjmugh_records.json',
              root / 'tianjin_live_tjzyefy_intent_records.json',
          ]
          negative_files = [
              root / 'tianjin_live_tjfch_records.json',
              root / 'tianjin_live_tjzyefy_records.json',
              root / 'tianjin_live_ccgp_records.json',
          ]
          positive_states = {'MARKET_RESEARCH', 'PROCUREMENT_INTENT', 'SUPPLIER_RECRUITMENT'}
          negative_states = {'BIDDING', 'AWARD', 'RESULT'}

          def collect(paths, states):
              out = []
              seen = set()
              for path in paths:
                  rows = json.loads(path.read_text(encoding='utf-8'))
                  for row in rows:
                      facts = row.get('facts') or {}
                      source = row.get('source') or {}
                      state = str(facts.get('lifecycle_state') or '').upper()
                      title = str(facts.get('project_name') or '').strip()
                      url = str(source.get('url') or '').strip()
                      if state not in states or not title or not url or url in seen:
                          continue
                      seen.add(url)
                      out.append({'title': title, 'url': url, 'label': 'positive' if states is positive_states else 'negative', 'state': state})
              return out

          positives = collect(positive_files, positive_states)
          negatives = collect(negative_files, negative_states)
          positives = sorted(positives, key=lambda x: (x['state'], x['url']))[:12]
          if len(positives) < 8:
              raise SystemExit(f'not enough positive gold: {len(positives)}')
          negatives = sorted(negatives, key=lambda x: (x['state'], x['url']))[:len(positives)]
          if len(negatives) != len(positives):
              raise SystemExit(f'negative corpus mismatch: {len(negatives)} vs {len(positives)}')
          corpus = positives + negatives
          print(json.dumps({'positive_count': len(positives), 'negative_count': len(negatives), 'total': len(corpus), 'positive_states': sorted({x['state'] for x in positives}), 'negative_states': sorted({x['state'] for x in negatives})}, ensure_ascii=False))

          endpoint = r'''const MODELS = new Set(['agnes-2.5-flash', 'agnes-3.0-flash'])
          const CORPUS = __CORPUS__
          const DEFAULT_BASE_URL = 'https://api.agnes.ai/v1'
          const SIGNAL_TYPES = new Set(['MARKET_RESEARCH', 'SUPPLIER_RECRUITMENT', 'PROCUREMENT_INTENT'])
          const SYSTEM_PROMPT = '你是医疗行业公开商机发现器。只从输入的官方公开来源链接列表中挑选仍可能影响需求、测试、论证、方案或采购准备的前期窗口。' +
            '优先：需求调研、供应商征集、测试企业征集、论证邀请、采购意向。' +
            '排除：正式招标公告、成交/中标结果、评分细则、招聘、人事、党建、新闻宣传、纯制度通知。' +
            '禁止补全、改写、猜测URL；只能原样返回输入URL。不要把判断说成已验证事实。严格输出JSON，不要Markdown。'

          function getApiKeys() {
            const raw = process.env.AGNES_API_KEYS || process.env.AGNES_API_KEY || ''
            return raw.split(/[\n,;]+/).map((item) => item.trim()).filter(Boolean)
          }

          function jsonContent(content) {
            return String(content || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '').trim()
          }

          function buildMessages(anchors) {
            return [
              { role: 'system', content: SYSTEM_PROMPT },
              {
                role: 'user',
                content: JSON.stringify({
                  source: 'MedicalChannelAI 固定 A/B 基准语料',
                  source_kind: 'VERIFIED_BENCHMARK_CORPUS',
                  anchors,
                  max_candidates: 12,
                  output_schema: {
                    candidates: [{
                      title: '对应输入标题',
                      url: '必须与输入URL完全一致',
                      signal_type: Array.from(SIGNAL_TYPES),
                      confidence: '0到1',
                      reason: '不超过80个汉字',
                    }],
                  },
                }),
              },
            ]
          }

          function parseCandidates(content, anchors) {
            let payload
            try { payload = JSON.parse(jsonContent(content)) } catch { return { ok: false, error: 'AI_RESPONSE_INVALID_JSON', accepted: [], rawCount: 0, rejectedUngrounded: 0, rejectedInvalid: 1 } }
            if (!payload || typeof payload !== 'object' || !Array.isArray(payload.candidates)) {
              return { ok: false, error: 'AI_RESPONSE_INVALID_SCHEMA', accepted: [], rawCount: 0, rejectedUngrounded: 0, rejectedInvalid: 1 }
            }
            const allowed = new Map(anchors.map((item) => [item.url, item]))
            const accepted = []
            const seen = new Set()
            let rejectedUngrounded = 0
            let rejectedInvalid = 0
            for (const row of payload.candidates) {
              if (!row || typeof row !== 'object') { rejectedInvalid += 1; continue }
              const rawUrl = typeof row.url === 'string' ? row.url.trim() : ''
              const anchor = allowed.get(rawUrl)
              if (!anchor) { rejectedUngrounded += 1; continue }
              const signalType = typeof row.signal_type === 'string' ? row.signal_type.trim().toUpperCase() : ''
              const confidence = Number(row.confidence)
              const reason = typeof row.reason === 'string' ? row.reason.replace(/\s+/g, ' ').trim() : ''
              if (!SIGNAL_TYPES.has(signalType) || !Number.isFinite(confidence) || confidence < 0 || confidence > 1 || !reason) { rejectedInvalid += 1; continue }
              if (seen.has(rawUrl)) continue
              seen.add(rawUrl)
              accepted.push({ title: anchor.title, url: rawUrl, signal_type: signalType, confidence, reason: reason.slice(0, 160) })
            }
            return { ok: true, error: null, accepted, rawCount: payload.candidates.length, rejectedUngrounded, rejectedInvalid }
          }

          export default async function handler(req, res) {
            const keys = getApiKeys()
            if (req.method === 'GET') {
              return res.status(200).json({ key_count: keys.length, corpus_count: CORPUS.length, positive_count: CORPUS.filter(x => x.label === 'positive').length, negative_count: CORPUS.filter(x => x.label === 'negative').length, models: Array.from(MODELS) })
            }
            if (req.method !== 'POST') return res.status(405).json({ error: 'METHOD_NOT_ALLOWED' })
            if (!keys.length) return res.status(503).json({ error: 'AGNES_KEY_MISSING' })
            const model = String(req.body?.model || '')
            if (!MODELS.has(model)) return res.status(400).json({ error: 'MODEL_NOT_ALLOWED' })
            const requestedSlot = Number(req.body?.key_slot)
            if (!Number.isInteger(requestedSlot) || requestedSlot < 0 || requestedSlot >= keys.length) return res.status(400).json({ error: 'KEY_SLOT_INVALID', key_count: keys.length })
            const timeoutMsRaw = Number(req.body?.timeout_ms || 12000)
            const timeoutMs = Math.max(1000, Math.min(45000, timeoutMsRaw))
            const anchors = CORPUS.map(({ title, url }) => ({ title, url }))
            const labels = new Map(CORPUS.map(x => [x.url, x.label]))
            const baseUrl = String(process.env.AGNES_API_BASE_URL || DEFAULT_BASE_URL).trim().replace(/\/+$/, '')
            const controller = new AbortController()
            const timeout = setTimeout(() => controller.abort(), timeoutMs)
            const started = Date.now()
            try {
              const response = await fetch(`${baseUrl}/chat/completions`, {
                method: 'POST',
                signal: controller.signal,
                headers: { Authorization: `Bearer ${keys[requestedSlot]}`, 'Content-Type': 'application/json', Accept: 'application/json' },
                body: JSON.stringify({ model, messages: buildMessages(anchors), temperature: 0, max_tokens: 1400, stream: false }),
              })
              const latencyMs = Date.now() - started
              if (!response.ok) return res.status(200).json({ provider_ok: false, model, key_slot: requestedSlot, key_count: keys.length, timeout_ms: timeoutMs, latency_ms: latencyMs, error: `UPSTREAM_HTTP_${response.status}` })
              const payload = await response.json()
              const content = payload?.choices?.[0]?.message?.content
              if (typeof content !== 'string' || !content.trim()) return res.status(200).json({ provider_ok: false, model, key_slot: requestedSlot, key_count: keys.length, timeout_ms: timeoutMs, latency_ms: latencyMs, error: 'UPSTREAM_CONTENT_EMPTY' })
              const parsed = parseCandidates(content, anchors)
              const positives = CORPUS.filter(x => x.label === 'positive')
              const negatives = CORPUS.filter(x => x.label === 'negative')
              const selected = parsed.accepted.map(x => x.url)
              const selectedSet = new Set(selected)
              const positiveHits = positives.filter(x => selectedSet.has(x.url)).length
              const falsePositives = negatives.filter(x => selectedSet.has(x.url)).length
              const recall = positives.length ? positiveHits / positives.length : 0
              const falsePositiveRate = negatives.length ? falsePositives / negatives.length : 0
              const precision = selected.length ? positiveHits / selected.length : 1
              return res.status(200).json({
                provider_ok: parsed.ok,
                parse_error: parsed.error,
                model,
                key_slot: requestedSlot,
                key_count: keys.length,
                timeout_ms: timeoutMs,
                latency_ms: latencyMs,
                corpus_count: CORPUS.length,
                positive_count: positives.length,
                negative_count: negatives.length,
                raw_candidate_count: parsed.rawCount,
                candidate_count: selected.length,
                positive_hits: positiveHits,
                false_positives: falsePositives,
                recall: Number(recall.toFixed(4)),
                false_positive_rate: Number(falsePositiveRate.toFixed(4)),
                precision: Number(precision.toFixed(4)),
                rejected_ungrounded_count: parsed.rejectedUngrounded,
                rejected_invalid_count: parsed.rejectedInvalid,
                selected_labels: selected.map(url => labels.get(url) || null),
                production_data_mutated: false,
              })
            } catch (error) {
              const latencyMs = Date.now() - started
              const name = error?.name || 'Error'
              const message = String(error?.message || error || '')
              const timedOut = name === 'AbortError' || /aborted/i.test(message)
              return res.status(200).json({ provider_ok: false, model, key_slot: requestedSlot, key_count: keys.length, timeout_ms: timeoutMs, latency_ms: latencyMs, error: timedOut ? 'TIMEOUT' : 'PROVIDER_EXCEPTION' })
            } finally {
              clearTimeout(timeout)
            }
          }
          '''
          endpoint = endpoint.replace('__CORPUS__', json.dumps(corpus, ensure_ascii=False))
          out = Path('web/api/benchmark/agnes-ab.js')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(endpoint, encoding='utf-8')
          PY

      - name: Link exact Vercel project locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_jEy8Ex9vRDBdXj1cQPKF8sRd","projectId":"prj_7fk44eKUhdbfTUaXxEBMgIzZiqUM"}' > .vercel/project.json

      - name: Deploy isolated staged Production benchmark
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_URL="$(npx --yes vercel@latest deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN")"
          case "$DEPLOY_URL" in https://*) ;; *) echo '::error::No staged deployment URL'; exit 1;; esac
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Staged benchmark URL: $DEPLOY_URL"
          echo "Production domain switch: skipped"

      - name: Run fair A/B across every Production key slot
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.stage.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/agnes-ab
          for attempt in $(seq 1 24); do
            if npx --yes vercel@latest curl "$DEPLOY_URL/api/benchmark/agnes-ab" --token="$VERCEL_TOKEN" > /tmp/agnes-ab/info.json 2>/tmp/agnes-ab/info.err; then
              break
            fi
            sleep 5
          done
          test -s /tmp/agnes-ab/info.json || { cat /tmp/agnes-ab/info.err || true; echo '::error::Benchmark endpoint unavailable'; exit 1; }
          cat /tmp/agnes-ab/info.json
          KEY_COUNT="$(node -e "const x=require('/tmp/agnes-ab/info.json'); process.stdout.write(String(x.key_count||0))")"
          test "$KEY_COUNT" -gt 0 || { echo '::error::No Production Agnes keys visible to staged deployment'; exit 1; }
          test "$KEY_COUNT" -le 20 || { echo '::error::Unexpected key count'; exit 1; }

          call_one() {
            model="$1"; slot="$2"; timeout_ms="$3"; phase="$4"
            out="/tmp/agnes-ab/${phase}-${model}-${slot}.json"
            body="{\"model\":\"$model\",\"key_slot\":$slot,\"timeout_ms\":$timeout_ms}"
            npx --yes vercel@latest curl "$DEPLOY_URL/api/benchmark/agnes-ab" --token="$VERCEL_TOKEN" -X POST -H 'Content-Type: application/json' -d "$body" > "$out"
            MODEL="$model" SLOT="$slot" PHASE="$phase" FILE="$out" node <<'NODE'
          const fs = require('node:fs')
          const x = JSON.parse(fs.readFileSync(process.env.FILE, 'utf8'))
          console.log(JSON.stringify({phase:process.env.PHASE,model:process.env.MODEL,key_slot:Number(process.env.SLOT),provider_ok:x.provider_ok??false,error:x.error||x.parse_error||null,latency_ms:x.latency_ms??null,recall:x.recall??null,false_positive_rate:x.false_positive_rate??null,precision:x.precision??null,candidate_count:x.candidate_count??null,rejected_ungrounded_count:x.rejected_ungrounded_count??null,rejected_invalid_count:x.rejected_invalid_count??null}))
          if (x.production_data_mutated === true) process.exit(3)
          NODE
          }

          for model in agnes-2.5-flash agnes-3.0-flash; do
            for slot in $(seq 0 $((KEY_COUNT-1))); do call_one "$model" "$slot" 12000 sla12; done
          done
          for model in agnes-2.5-flash agnes-3.0-flash; do
            for slot in $(seq 0 $((KEY_COUNT-1))); do call_one "$model" "$slot" 30000 quality30; done
          done

          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const dir = '/tmp/agnes-ab'
          const files = fs.readdirSync(dir).filter(x => /^(sla12|quality30)-agnes-/.test(x) && x.endsWith('.json'))
          const rows = files.map(name => ({phase:name.split('-agnes-')[0], ...JSON.parse(fs.readFileSync(path.join(dir,name),'utf8'))}))
          function percentile(values, p) {
            if (!values.length) return null
            const a=[...values].sort((x,y)=>x-y)
            const idx=Math.min(a.length-1,Math.max(0,Math.ceil(p*a.length)-1))
            return a[idx]
          }
          const report={}
          for (const phase of ['sla12','quality30']) {
            report[phase]={}
            for (const model of ['agnes-2.5-flash','agnes-3.0-flash']) {
              const r=rows.filter(x=>x.phase===phase && x.model===model)
              const ok=r.filter(x=>x.provider_ok===true)
              const avg=(k)=>ok.length?Number((ok.reduce((s,x)=>s+Number(x[k]??0),0)/ok.length).toFixed(4)):null
              const lats=r.map(x=>Number(x.latency_ms)).filter(Number.isFinite)
              report[phase][model]={
                attempts:r.length,
                successes:ok.length,
                success_rate:r.length?Number((ok.length/r.length).toFixed(4)):0,
                timeouts:r.filter(x=>x.error==='TIMEOUT').length,
                p50_latency_ms:percentile(lats,0.5),
                p95_latency_ms:percentile(lats,0.95),
                avg_recall:avg('recall'),
                avg_false_positive_rate:avg('false_positive_rate'),
                avg_precision:avg('precision'),
                avg_candidate_count:avg('candidate_count'),
                total_rejected_ungrounded:ok.reduce((s,x)=>s+Number(x.rejected_ungrounded_count||0),0),
                total_rejected_invalid:ok.reduce((s,x)=>s+Number(x.rejected_invalid_count||0),0),
              }
            }
          }
          fs.writeFileSync('/tmp/agnes-ab/report.json', JSON.stringify(report,null,2))
          console.log('=== AGNES A/B REPORT ===')
          console.log(JSON.stringify(report,null,2))
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n## Agnes 2.5 vs 3.0 A/B\n\n\`\`\`json\n${JSON.stringify(report,null,2)}\n\`\`\`\n`)
          NODE

      - name: Final safety note
        if: always()
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.stage.outputs.url }}
        run: |
          echo "Benchmark deployment only: ${DEPLOY_URL:-not-created}"
          echo "No Promote/domain switch was performed."
          echo "No verified snapshot write was performed."
