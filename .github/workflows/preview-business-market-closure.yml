name: Preview Business Market Closure

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-business-market-closure.yml

permissions:
  contents: write

concurrency:
  group: preview-business-market-closure
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 25
    steps:
      - name: Checkout Preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 0

      - name: Correct one-shot patch count
        run: python3 web/scripts/fix_business_patch_script.py

      - name: Apply explicit business-market closure
        run: python3 web/scripts/preview_patch_business_markets.py

      - name: Run business-market focused regression
        run: python3 -m unittest web.pipeline.tests.test_business_market_preferences

      - name: Verify system Node
        run: |
          node --version
          npm --version

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run full production build verification
        working-directory: web
        run: npm run build

      - name: Remove one-shot patch machinery
        run: |
          rm -f web/scripts/preview_patch_business_markets.py
          rm -f web/scripts/fix_business_patch_script.py
          rm -f .github/workflows/preview-business-market-closure.yml

      - name: Commit verified Preview changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: close explicit business market selection"
          git push origin HEAD:preview/multi-region-ui-acceptance
