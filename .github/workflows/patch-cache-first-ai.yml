name: One-time cache-first AI patch

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/opportunity-ranking-v2-final
          fetch-depth: 1

      - name: Apply cache-first AI patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          core_path = Path('web/api/ai/_analyzeCore.js')
          core = core_path.read_text(encoding='utf-8')

          old_create = """  const createResult = () => {
            if (!createPromise) {
              createPromise = getOrCreateWarmDecision(cacheKey, providerArgs, keys, opportunityId, request)
            }
            return createPromise
          }
          """
          new_create = """  const createResult = () => {
            if (keys.length === 0) {
              const error = new Error('AI_NOT_CONFIGURED')
              error.code = 'AI_NOT_CONFIGURED'
              throw error
            }
            if (!createPromise) {
              createPromise = getOrCreateWarmDecision(cacheKey, providerArgs, keys, opportunityId, request)
            }
            return createPromise
          }
          """
          if old_create not in core:
              raise SystemExit('createResult target not found')
          core = core.replace(old_create, new_create, 1)

          old_guard = """  const keys = getApiKeys()
          if (keys.length === 0) return sendJson(response, 503, { error: 'AI_NOT_CONFIGURED' })

          const baseUrl = (process.env.AGNES_BASE_URL || DEFAULT_BASE_URL).trim()
          """
          new_guard = """  const keys = getApiKeys()
          const baseUrl = (process.env.AGNES_BASE_URL || DEFAULT_BASE_URL).trim()
          """
          if old_guard not in core:
              raise SystemExit('early key guard target not found')
          core = core.replace(old_guard, new_guard, 1)

          old_catch = """  } catch (error) {
            const status = Number(error?.status)
            if (error?.code === 'AI_RESPONSE_INVALID') return sendJson(response, 502, { error: 'AI_RESPONSE_INVALID' })
          """
          new_catch = """  } catch (error) {
            const status = Number(error?.status)
            if (error?.code === 'AI_NOT_CONFIGURED') return sendJson(response, 503, { error: 'AI_NOT_CONFIGURED' })
            if (error?.code === 'AI_RESPONSE_INVALID') return sendJson(response, 502, { error: 'AI_RESPONSE_INVALID' })
          """
          if old_catch not in core:
              raise SystemExit('catch target not found')
          core = core.replace(old_catch, new_catch, 1)
          core_path.write_text(core, encoding='utf-8')

          today_path = Path('web/src/pages/TodayPage.tsx')
          today = today_path.read_text(encoding='utf-8')
          old_today = """      setRuntimeStatus((current) => current ? { ...current, ai: { configured: true } } : current)
          """
          if old_today not in today:
              raise SystemExit('Today configured=true target not found')
          today = today.replace(old_today, '', 1)
          today_path.write_text(today, encoding='utf-8')

          detail_path = Path('web/src/pages/OpportunityDetailPage.tsx')
          detail = detail_path.read_text(encoding='utf-8')
          old_detail = """      setRuntimeStatus((current) =>
            current ? { ...current, ai: { configured: true } } : current,
          )
          """
          if old_detail not in detail:
              raise SystemExit('Detail configured=true target not found')
          detail = detail.replace(old_detail, '', 1)
          detail_path.write_text(detail, encoding='utf-8')

          test_path = Path('web/pipeline/tests/test_durable_public_intelligence.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = """    def test_shared_public_ai_table_contains_no_account_scope(self) -> None:
          """
          new_test = """    def test_cached_public_ai_can_render_without_provider_key_or_false_status(self) -> None:
              core = (WEB_ROOT / 'api' / 'ai' / '_analyzeCore.js').read_text(encoding='utf-8')
              db = (WEB_ROOT / 'api' / '_publicIntelligenceDb.js').read_text(encoding='utf-8')
              today = (WEB_ROOT / 'src' / 'pages' / 'TodayPage.tsx').read_text(encoding='utf-8')
              detail = (WEB_ROOT / 'src' / 'pages' / 'OpportunityDetailPage.tsx').read_text(encoding='utf-8')

              self.assertNotIn("if (keys.length === 0) return sendJson(response, 503, { error: 'AI_NOT_CONFIGURED' })", core)
              create_start = core.index('const createResult = () => {')
              create_end = core.index('if (!sharedPublic)', create_start)
              create_block = core[create_start:create_end]
              self.assertIn('if (keys.length === 0)', create_block)
              self.assertIn("error.code = 'AI_NOT_CONFIGURED'", create_block)
              self.assertIn("if (error?.code === 'AI_NOT_CONFIGURED') return sendJson(response, 503", core)
              self.assertLess(db.index('if (cached[0])'), db.index('createdResult = await createResult()'))
              self.assertNotIn('ai: { configured: true }', today)
              self.assertNotIn('ai: { configured: true }', detail)

          """
          if anchor not in tests:
              raise SystemExit('test insertion anchor not found')
          tests = tests.replace(anchor, new_test + anchor, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

          rm .github/workflows/patch-cache-first-ai.yml

      - name: Run focused regression
        shell: bash
        run: |
          set -euo pipefail
          cd web/pipeline
          python3 -m unittest tests.test_durable_public_intelligence -v

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name wpuu
          git config user.email xgyk@163.com
          git add web/api/ai/_analyzeCore.js \
                  web/src/pages/TodayPage.tsx \
                  web/src/pages/OpportunityDetailPage.tsx \
                  web/pipeline/tests/test_durable_public_intelligence.py \
                  .github/workflows/patch-cache-first-ai.yml
          git commit -m "fix: reuse grounded public AI cache without provider key [full-verify]"
          git push origin HEAD:chatgpt/opportunity-ranking-v2-final
