name: One-time cache-first AI patch

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/opportunity-ranking-v2-final
          fetch-depth: 1

      - name: Apply cache-first AI patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          core_path = Path('web/api/ai/_analyzeCore.js')
          core = core_path.read_text(encoding='utf-8')

          create_marker = "  const createResult = () => {\n"
          if core.count(create_marker) != 1:
              raise SystemExit(f'createResult marker count={core.count(create_marker)}')
          core = core.replace(
              create_marker,
              create_marker
              + "    if (keys.length === 0) {\n"
              + "      const error = new Error('AI_NOT_CONFIGURED')\n"
              + "      error.code = 'AI_NOT_CONFIGURED'\n"
              + "      throw error\n"
              + "    }\n",
              1,
          )

          early_guard = "  if (keys.length === 0) return sendJson(response, 503, { error: 'AI_NOT_CONFIGURED' })\n"
          if core.count(early_guard) != 1:
              raise SystemExit(f'early key guard count={core.count(early_guard)}')
          core = core.replace(early_guard, '', 1)

          status_line = "    const status = Number(error?.status)\n"
          catch_at = core.rfind(status_line)
          if catch_at < 0:
              raise SystemExit('final catch status line not found')
          insert_at = catch_at + len(status_line)
          core = (
              core[:insert_at]
              + "    if (error?.code === 'AI_NOT_CONFIGURED') return sendJson(response, 503, { error: 'AI_NOT_CONFIGURED' })\n"
              + core[insert_at:]
          )
          core_path.write_text(core, encoding='utf-8')

          today_path = Path('web/src/pages/TodayPage.tsx')
          today = today_path.read_text(encoding='utf-8')
          false_provider_line = "      setRuntimeStatus((current) => current ? { ...current, ai: { configured: true } } : current)\n"
          if today.count(false_provider_line) != 1:
              raise SystemExit(f'Today configured=true count={today.count(false_provider_line)}')
          today_path.write_text(today.replace(false_provider_line, '', 1), encoding='utf-8')

          detail_path = Path('web/src/pages/OpportunityDetailPage.tsx')
          detail = detail_path.read_text(encoding='utf-8')
          detail, detail_count = re.subn(
              r"\n      setRuntimeStatus\(\(current\) =>\n        current \? \{ \.\.\.current, ai: \{ configured: true \} \} : current,\n      \)\n",
              "\n",
              detail,
              count=1,
          )
          if detail_count != 1:
              raise SystemExit(f'Detail configured=true count={detail_count}')
          detail_path.write_text(detail, encoding='utf-8')

          test_path = Path('web/pipeline/tests/test_durable_public_intelligence.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = "    def test_shared_public_ai_table_contains_no_account_scope(self) -> None:\n"
          if tests.count(anchor) != 1:
              raise SystemExit(f'test insertion anchor count={tests.count(anchor)}')
          new_test = (
              "    def test_cached_public_ai_can_render_without_provider_key_or_false_status(self) -> None:\n"
              "        core = (WEB_ROOT / 'api' / 'ai' / '_analyzeCore.js').read_text(encoding='utf-8')\n"
              "        db = (WEB_ROOT / 'api' / '_publicIntelligenceDb.js').read_text(encoding='utf-8')\n"
              "        today = (WEB_ROOT / 'src' / 'pages' / 'TodayPage.tsx').read_text(encoding='utf-8')\n"
              "        detail = (WEB_ROOT / 'src' / 'pages' / 'OpportunityDetailPage.tsx').read_text(encoding='utf-8')\n"
              "\n"
              "        self.assertNotIn(\"if (keys.length === 0) return sendJson(response, 503, { error: 'AI_NOT_CONFIGURED' })\", core)\n"
              "        create_start = core.index('const createResult = () => {')\n"
              "        create_end = core.index('if (!sharedPublic)', create_start)\n"
              "        create_block = core[create_start:create_end]\n"
              "        self.assertIn('if (keys.length === 0)', create_block)\n"
              "        self.assertIn(\"error.code = 'AI_NOT_CONFIGURED'\", create_block)\n"
              "        self.assertIn(\"if (error?.code === 'AI_NOT_CONFIGURED') return sendJson(response, 503\", core)\n"
              "        self.assertLess(db.index('if (cached[0])'), db.index('createdResult = await createResult()'))\n"
              "        self.assertNotIn('ai: { configured: true }', today)\n"
              "        self.assertNotIn('ai: { configured: true }', detail)\n"
              "\n"
          )
          test_path.write_text(tests.replace(anchor, new_test + anchor, 1), encoding='utf-8')
          PY

          rm .github/workflows/patch-cache-first-ai.yml

      - name: Run focused regression
        shell: bash
        run: |
          set -euo pipefail
          cd web/pipeline
          python3 -m unittest tests.test_durable_public_intelligence -v

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name wpuu
          git config user.email xgyk@163.com
          git add web/api/ai/_analyzeCore.js \
                  web/src/pages/TodayPage.tsx \
                  web/src/pages/OpportunityDetailPage.tsx \
                  web/pipeline/tests/test_durable_public_intelligence.py \
                  .github/workflows/patch-cache-first-ai.yml
          git commit -m "fix: reuse grounded public AI cache without provider key [full-verify]"
          git push origin HEAD:chatgpt/opportunity-ranking-v2-final
