name: Public demo smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check both application entrypoints and their served snapshot health
        run: python3 web/scripts/public-demo-smoke.py

      - name: Warn while qd.je still uses retired VPS address
        shell: bash
        run: |
          set -euo pipefail
          addresses="$(getent ahostsv4 medicalai.qd.je | awk '{print $1}' | sort -u | tr '\n' ' ')"
          echo "medicalai.qd.je IPv4: $addresses"
          if [[ " $addresses " == *" 35.211.124.40 "* ]]; then
            echo "::warning::medicalai.qd.je still points to retired paid VPS address 35.211.124.40; migrate to zero-cost hosting before releasing the VPS."
          fi
