name: Public demo smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Persist stage-level collector evidence in existing Actions logs
        shell: bash
        run: |
          set -uo pipefail
          code="$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/collector-status.json -w '%{http_code}' 'https://medicalchannelai.vercel.app/api/collector-status?fresh=1' || true)"
          if [[ "$code" != "200" ]]; then
            echo "::warning::COLLECTOR_STATUS_READ_FAILED:HTTP_$code"
            exit 0
          fi
          python3 - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          payload = json.loads(Path('/tmp/collector-status.json').read_text(encoding='utf-8'))
          collector = payload.get('collector') or {}
          stages = collector.get('stages') or {}
          summary = {
              'local_date': collector.get('local_date'),
              'cycle_as_of': collector.get('cycle_as_of'),
              'active_cycle': bool(collector.get('active_cycle_id')),
              'completed_stages': collector.get('completed_stage_count'),
              'total_stages': collector.get('total_stage_count'),
              'stages': {
                  name: {
                      'status': row.get('status'),
                      'error_code': row.get('error_code'),
                      'attempts': row.get('attempt_count'),
                      'new_verified_record_count': (row.get('result') or {}).get('new_verified_record_count'),
                  }
                  for name, row in stages.items() if isinstance(row, dict)
              },
          }
          print('MCAI_COLLECTOR_DIAGNOSTIC=' + json.dumps(summary, ensure_ascii=False, sort_keys=True))
          now = datetime.now(ZoneInfo('Asia/Shanghai'))
          publish = stages.get('publish') or {}
          if now.hour >= 12 and (
              collector.get('local_date') != now.date().isoformat()
              or publish.get('status') != 'COMPLETED'
          ):
              print('::warning::COLLECTOR_DAILY_CYCLE_NOT_PUBLISHED_AFTER_NOON')
          PY

      - name: Check public demo URLs
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            url="$1"
            code="$(curl -L --connect-timeout 10 --max-time 30 -sS -o /dev/null -w '%{http_code}' "$url")"
            final="$(curl -L --connect-timeout 10 --max-time 30 -sS -o /dev/null -w '%{url_effective}' "$url")"
            echo "$url -> HTTP $code -> $final"
            test "$code" -ge 200
            test "$code" -lt 400
          }

          check_url "https://medicalchannelai.vercel.app/"
          check_url "https://medicalchannelai.vercel.app/today"
          check_url "https://medicalai.qd.je/"

      - name: Check application status
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 10 --max-time 30 -fsS             "https://medicalchannelai.vercel.app/api/status"             -o /tmp/status.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/status.json').read_text(encoding='utf-8'))
          print(json.dumps({
              'service': payload.get('service'),
              'commit': payload.get('commit'),
              'ready': payload.get('ready'),
              'degraded': payload.get('degraded'),
              'snapshot': payload.get('snapshot'),
          }, ensure_ascii=False))
          if payload.get('ready') is not True:
              raise SystemExit('api/status ready != true')
          snapshot = payload.get('snapshot') or {}
          if snapshot.get('freshness') != 'FRESH':
              raise SystemExit('Daily verified snapshot is stale: not a passing website refresh')
          health = snapshot.get('collection_health') or {}
          if health.get('mode') == 'DEGRADED':
              print('::warning::Daily source coverage degraded; inspect collector-status before business use')
          PY

      - name: Warn while qd.je still uses retired VPS address
        shell: bash
        run: |
          set -euo pipefail
          addresses="$(getent ahostsv4 medicalai.qd.je | awk '{print $1}' | sort -u | tr '\n' ' ')"
          echo "medicalai.qd.je IPv4: $addresses"
          if [[ " $addresses " == *" 35.211.124.40 "* ]]; then
            echo "::warning::medicalai.qd.je still points to retired paid VPS address 35.211.124.40; migrate to zero-cost hosting before releasing the VPS."
          fi
