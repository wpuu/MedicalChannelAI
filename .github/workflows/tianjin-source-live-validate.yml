name: Tianjin Source Live Validate

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final
    paths:
      - .github/workflows/tianjin-source-live-validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compute one validation timestamp
        id: clock
        shell: bash
        run: |
          set -euo pipefail
          AS_OF="$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Shanghai')).isoformat())
          PY
          )"
          echo "as_of=${AS_OF}" >> "$GITHUB_OUTPUT"
          echo "Validation as-of: ${AS_OF}"

      - name: Validate TEDA production sync against live official pages
        shell: bash
        run: |
          set -euo pipefail
          python web/pipeline/scripts/sync_teda_market_research.py \
            --as-of '${{ steps.clock.outputs.as_of }}' \
            --lookback-days 90 \
            --index-pages 4 \
            --max-candidates 20 \
            --delay-seconds 3 \
            --existing-records-input web/pipeline/data/tianjin_live_teda_records.json \
            --records-output /tmp/teda-records.json \
            --report-output /tmp/teda-report.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/teda-report.json', encoding='utf-8'))
          print(json.dumps({
              'source': 'TEDA',
              'discovered': report.get('discovered_early_title_count'),
              'considered': report.get('considered_candidate_count'),
              'verified': report.get('new_verified_record_count'),
              'old': report.get('out_of_window_count'),
              'unsupported': report.get('unsupported_candidate_count'),
              'failures': report.get('failure_count'),
              'gate': report.get('publish_gate_reason'),
          }, ensure_ascii=False))
          PY

      - name: Validate First Central Hospital procurement sync against live official pages
        shell: bash
        run: |
          set -euo pipefail
          python web/pipeline/scripts/sync_tjfch_procurement.py \
            --as-of '${{ steps.clock.outputs.as_of }}' \
            --lookback-days 45 \
            --max-candidates 20 \
            --delay-seconds 3 \
            --existing-records-input web/pipeline/data/tianjin_live_tjfch_records.json \
            --records-output /tmp/tjfch-procurement-records.json \
            --report-output /tmp/tjfch-procurement-report.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/tjfch-procurement-report.json', encoding='utf-8'))
          print(json.dumps({
              'source': 'TJFCH_PROCUREMENT',
              'discovered': report.get('discovered_supported_count'),
              'selected': report.get('selected_candidate_count'),
              'verified': report.get('new_verified_record_count'),
              'unsupported': report.get('unsupported_candidate_count'),
              'failures': report.get('failure_count'),
              'gate': report.get('publish_gate_reason'),
          }, ensure_ascii=False))
          PY

      - name: Validate First Central Hospital test-recruitment sync against live official pages
        shell: bash
        run: |
          set -euo pipefail
          python web/pipeline/scripts/sync_tjfch_test_recruitment.py \
            --as-of '${{ steps.clock.outputs.as_of }}' \
            --lookback-days 14 \
            --max-candidates 30 \
            --delay-seconds 3 \
            --existing-records-input /tmp/tjfch-procurement-records.json \
            --records-output /tmp/tjfch-combined-records.json \
            --report-output /tmp/tjfch-test-report.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/tjfch-test-report.json', encoding='utf-8'))
          records = json.load(open('/tmp/tjfch-combined-records.json', encoding='utf-8'))
          relative = [
              row for row in records
              if 'RELATIVE_REGISTRATION_WINDOW_7_DAYS' in (row.get('quality_flags') or [])
          ]
          print(json.dumps({
              'source': 'TJFCH_TEST_RECRUITMENT',
              'discovered': report.get('discovered_candidate_count'),
              'verified': report.get('new_verified_record_count'),
              'out_of_window': report.get('out_of_window_count'),
              'unsupported': report.get('unsupported_candidate_count'),
              'failures': report.get('failure_count'),
              'gate': report.get('publish_gate_reason'),
              'combined_records': len(records),
              'relative_window_records': len(relative),
              'relative_titles': [row.get('facts', {}).get('project_name') for row in relative[:10]],
              'relative_public_deadlines': [
                  {
                      'registration_deadline': row.get('facts', {}).get('registration_deadline'),
                      'registration_deadline_date': row.get('facts', {}).get('registration_deadline_date'),
                      'bid_deadline': row.get('facts', {}).get('bid_deadline'),
                  }
                  for row in relative[:10]
              ],
          }, ensure_ascii=False))
          PY
