name: Medical Pilot CI

on:
  pull_request:
    paths:
      - "tools/medical_pilot/**"
      - "docs/research/schemas/medical-*.schema.json"
      - "docs/research/fixtures/tianjin-*.json"
      - ".github/workflows/medical-pilot-ci.yml"
  push:
    branches:
      - "dev/tianjin-pilot-v0.1"
    paths:
      - "tools/medical_pilot/**"
      - "docs/research/schemas/medical-*.schema.json"
      - "docs/research/fixtures/tianjin-*.json"
      - ".github/workflows/medical-pilot-ci.yml"

permissions:
  contents: read

jobs:
  python-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile pilot modules
        run: python -m compileall -q tools/medical_pilot
      - name: Run deterministic pilot tests
        run: python -m unittest discover -s tools/medical_pilot -p "test_*.py" -v
      - name: Validate research JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = list(Path("docs/research/schemas").glob("medical-*.schema.json"))
          paths.extend(Path("docs/research/fixtures").glob("tianjin-*.json"))
          paths.extend(
              [
                  Path("tools/medical_pilot/source_registry.tianjin.v0.1.json"),
                  Path("tools/medical_pilot/coverage_manifest.tianjin.v0.1.json"),
                  Path("tools/medical_pilot/source_topology.tianjin.v0.1.json"),
              ]
          )
          for path in paths:
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
              print(f"valid json: {path}")
          PY
