name: Medical Pilot CI

on:
  pull_request:
    paths:
      - "tools/medical_pilot/**"
      - "web/**"
      - "docs/research/schemas/medical-*.schema.json"
      - "docs/research/fixtures/tianjin-*.json"
      - "docs/research/benchmarks/*.json"
      - ".github/workflows/medical-pilot-ci.yml"
  push:
    branches:
      - "dev/tianjin-pilot-v0.1"
    paths:
      - "tools/medical_pilot/**"
      - "web/**"
      - "docs/research/schemas/medical-*.schema.json"
      - "docs/research/fixtures/tianjin-*.json"
      - "docs/research/benchmarks/*.json"
      - ".github/workflows/medical-pilot-ci.yml"

permissions:
  contents: read

jobs:
  python-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile pilot modules
        run: python -m compileall -q tools/medical_pilot
      - name: Run deterministic pilot tests
        run: python -m unittest discover -s tools/medical_pilot -p "test_*.py" -v
      - name: Validate research JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = list(Path("docs/research/schemas").glob("medical-*.schema.json"))
          paths.extend(Path("docs/research/fixtures").glob("tianjin-*.json"))
          paths.extend(Path("docs/research/benchmarks").glob("*.json"))
          paths.extend(Path("tools/medical_pilot").glob("*.tianjin.v0.1.json"))
          paths.extend(Path("tools/medical_pilot").glob("product_*.v0.1.json"))
          paths.extend(Path("tools/medical_pilot").glob("agnes_*.v0.1.json"))
          seen = set()
          for path in paths:
              if path in seen:
                  continue
              seen.add(path)
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
              print(f"valid json: {path}")
          PY

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install H5 dependencies
        run: npm ci
      - name: Typecheck H5
        run: npx tsc --noEmit
      - name: Build H5
        run: npm run build
