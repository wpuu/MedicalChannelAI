name: PR6 Today private-state scale patch

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/opportunity-ranking-v2-final
          fetch-depth: 0
      - name: Make Today private-state lookup fail closed above bounded scale
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/api/private.js')
          text = path.read_text(encoding='utf-8')
          old = '''async function todayFollowupMap(sql, user) {
            const rows = await sql`
              SELECT opportunity_id, status, remind_at
              FROM private_followups
              WHERE user_id = ${user.id} AND organization_id = ${user.organization_id}
              LIMIT 500
            `
            return new Map(rows.map((row) => [row.opportunity_id, row]))
          }

          async function todayFeedbackMap(sql, user) {
            const rows = await sql`
              SELECT opportunity_id, value
              FROM private_recommendation_feedback
              WHERE user_id = ${user.id}
              LIMIT 500
            `
            return new Map(rows.map((row) => [row.opportunity_id, row.value]))
          }
          '''
          new = '''async function todayFollowupMap(sql, user) {
            const rows = await sql`
              SELECT opportunity_id, status, remind_at
              FROM private_followups
              WHERE user_id = ${user.id} AND organization_id = ${user.organization_id}
              ORDER BY updated_at DESC, id DESC
              LIMIT 5001
            `
            if (rows.length > 5000) throw new Error('TODAY_FOLLOWUP_INDEX_TRUNCATED')
            return new Map(rows.map((row) => [row.opportunity_id, row]))
          }

          async function todayFeedbackMap(sql, user) {
            const rows = await sql`
              SELECT opportunity_id, value
              FROM private_recommendation_feedback
              WHERE user_id = ${user.id}
              ORDER BY updated_at DESC, opportunity_id ASC
              LIMIT 5001
            `
            if (rows.length > 5000) throw new Error('TODAY_FEEDBACK_INDEX_TRUNCATED')
            return new Map(rows.map((row) => [row.opportunity_id, row.value]))
          }
          '''
          if old not in text:
              raise SystemExit('Today private state block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('web/pipeline/tests/test_today_feedback_attention.py')
          test_text = test.read_text(encoding='utf-8')
          marker = '''    def test_attention_sort_is_stable_inside_each_feedback_tier(self):
          '''
          addition = '''    def test_today_private_state_indexes_fail_closed_instead_of_silently_truncating(self):
              source = (WEB_ROOT / "api" / "private.js").read_text(encoding="utf-8")
              start = source.index("async function todayFollowupMap")
              end = source.index("function hasActiveFollowup", start)
              index_source = source[start:end]
              self.assertEqual(index_source.count("LIMIT 5001"), 2)
              self.assertIn("TODAY_FOLLOWUP_INDEX_TRUNCATED", index_source)
              self.assertIn("TODAY_FEEDBACK_INDEX_TRUNCATED", index_source)
              self.assertNotIn("LIMIT 500\\n", index_source)

          '''
          if marker not in test_text:
              raise SystemExit('Today feedback test marker not found')
          test.write_text(test_text.replace(marker, addition + marker, 1), encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/api/private.js web/pipeline/tests/test_today_feedback_attention.py
          git commit -m "fix: fail closed when Today private-state indexes exceed bound"
          git push origin HEAD:chatgpt/opportunity-ranking-v2-final
