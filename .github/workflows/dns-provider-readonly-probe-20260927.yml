name: MCAI DNS Provider Readonly Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dns-provider-readonly-probe-20260927.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 3
    steps:
      - name: Query public DNS metadata
        shell: bash
        run: |
          set -u
          echo '=== MCAI_GCP_RETIRE_006 START ==='
          echo '--- NS qd.je ---'
          curl -fsS --max-time 20 -H 'accept: application/dns-json' 'https://cloudflare-dns.com/dns-query?name=qd.je&type=NS' || true
          echo
          echo '--- CNAME medicalai.qd.je ---'
          curl -fsS --max-time 20 -H 'accept: application/dns-json' 'https://cloudflare-dns.com/dns-query?name=medicalai.qd.je&type=CNAME' || true
          echo
          echo '--- A medicalai.qd.je ---'
          curl -fsS --max-time 20 -H 'accept: application/dns-json' 'https://cloudflare-dns.com/dns-query?name=medicalai.qd.je&type=A' || true
          echo
          echo '=== MCAI_GCP_RETIRE_006 END ==='
