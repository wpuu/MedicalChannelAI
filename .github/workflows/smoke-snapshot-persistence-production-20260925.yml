name: Smoke Snapshot Persistence Staged Production 2026-09-25

on:
  push:
    branches: [release/snapshot-persistence-production-20260925]
    paths:
      - '.github/workflows/smoke-snapshot-persistence-production-20260925.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 7
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: rerisse7-1717s-projects
      DEPLOY_URL: https://medicalchannelai-pivnuvfoz-rerisse7-1717s-projects.vercel.app
    steps:
      - name: Require deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo '::error::VERCEL_TOKEN missing'; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify staged status
        shell: bash
        run: |
          set -euo pipefail
          STATUS_JSON="$(npx --yes vercel@latest curl "$DEPLOY_URL/api/status" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" -fsS)"
          STATUS_JSON="$STATUS_JSON" node <<'NODE'
          const s = JSON.parse(process.env.STATUS_JSON || '{}');
          const ok = s.ready === true && s.degraded === false && s.ai?.configured === true &&
            s.snapshot?.available === true && s.snapshot?.freshness === 'FRESH' &&
            s.snapshot?.today_card_count === 5 && s.snapshot?.opportunity_pool_count === 372 &&
            s.snapshot?.source_mode === 'RUNTIME_CACHE' && s.snapshot?.runtime_origin === 'BUNDLED';
          console.log(`staged ready=${s.ready} degraded=${s.degraded} ai=${s.ai?.configured} source=${s.snapshot?.source_mode}/${s.snapshot?.runtime_origin} freshness=${s.snapshot?.freshness} today=${s.snapshot?.today_card_count} pool=${s.snapshot?.opportunity_pool_count} snapshot=${s.snapshot?.snapshot_as_of}`);
          if (!ok) process.exit(1);
          NODE

      - name: Verify staged public snapshot
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT_JSON="$(npx --yes vercel@latest curl "$DEPLOY_URL/api/public-snapshot" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" -fsS)"
          SNAPSHOT_JSON="$SNAPSHOT_JSON" node <<'NODE'
          const s = JSON.parse(process.env.SNAPSHOT_JSON || '{}');
          const ok = s.snapshot_as_of === '2026-09-24T13:32:02.844764+08:00' &&
            s.card_count === 5 && s.opportunity_pool_count === 372 && s.matched_count === 372;
          console.log(`snapshot=${s.snapshot_as_of} today=${s.card_count} pool=${s.opportunity_pool_count}`);
          if (!ok) process.exit(1);
          NODE
