name: Verify MedicalChannelAI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Run full prebuild, typecheck and production build
        working-directory: web
        run: npm run build
