name: Patch Agnes 3 live discovery 2026-09-14

on:
  push:
    branches: [release/agnes3-live-20260914]
    paths:
      - '.github/workflows/patch-agnes3-live-20260914.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 5
    steps:
      - name: Replace only live Agnes model IDs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const paths = [
              'web/api/ai/discover.js',
              'web/api/ai/_discoverContinuation.js',
            ];
            const oldLine = "const MODEL_ID = 'agnes-2.5-flash'";
            const newLine = "const MODEL_ID = 'agnes-3.0-flash'";
            for (const path of paths) {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (Array.isArray(current.data) || current.data.type !== 'file') {
                core.setFailed(`${path}: expected a file`);
                return;
              }
              const text = Buffer.from(current.data.content, 'base64').toString('utf8');
              const count = text.split(oldLine).length - 1;
              if (count !== 1) {
                core.setFailed(`${path}: expected exactly one old MODEL_ID, got ${count}`);
                return;
              }
              const next = text.replace(oldLine, newLine);
              if (next.includes(oldLine) || (next.split(newLine).length - 1) !== 1) {
                core.setFailed(`${path}: replacement postcondition failed`);
                return;
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path,
                branch,
                sha: current.data.sha,
                message: `ai: upgrade live Agnes discovery to 3.0 Flash (${path})`,
                content: Buffer.from(next, 'utf8').toString('base64'),
              });
              core.info(`${path}: agnes-2.5-flash -> agnes-3.0-flash`);
            }
