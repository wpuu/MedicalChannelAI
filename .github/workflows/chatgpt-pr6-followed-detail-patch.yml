name: PR6 followed detail lookup patch

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/opportunity-ranking-v2-final
          fetch-depth: 0
      - name: Add exact historical followed lookup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Backend: keep list bounded, but support exact lookup by opportunity id on same route/function.
          path = Path('web/api/private.js')
          text = path.read_text(encoding='utf-8')
          start = text.index('async function followedRoute(request, response, user) {')
          end = text.index('\nfunction reminderPublicFacts', start)
          old = text[start:end]
          new = '''function followedItemFromRow(row) {
            if (!FOLLOWUP_STATUSES.has(row.status)) return null
            const snapshot = sanitizeStoredSnapshot(row.public_snapshot)
            if (!snapshot) return null
            return {
              opportunity_id: row.opportunity_id,
              followup_status: row.status,
              remind_at: row.remind_at ? new Date(row.remind_at).toISOString() : null,
              latest_note: nullableText(row.latest_note),
              followup_updated_at: new Date(row.updated_at).toISOString(),
              facts: snapshot.facts,
              evidence_source_urls: snapshot.evidence_source_urls,
            }
          }

          async function followedRoute(request, response, user) {
            if (!allow(request, response, ['GET'])) return
            const rawRequestedId = firstQuery(request, 'id')
            const requestedId = rawRequestedId === undefined ? null : opportunityId(request)
            if (rawRequestedId !== undefined && !requestedId) {
              return sendJson(response, 400, { error: 'OPPORTUNITY_ID_INVALID' })
            }

            const sql = privateDb()
            try {
              if (requestedId) {
                const rows = await sql`
                  SELECT
                    f.opportunity_id, f.status, f.remind_at, f.public_snapshot, f.updated_at,
                    (
                      SELECT e.note FROM private_followup_events e
                      WHERE e.followup_id = f.id AND e.user_id = ${user.id}
                        AND e.note IS NOT NULL AND length(trim(e.note)) > 0
                      ORDER BY e.created_at DESC, e.id DESC LIMIT 1
                    ) AS latest_note
                  FROM private_followups f
                  WHERE f.user_id = ${user.id}
                    AND f.organization_id = ${user.organization_id}
                    AND f.opportunity_id = ${requestedId}
                  LIMIT 1
                `
                const item = rows[0] ? followedItemFromRow(rows[0]) : null
                if (!item) return sendJson(response, 404, { error: 'FOLLOWED_OPPORTUNITY_NOT_FOUND' })
                return sendJson(response, 200, {
                  schema_version: '0.1', mode: 'FOLLOWED_OPPORTUNITY', item,
                })
              }

              const rows = await sql`
                SELECT
                  f.opportunity_id, f.status, f.remind_at, f.public_snapshot, f.updated_at,
                  (
                    SELECT e.note FROM private_followup_events e
                    WHERE e.followup_id = f.id AND e.user_id = ${user.id}
                      AND e.note IS NOT NULL AND length(trim(e.note)) > 0
                    ORDER BY e.created_at DESC, e.id DESC LIMIT 1
                  ) AS latest_note
                FROM private_followups f
                WHERE f.user_id = ${user.id} AND f.organization_id = ${user.organization_id}
                ORDER BY f.updated_at DESC, f.id DESC
                LIMIT 100
              `
              const items = rows.map(followedItemFromRow).filter(Boolean)
              return sendJson(response, 200, {
                schema_version: '0.1', mode: 'FOLLOWED_OPPORTUNITIES', count: items.length, items,
              })
            } catch (error) {
              console.error('private followed request failed', {
                opportunity_id: requestedId,
                error: error instanceof Error ? error.message : 'UNKNOWN',
              })
              return sendJson(response, 500, { error: 'FOLLOWED_REQUEST_FAILED' })
            }
          }
          '''
          path.write_text(text[:start] + new + text[end:], encoding='utf-8')

          # Frontend: historical detail no longer searches the bounded 100-row list.
          path = Path('web/src/services/followedApi.ts')
          text = path.read_text(encoding='utf-8')
          marker = '''function verificationStatus(value: string | null): TodayActionCard['facts']['verification_status'] {'''
          insert = '''async function getFollowedOpportunityById(opportunityId: string): Promise<FollowedOpportunity | null> {
            const response = await fetch(`${apiBaseUrl}/followed?id=${encodeURIComponent(opportunityId)}`, {
              credentials: 'include',
              headers: { Accept: 'application/json' },
            })
            if (response.status === 404) return null
            if (!response.ok) throw await responseError(response)
            const root = asRecord(await response.json())
            if (
              !root ||
              !exactKeys(root, ['schema_version', 'mode', 'item']) ||
              root.schema_version !== '0.1' ||
              root.mode !== 'FOLLOWED_OPPORTUNITY'
            ) {
              throw new Error('FOLLOWED_RESPONSE_INVALID')
            }
            return validateItem(root.item)
          }

          '''
          if marker not in text:
              raise SystemExit('followedApi insertion marker not found')
          text = text.replace(marker, insert + marker, 1)
          old = '''  const followed = await getFollowedOpportunities()
            const item = followed.find((row) => row.opportunity_id === opportunityId)
            if (!item) return null
          '''
          new = '''  const item = await getFollowedOpportunityById(opportunityId)
            if (!item) return null
          '''
          if old not in text:
              raise SystemExit('historical followed list lookup not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('web/pipeline/tests/test_followed_history_lookup.py')
          test.write_text('''import unittest\nfrom pathlib import Path\n\n\nWEB_ROOT = Path(__file__).resolve().parents[2]\n\n\nclass FollowedHistoryLookupTests(unittest.TestCase):\n    def test_historical_detail_uses_exact_server_lookup_not_bounded_recent_list(self):\n        frontend = (WEB_ROOT / "src" / "services" / "followedApi.ts").read_text(encoding="utf-8")\n        start = frontend.index("export async function getHistoricalFollowedOpportunityCard")\n        historical = frontend[start:]\n        self.assertIn("getFollowedOpportunityById(opportunityId)", historical)\n        self.assertNotIn("await getFollowedOpportunities()", historical)\n        self.assertIn("/followed?id=${encodeURIComponent(opportunityId)}", frontend)\n\n    def test_exact_lookup_is_user_and_organization_scoped(self):\n        backend = (WEB_ROOT / "api" / "private.js").read_text(encoding="utf-8")\n        start = backend.index("async function followedRoute")\n        end = backend.index("function reminderPublicFacts", start)\n        followed = backend[start:end]\n        self.assertIn("f.opportunity_id = ${requestedId}", followed)\n        self.assertIn("f.user_id = ${user.id}", followed)\n        self.assertIn("f.organization_id = ${user.organization_id}", followed)\n        self.assertIn("mode: 'FOLLOWED_OPPORTUNITY'", followed)\n        self.assertIn("LIMIT 100", followed)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/api/private.js web/src/services/followedApi.ts web/pipeline/tests/test_followed_history_lookup.py
          git commit -m "fix: make historical followed lookup independent of recent list limit"
          git push origin HEAD:chatgpt/opportunity-ranking-v2-final
