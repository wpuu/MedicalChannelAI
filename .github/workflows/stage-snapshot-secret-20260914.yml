name: Stage snapshot secret 2026-09-14

on:
  push:
    branches: [release/snapshot-secret-stage-20260914]
    paths:
      - '.github/workflows/stage-snapshot-secret-20260914.yml'

permissions:
  contents: read

jobs:
  stage:
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SNAPSHOT_TOKEN: ${{ secrets.VERIFIED_SNAPSHOT_PUBLISH_TOKEN }}
      VERCEL_ORG_ID: team_jEy8Ex9vRDBdXj1cQPKF8sRd
      VERCEL_PROJECT_ID: prj_7fk44eKUhdbfTUaXxEBMgIzZiqUM
    steps:
      - name: Require credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo '::error::VERCEL_TOKEN missing'; exit 1; }
          test "${#SNAPSHOT_TOKEN}" -ge 24 || { echo '::error::VERIFIED_SNAPSHOT_PUBLISH_TOKEN missing or too short'; exit 1; }
          echo 'Credential presence gate: PASS'

      - name: Configure Vercel Production snapshot secret
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json, os
          payload = {
              'key': 'VERIFIED_SNAPSHOT_PUBLISH_TOKEN',
              'value': os.environ['SNAPSHOT_TOKEN'],
              'type': 'sensitive',
              'target': ['production'],
              'comment': 'MedicalChannelAI authenticated verified-snapshot publisher',
          }
          with open('/tmp/vercel-env.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f)
          PY
          HTTP_CODE="$(curl --silent --show-error --output /tmp/vercel-env-response.json --write-out '%{http_code}' \
            --request POST \
            --url "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true&teamId=${VERCEL_ORG_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/vercel-env.json)"
          rm -f /tmp/vercel-env.json /tmp/vercel-env-response.json
          case "$HTTP_CODE" in 200|201) ;; *) echo "::error::Vercel env upsert failed HTTP $HTTP_CODE"; exit 1;; esac
          echo "Vercel Production snapshot secret configured: HTTP $HTTP_CODE"

      - name: Checkout exact accepted main
        uses: actions/checkout@v4
        with:
          ref: 5b35ea51f45774b110147d3fbf7d0c66b5e749cf
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Link exact Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_jEy8Ex9vRDBdXj1cQPKF8sRd","projectId":"prj_7fk44eKUhdbfTUaXxEBMgIzZiqUM"}' > .vercel/project.json

      - name: Create staged Production deployment without domain switch
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_URL="$(npx --yes vercel@latest deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN")"
          case "$DEPLOY_URL" in https://*) ;; *) echo '::error::No staged URL returned'; exit 1;; esac
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Staged Production URL: $DEPLOY_URL"
          echo "Exact source SHA: 5b35ea51f45774b110147d3fbf7d0c66b5e749cf"
          echo 'Production domain switch: skipped'
