name: Regional Medical Refresh

on:
  schedule:
    - cron: '50 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regional-medical-refresh.yml'
      - 'web/pipeline/data/admin_division_source.json'
      - 'web/pipeline/data/multi_region_query_plan.json'
      - 'web/pipeline/data/regional_award_query_plan.json'
      - 'web/pipeline/data/medical_channel_scope.json'
      - 'web/pipeline/scripts/sync_national_admin_divisions.py'
      - 'web/pipeline/scripts/diagnose_ccgp_search.py'
      - 'web/pipeline/scripts/sync_regional_ccgp.py'
      - 'web/pipeline/scripts/sync_ccgp_awards.py'
      - 'web/pipeline/scripts/sync_regional_awards.py'
      - 'web/pipeline/scripts/publish_web_snapshot.py'
      - 'web/pipeline/scripts/publish_snapshot_http.py'
      - 'web/pipeline/scripts/verify_snapshot_roundtrip.py'
      - 'web/pipeline/scripts/publish_generated_data_github.py'
      - 'web/pipeline/medical_channel_pipeline/ccgp_discovery.py'
      - 'web/pipeline/medical_channel_pipeline/ccgp_detail.py'
      - 'web/pipeline/medical_channel_pipeline/ccgp_award.py'
      - 'web/pipeline/medical_channel_pipeline/regional_candidate.py'
      - 'web/pipeline/medical_channel_pipeline/channel_scope.py'
      - 'web/pipeline/medical_channel_pipeline/state.py'
      - 'web/pipeline/medical_channel_pipeline/validation.py'
      - 'web/pipeline/medical_channel_pipeline/public_snapshot.py'
      - 'web/pipeline/tests/test_regional_candidate_classification.py'
      - 'web/pipeline/tests/test_channel_scope.py'
      - 'web/pipeline/tests/test_snapshot_http_publish.py'
      - 'web/pipeline/tests/test_snapshot_roundtrip.py'

permissions:
  contents: write

concurrency:
  group: medicalchannel-deep-refresh-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify regional classification and CCGP parser regressions
        shell: bash
        run: |
          set -euo pipefail
          cd web/pipeline
          python3 -m unittest \
            tests.test_regional_candidate_classification \
            tests.test_channel_scope \
            tests.test_ccgp_detail \
            tests.test_ccgp_national_detail_formats \
            tests.test_ccgp_liaoning_detail_format \
            tests.test_snapshot_http_publish \
            tests.test_snapshot_roundtrip \
            tests.test_ccgp_award \
            tests.test_regional_award_sync

      - name: Materialize nationwide administrative divisions
        shell: bash
        run: |
          set -euo pipefail
          python3 web/pipeline/scripts/sync_national_admin_divisions.py \
            --output web/pipeline/data/national_admin_divisions.latest.json

      - name: Compute refresh timestamp
        id: clock
        shell: bash
        run: |
          set -euo pipefail
          AS_OF="$(python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Shanghai')).isoformat())
          PY
          )"
          echo "as_of=${AS_OF}" >> "$GITHUB_OUTPUT"

      - name: Diagnose current CCGP search shape
        continue-on-error: true
        shell: bash
        run: |
          python3 web/pipeline/scripts/diagnose_ccgp_search.py \
            --as-of '${{ steps.clock.outputs.as_of }}'

      - name: Sync verified regional CCGP opportunities
        shell: bash
        run: |
          set -euo pipefail
          python3 web/pipeline/scripts/sync_regional_ccgp.py \
            --as-of '${{ steps.clock.outputs.as_of }}' \
            --existing-records-input web/pipeline/data/regional_live_ccgp_records.json \
            --records-output web/pipeline/data/regional_live_ccgp_records.json \
            --report-output web/pipeline/data/regional_sync_report.json

      - name: Sync regional CCGP 更正/终止 notices (never blocks the refresh)
        # Keyword discovery per market; detail fetched only for titles that name
        # an open pool project; kept only when the official detail's project
        # number matches; every event carries its market_code. A failure here
        # carries the previous event store forward.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          existing_args=()
          if [[ -f web/pipeline/data/regional_notice_events.json ]]; then
            existing_args+=(--existing-events-input web/pipeline/data/regional_notice_events.json)
          fi
          python3 web/pipeline/scripts/sync_regional_events.py \
            --as-of '${{ steps.clock.outputs.as_of }}' \
            "${existing_args[@]}" \
            --records-input web/pipeline/data/regional_live_ccgp_records.json \
            --events-output web/pipeline/data/regional_notice_events.json \
            --report-output web/pipeline/data/regional_event_sync_report.json

      - name: Sync verified regional CCGP award/deal results (never blocks the refresh)
        # 中标/成交 results for 北京/河北/辽宁/吉林/黑龙江: one market at a time,
        # row geography must prove the market, official detail required. A
        # failure here carries the previous award store forward.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          existing_args=()
          if [[ -f web/pipeline/data/regional_award_records.json ]]; then
            existing_args+=(--existing-awards-input web/pipeline/data/regional_award_records.json)
          fi
          python3 web/pipeline/scripts/sync_regional_awards.py \
            --as-of '${{ steps.clock.outputs.as_of }}' \
            "${existing_args[@]}" \
            --records-input web/pipeline/data/regional_live_ccgp_records.json \
            --awards-output web/pipeline/data/regional_award_records.json \
            --report-output web/pipeline/data/regional_award_sync_report.json

      - name: Publish combined verified snapshot
        # Award stores (Tianjin + regional, whichever exist) are picked up by
        # default and split per market inside the publisher.
        shell: bash
        run: |
          set -euo pipefail
          python3 web/pipeline/scripts/publish_web_snapshot.py \
            --as-of '${{ steps.clock.outputs.as_of }}' \
            --input web/pipeline/data/tianjin_live_ccgp_records.json \
            --input web/pipeline/data/tianjin_live_tjmugh_records.json \
            --input web/pipeline/data/tianjin_live_tjnothop_records.json \
            --input web/pipeline/data/tianjin_live_tjzxfc_records.json \
            --input web/pipeline/data/tianjin_live_tjzyefy_records.json \
            --input web/pipeline/data/tianjin_live_tjzyefy_intent_records.json \
            --input web/pipeline/data/tianjin_live_teda_records.json \
            --input web/pipeline/data/tianjin_live_tjfch_records.json \
            --event-input web/pipeline/data/tianjin_notice_events.json \
            --output web/public/data/today-actions.public.json

      - name: Publish and verify optional external snapshot
        shell: bash
        env:
          VERIFIED_SNAPSHOT_PUBLISH_URL: https://medicalchannelai.vercel.app/api/public-snapshot
          VERIFIED_SNAPSHOT_PUBLISH_TOKEN: ${{ secrets.VERIFIED_SNAPSHOT_PUBLISH_TOKEN }}
          VERIFIED_SNAPSHOT_READ_URL: https://medicalchannelai.vercel.app/api/public-snapshot
        run: |
          set -euo pipefail
          if [[ -z "${VERIFIED_SNAPSHOT_PUBLISH_URL:-}" ]]; then
            if [[ -n "${VERIFIED_SNAPSHOT_READ_URL:-}" ]]; then
              echo 'VERIFIED_SNAPSHOT_READ_URL is configured without VERIFIED_SNAPSHOT_PUBLISH_URL.' >&2
              exit 2
            fi
            echo 'External verified-snapshot publishing is not configured; keeping Git snapshot flow only.'
            exit 0
          fi
          if [[ -z "${VERIFIED_SNAPSHOT_READ_URL:-}" ]]; then
            echo 'External snapshot publishing requires VERIFIED_SNAPSHOT_READ_URL for fail-closed readback verification.' >&2
            exit 2
          fi

          python3 web/pipeline/scripts/publish_snapshot_http.py \
            --snapshot web/public/data/today-actions.public.json \
            --method PUT

          verified=0
          for attempt in 1 2 3; do
            if python3 web/pipeline/scripts/verify_snapshot_roundtrip.py \
              --snapshot web/public/data/today-actions.public.json; then
              verified=1
              break
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              echo "External snapshot readback not consistent yet; retry ${attempt}/3 after 2s."
              sleep 2
            fi
          done
          if [[ "${verified}" -ne 1 ]]; then
            echo 'External snapshot round-trip verification failed after 3 attempts.' >&2
            exit 2
          fi

      - name: Commit verified regional refresh
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 web/pipeline/scripts/publish_generated_data_github.py \
            --branch "${GITHUB_REF_NAME}" \
            --message 'data: refresh regional verified opportunities' \
            web/pipeline/data/national_admin_divisions.latest.json \
            web/pipeline/data/regional_live_ccgp_records.json \
            web/pipeline/data/regional_sync_report.json \
            web/pipeline/data/regional_award_records.json \
            web/pipeline/data/regional_award_sync_report.json \
            web/pipeline/data/regional_notice_events.json \
            web/pipeline/data/regional_event_sync_report.json \
            web/public/data/today-actions.public.json

      - name: Pre-generate AI decisions for top opportunities
        # Best effort: users still get on-demand analysis if this is skipped.
        # Runs after the data commit so it never delays or fails the refresh.
        if: success()
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        env:
          AI_PREWARM_URL: https://medicalchannelai.vercel.app/api/ai/analyze
          AI_PREWARM_TOKEN: ${{ secrets.AI_PREWARM_TOKEN }}
          VERIFIED_SNAPSHOT_PUBLISH_TOKEN: ${{ secrets.VERIFIED_SNAPSHOT_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          python3 web/pipeline/scripts/prewarm_ai_decisions.py --rounds 5 --limit 10 --max-candidates 40
