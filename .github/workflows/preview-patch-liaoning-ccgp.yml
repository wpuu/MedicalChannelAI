name: Preview Patch Liaoning CCGP

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-patch-liaoning-ccgp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: self-hosted
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 0

      - name: Apply verified Liaoning parser patch
        run: python3 web/pipeline/scripts/patch_liaoning_ccgp_preview.py

      - name: Verify focused parser regression
        run: |
          cd web/pipeline
          python3 -m unittest tests.test_ccgp_liaoning_detail_format tests.test_ccgp_national_detail_formats -v

      - name: Publish verified parser and remove temporary tooling
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 web/pipeline/scripts/publish_preview_patch_via_api.py
