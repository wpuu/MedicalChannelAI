name: MCAI Domain Path Readonly Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/domain-path-readonly-probe-20260927.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on:
      - self-hosted
      - linux
      - x64
      - medicalchannelai-ci
    timeout-minutes: 4
    steps:
      - name: Resolve and inspect public domain path
        shell: bash
        run: |
          set -u
          echo '=== MCAI_GCP_RETIRE_005 START ==='
          echo '--- DNS ---'
          python3 - <<'PY'
          import socket
          host='medicalai.qd.je'
          try:
              rows=socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)
              print('\n'.join(sorted({r[4][0] for r in rows})))
          except Exception as e:
              print(type(e).__name__, str(e))
          PY
          echo '--- CUSTOM DOMAIN HEADERS ---'
          curl -sS -I --max-time 20 https://medicalai.qd.je/ | sed -n '1,30p' || true
          echo '--- VERCEL DOMAIN HEADERS ---'
          curl -sS -I --max-time 20 https://medicalchannelai.vercel.app/ | sed -n '1,30p' || true
          echo '=== MCAI_GCP_RETIRE_005 END ==='
