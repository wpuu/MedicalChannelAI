name: Preview Live Regional Classification

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-live-regional-classification.yml

permissions:
  contents: write

concurrency:
  group: preview-live-regional-classification
  cancel-in-progress: true

jobs:
  live-refresh:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 25
    steps:
      - name: Checkout Preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 0

      - name: Compute China refresh timestamp
        id: clock
        shell: bash
        run: |
          set -euo pipefail
          AS_OF="$(python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Shanghai')).isoformat())
          PY
          )"
          echo "as_of=${AS_OF}" >> "$GITHUB_OUTPUT"

      - name: Run live verified regional refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 web/pipeline/scripts/sync_national_admin_divisions.py \
            --output web/pipeline/data/national_admin_divisions.latest.json
          python3 web/pipeline/scripts/sync_regional_ccgp.py \
            --as-of '${{ steps.clock.outputs.as_of }}' \
            --existing-records-input web/pipeline/data/regional_live_ccgp_records.json \
            --records-output web/pipeline/data/regional_live_ccgp_records.json \
            --report-output web/pipeline/data/regional_sync_report.json
          python3 web/pipeline/scripts/publish_web_snapshot.py \
            --as-of '${{ steps.clock.outputs.as_of }}' \
            --input web/pipeline/data/tianjin_live_ccgp_records.json \
            --input web/pipeline/data/tianjin_live_tjmugh_records.json \
            --input web/pipeline/data/tianjin_live_tjnothop_records.json \
            --input web/pipeline/data/tianjin_live_tjzxfc_records.json \
            --input web/pipeline/data/tianjin_live_tjzyefy_records.json \
            --input web/pipeline/data/tianjin_live_tjzyefy_intent_records.json \
            --input web/pipeline/data/tianjin_live_teda_records.json \
            --input web/pipeline/data/tianjin_live_tjfch_records.json \
            --event-input web/pipeline/data/tianjin_notice_events.json \
            --output web/public/data/today-actions.public.json

      - name: Verify live classification invariants
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('web/pipeline/data/regional_sync_report.json').read_text(encoding='utf-8'))
          markets = report.get('markets') or []
          if not markets:
              raise SystemExit('REGIONAL_REPORT_HAS_NO_MARKETS')
          if report.get('policy', {}).get('rate_limit_bypass') is not False:
              raise SystemExit('RATE_LIMIT_POLICY_CHANGED')
          if float(report.get('policy', {}).get('minimum_request_delay_seconds') or 0) < 4.0:
              raise SystemExit('RATE_LIMIT_DELAY_TOO_LOW')

          skip_reasons = {'OUT_OF_MEDICAL_SCOPE', 'NON_COMPETITIVE_SINGLE_SOURCE'}
          for market in markets:
              for failure in market.get('failures') or []:
                  title = str(failure.get('title') or '')
                  if '单一来源' in title:
                      raise SystemExit(f'SINGLE_SOURCE_STILL_FAILED:{title}')
                  if '班车' in title or '业务用车租赁' in title:
                      raise SystemExit(f'NON_MEDICAL_VEHICLE_STILL_FAILED:{title}')
              for skipped in market.get('skipped_candidates') or []:
                  reason = skipped.get('reason')
                  if reason not in skip_reasons:
                      raise SystemExit(f'UNKNOWN_SKIP_REASON:{reason}')
                  title = str(skipped.get('title') or '')
                  if reason == 'NON_COMPETITIVE_SINGLE_SOURCE' and '单一来源' not in title:
                      raise SystemExit(f'UNGROUNDED_SINGLE_SOURCE_SKIP:{title}')

          snapshot = json.loads(Path('web/public/data/today-actions.public.json').read_text(encoding='utf-8'))
          pool = snapshot.get('opportunity_pool') or snapshot.get('cards') or []
          market_codes = {str((card.get('facts') or {}).get('market_code') or '') for card in pool}
          expected = {'TJ', 'BJ', 'HE', 'LN', 'JL', 'HL'}
          missing = sorted(expected - market_codes)
          if missing:
              raise SystemExit(f'PUBLISHED_SNAPSHOT_LOST_MARKETS:{missing}')
          print(json.dumps({
              'market_count': len(markets),
              'snapshot_pool_count': len(pool),
              'markets': sorted(market_codes),
              'skipped': {
                  market.get('market_code'): market.get('skipped_candidate_count', 0)
                  for market in markets
              },
              'failures': {
                  market.get('market_code'): len(market.get('failures') or [])
                  for market in markets
              },
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit live-verified data and remove one-shot workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: preview/multi-region-ui-acceptance
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          expected_head = os.environ['EXPECTED_HEAD']
          root = Path.cwd()
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          def call(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              request = Request(url, data=data, headers=headers, method=method)
              with urlopen(request, timeout=60) as response:
                  body = response.read().decode('utf-8')
                  return json.loads(body) if body else {}

          ref_name = quote(f'heads/{branch}', safe='/')
          ref = call('GET', f'{api}/git/ref/{ref_name}')
          head_sha = ref['object']['sha']
          if head_sha != expected_head:
              raise SystemExit(f'REMOTE_HEAD_CHANGED expected={expected_head} actual={head_sha}')
          commit = call('GET', f'{api}/git/commits/{head_sha}')
          base_tree = commit['tree']['sha']
          paths = [
              'web/pipeline/data/national_admin_divisions.latest.json',
              'web/pipeline/data/regional_live_ccgp_records.json',
              'web/pipeline/data/regional_sync_report.json',
              'web/public/data/today-actions.public.json',
          ]
          tree = []
          for path in paths:
              file_path = root / path
              blob = call('POST', f'{api}/git/blobs', {
                  'content': base64.b64encode(file_path.read_bytes()).decode('ascii'),
                  'encoding': 'base64',
              })
              tree.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree.append({
              'path': '.github/workflows/preview-live-regional-classification.yml',
              'mode': '100644', 'type': 'blob', 'sha': None,
          })
          new_tree = call('POST', f'{api}/git/trees', {'base_tree': base_tree, 'tree': tree})
          new_commit = call('POST', f'{api}/git/commits', {
              'message': 'data: live-verify regional candidate classification',
              'tree': new_tree['sha'],
              'parents': [head_sha],
          })
          call('PATCH', f'{api}/git/refs/{ref_name}', {'sha': new_commit['sha'], 'force': False})
          print(f"committed {new_commit['sha']}")
          PY
