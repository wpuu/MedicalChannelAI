name: Preview Diagnose Jilin Snapshot

on:
  push:
    branches:
      - preview/multi-region-ui-acceptance
    paths:
      - .github/workflows/preview-diagnose-jilin-snapshot.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/multi-region-ui-acceptance
          fetch-depth: 0
      - name: Generate post-backfill snapshot diagnostics
        run: |
          set -euo pipefail
          cp web/public/data/today-actions.public.json /tmp/before.json
          cd web/pipeline
          python3 scripts/preview_backfill_verified_jilin_products.py
          cd ../..
          AS_OF="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/before.json', encoding='utf-8'))['snapshot_as_of'])
          PY
          )"
          python3 web/pipeline/scripts/publish_web_snapshot.py --as-of "$AS_OF"
          python3 - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path('/tmp/before.json').read_text(encoding='utf-8'))
          after=json.loads(Path('web/public/data/today-actions.public.json').read_text(encoding='utf-8'))
          b={c['opportunity_id']:c for c in before['opportunity_pool']}
          a={c['opportunity_id']:c for c in after['opportunity_pool']}
          targets=[
            'ccgp_jl_3edf4a29f776eebf','ccgp_jl_92d8a706047d0a62','ccgp_jl_af9636c5bc0f7784',
            'ccgp_jl_40d5ac0960328c51','ccgp_jl_2ef67b2eece8e825','ccgp_jl_37172df35abece06',
            'ccgp_jl_7b4525920ec1cc52','ccgp_jl_25eb3b5947b52eaa']
          def pairs(card):
            if not card:return None
            return [(x.get('raw_name'),x.get('quantity')) for x in (card.get('facts',{}).get('product_items') or [])]
          report={
            'before':{k:before.get(k) for k in ('snapshot_as_of','matched_count','card_count','opportunity_pool_count','model_request_count')},
            'after':{k:after.get(k) for k in ('snapshot_as_of','matched_count','card_count','opportunity_pool_count','model_request_count')},
            'missing_ids':sorted(set(b)-set(a)),
            'added_ids':sorted(set(a)-set(b)),
            'targets':{oid:{'before_rank':b.get(oid,{}).get('rank'),'after_rank':a.get(oid,{}).get('rank'),'before_items':pairs(b.get(oid)),'after_items':pairs(a.get(oid))} for oid in targets},
          }
          Path('web/pipeline/data/preview_jilin_snapshot_diagnostic.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Publish diagnostic only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 web/pipeline/scripts/publish_generated_data_github.py \
            --branch "${GITHUB_REF_NAME}" \
            --message 'chore: capture Jilin snapshot backfill diagnostic' \
            web/pipeline/data/preview_jilin_snapshot_diagnostic.json
