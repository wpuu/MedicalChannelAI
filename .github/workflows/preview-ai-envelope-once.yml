name: Preview AI Envelope Once

on:
  push:
    branches:
      - chatgpt/preview-54495b1
    paths:
      - .github/workflows/preview-ai-envelope-once.yml

permissions:
  contents: read

jobs:
  grounded-ai:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt one-time AI test key in runner memory
        shell: bash
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.medicalchannelai-preview-ai-envelope"
          test -s "$KEY_DIR/private.pem"
          test -s "$KEY_DIR/public.pem"
          EXPECTED_FP='844d2e3566f963f2f5f31f1a94ce78a7e80b90cd97726388d7f984cb8e12e646'
          ACTUAL_FP="$(openssl pkey -pubin -in "$KEY_DIR/public.pem" -outform DER | sha256sum | awk '{print $1}')"
          test "$ACTUAL_FP" = "$EXPECTED_FP"
          CIPHER_B64=''
          printf '%s' "$CIPHER_B64" | base64 -d > /tmp/medicalchannelai-ai-key.enc
          openssl pkeyutl -decrypt \
            -inkey "$KEY_DIR/private.pem" \
            -pkeyopt rsa_padding_mode:pkcs1 \
            -in /tmp/medicalchannelai-ai-key.enc \
            -out /tmp/medicalchannelai-ai-key.txt
          chmod 600 /tmp/medicalchannelai-ai-key.txt
          KEY="$(cat /tmp/medicalchannelai-ai-key.txt)"
          test -n "$KEY"
          echo "::add-mask::$KEY"
          printf 'AGNES_API_KEY=%s\n' "$KEY" >> "$GITHUB_ENV"
          echo 'AI_KEY_ENVELOPE_DECRYPT: PASS'

      - name: Install app runtime dependencies
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null

      - name: Real grounded AI call through application core
        working-directory: web
        env:
          NODE_ENV: production
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/medicalchannelai-grounded-ai-result.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import handler from './api/ai/_analyzeCore.js'

          const request = {
            method: 'POST',
            headers: {
              origin: 'https://preview.local',
              host: 'preview.local',
              'x-forwarded-host': 'preview.local',
              'x-forwarded-for': '127.0.0.1',
            },
            body: { opportunity_id: 'ccgp_bf77073fba23504b' },
          }

          let statusCode = 200
          let payload = null
          const response = {
            setHeader() {},
            status(code) { statusCode = Number(code); return this },
            json(value) { payload = value; return this },
          }

          await handler(request, response)
          const summary = {
            status: statusCode,
            error: payload?.error ?? null,
            opportunity_id: payload?.opportunity_id ?? null,
            snapshot_as_of: payload?.snapshot_as_of ?? null,
            snapshot_source_mode: payload?.snapshot_source_mode ?? null,
            runtime_window_status: payload?.runtime_window_status ?? null,
            decision_source: payload?.decision_source ?? null,
            shared_public_cache: payload?.shared_public_cache ?? null,
            decision: payload?.decision ?? null,
          }
          fs.writeFileSync('/tmp/medicalchannelai-grounded-ai-result.json', JSON.stringify(summary, null, 2))

          if (statusCode !== 200) {
            console.error(`GROUNDED_AI_APP_CORE: FAIL status=${statusCode} error=${payload?.error || 'UNKNOWN'}`)
            process.exit(2)
          }
          if (!payload?.decision || typeof payload.decision !== 'object') throw new Error('DECISION_MISSING')
          if (payload.opportunity_id !== 'ccgp_bf77073fba23504b') throw new Error('OPPORTUNITY_ID_MISMATCH')
          if (payload.decision_source !== 'SHARED_GROUNDED_AI_PUBLIC_FACTS_ONLY') throw new Error('DECISION_SOURCE_UNEXPECTED')
          if (!Array.isArray(payload.decision.reasons) || !Array.isArray(payload.decision.risks)) throw new Error('DECISION_CONTRACT_ARRAYS_MISSING')
          if (payload.decision.requires_human_confirmation !== true) throw new Error('HUMAN_CONFIRMATION_REQUIRED')
          console.log('GROUNDED_AI_APP_CORE: PASS')
          console.log(`GROUNDED_AI_SNAPSHOT=${payload.snapshot_as_of}`)
          console.log(`GROUNDED_AI_WINDOW=${payload.runtime_window_status}`)
          console.log(`GROUNDED_AI_DECISION_SOURCE=${payload.decision_source}`)
          NODE

      - name: Upload sanitized grounded AI result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-grounded-ai-result
          path: /tmp/medicalchannelai-grounded-ai-result.json
          if-no-files-found: warn
          retention-days: 2

      - name: Destroy one-time key material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f /tmp/medicalchannelai-ai-key.enc /tmp/medicalchannelai-ai-key.txt
          rm -rf "$HOME/.medicalchannelai-preview-ai-envelope"
          echo 'AI_KEY_ENVELOPE_CLEANUP: DONE'
