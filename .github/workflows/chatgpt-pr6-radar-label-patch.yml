name: PR6 radar cumulative findings label patch

on:
  push:
    branches:
      - chatgpt/opportunity-ranking-v2-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/opportunity-ranking-v2-final
          fetch-depth: 0
      - name: Clarify cumulative findings label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web/src/pages/DiscoveryRadarPage.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "['累计保存', summary.savedFindings,": "['累计发现', summary.savedFindings,",
              '>累计保存的AI发现</h3>': '>累计发现（已保存）</h3>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'target not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/pages/DiscoveryRadarPage.tsx
          git commit -m "fix: clarify cumulative discovery ledger labels"
          git push origin HEAD:chatgpt/opportunity-ranking-v2-final
