name: Apply Agnes async cache 2026-09-14

on:
  push:
    branches: [fix/agnes-discovery-async-cache-20260914]
    paths:
      - '.github/workflows/apply-agnes-async-cache-20260914.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: [self-hosted, linux, x64, medicalchannelai-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/agnes-discovery-async-cache-20260914
          path: app
          persist-credentials: false

      - name: Apply exact patch helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 app/.github/scripts/apply_agnes_async_cache_20260914.py
          python3 app/.github/scripts/update_agnes_contract_test_20260914.py

      - name: Run focused and full regression
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/web/pipeline"
          python3 -m unittest -v web.pipeline.tests.test_agnes_async_cache
          python3 -m unittest -v web.pipeline.tests.test_agnes_output_contract
          python3 -m unittest -v web.pipeline.tests.test_agnes_model_consistency
          python3 -m unittest discover -s web/pipeline/tests -p 'test_*.py'

      - name: Write tested files back through GitHub API
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: fix/agnes-discovery-async-cache-20260914
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.TARGET_BRANCH;
            const paths = [
              'web/api/ai/discover.js',
              'web/api/ai/_discoverContinuation.js',
              'web/src/services/discoveryRadarApi.ts',
              'web/src/services/discoveryRadarStore.ts',
              'web/src/pages/DiscoveryRadarPage.tsx',
              'web/src/services/discoveryContinuationApi.ts',
              'web/pipeline/tests/test_agnes_async_cache.py',
              'web/pipeline/tests/test_agnes_output_contract.py',
            ];
            for (const path of paths) {
              let sha;
              try {
                const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
                if (!Array.isArray(current.data) && current.data.type === 'file') sha = current.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              const content = fs.readFileSync(`app/${path}`, 'utf8');
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch, sha,
                message: `fix: async Agnes discovery cache (${path})`,
                content: Buffer.from(content, 'utf8').toString('base64'),
              });
              core.info(`wrote ${path}`);
            }

      - name: Remove one-shot helpers and workflow
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: fix/agnes-discovery-async-cache-20260914
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.TARGET_BRANCH;
            for (const path of [
              '.github/scripts/apply_agnes_async_cache_20260914.py',
              '.github/scripts/update_agnes_contract_test_20260914.py',
              '.github/workflows/apply-agnes-async-cache-20260914.yml',
            ]) {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (Array.isArray(current.data) || current.data.type !== 'file') throw new Error(`missing ${path}`);
              await github.rest.repos.deleteFile({
                owner, repo, path, branch, sha: current.data.sha,
                message: `chore: remove one-shot helper ${path}`,
              });
              core.info(`removed ${path}`);
            }
