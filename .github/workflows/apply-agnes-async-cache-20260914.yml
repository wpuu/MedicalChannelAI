      - name: Write tested files back through GitHub API
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: fix/agnes-discovery-async-cache-20260914
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.TARGET_BRANCH;
            const paths = [
              'web/api/ai/discover.js',
              'web/api/ai/_discoverContinuation.js',
              'web/src/services/discoveryRadarApi.ts',
              'web/src/services/discoveryRadarStore.ts',
              'web/src/pages/DiscoveryRadarPage.tsx',
              'web/src/services/discoveryContinuationApi.ts',
              'web/pipeline/tests/test_agnes_async_cache.py',
            ];
            for (const path of paths) {
              let sha;
              try {
                const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
                if (!Array.isArray(current.data) && current.data.type === 'file') sha = current.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              const content = fs.readFileSync(`app/${path}`, 'utf8');
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch, sha,
                message: `fix: async Agnes discovery cache (${path})`,
                content: Buffer.from(content, 'utf8').toString('base64'),
              });
              core.info(`wrote ${path}`);
            }

      - name: Remove one-shot workflow from final branch
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: fix/agnes-discovery-async-cache-20260914
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.TARGET_BRANCH;
            const path = '.github/workflows/apply-agnes-async-cache-20260914.yml';
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            if (Array.isArray(current.data) || current.data.type !== 'file') throw new Error('workflow file missing');
            await github.rest.repos.deleteFile({
              owner, repo, path, branch, sha: current.data.sha,
              message: 'chore: remove one-shot Agnes async-cache workflow',
            });
